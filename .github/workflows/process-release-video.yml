name: Process persistent release video
run-name: Release video ${{ inputs.asset_name }}

on:
  workflow_dispatch:
    inputs:
      media_repository:
        description: owner/repo containing the media release; empty means this repository
        required: false
        default: ""
        type: string
      release_ref:
        description: Release tag, release name, or numeric release id
        required: true
        type: string
      asset_name:
        description: Exact release asset file name
        required: true
        type: string
      request_id:
        description: Optional request identifier
        required: false
        default: ""
        type: string
      profile:
        required: true
        default: balanced
        type: choice
        options: [fast, balanced, accurate]
      model:
        description: Optional explicit model override
        required: false
        default: ""
        type: string
      language:
        required: true
        default: fa
        type: string
      no_editorial:
        required: true
        default: "true"
        type: string
      keep_debug_artifacts:
        required: true
        default: "false"
        type: string
      diarization_enabled:
        required: true
        default: "true"
        type: string
      diarization_required:
        required: true
        default: "false"
        type: string
      num_speakers:
        required: true
        default: "2"
        type: string
      speaker_role_mode:
        required: true
        default: generic
        type: choice
        options: [generic, host-teacher]
      speaker_roles:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INPUT_MEDIA: /tmp/vid-pipeline-release-input/media
      MEDIA_REPOSITORY: ${{ inputs.media_repository }}
      RELEASE_REF: ${{ inputs.release_ref }}
      ASSET_NAME: ${{ inputs.asset_name }}
      REQUEST_ID: ${{ inputs.request_id }}
      PROFILE: ${{ inputs.profile }}
      MODEL: ${{ inputs.model }}
      LANGUAGE: ${{ inputs.language }}
      NO_EDITORIAL: ${{ inputs.no_editorial }}
      DIARIZATION_ENABLED: ${{ inputs.diarization_enabled }}
      DIARIZATION_REQUIRED: ${{ inputs.diarization_required }}
      NUM_SPEAKERS: ${{ inputs.num_speakers }}
      SPEAKER_ROLE_MODE: ${{ inputs.speaker_role_mode }}
      SPEAKER_ROLES: ${{ inputs.speaker_roles }}
      VID_PIPELINE_DIARIZATION_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/diarization
      VID_PIPELINE_DIARIZATION_BACKEND: pyannote-community-1
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
      EDITORIAL_MODEL: qwen3:8b
      OLLAMA_BASE_URL: http://127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve and download release asset
        id: media
        shell: bash
        env:
          GITHUB_REPOSITORY_TOKEN: ${{ github.token }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$INPUT_MEDIA")"
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          api = "https://api.github.com"
          current_repo = os.environ["GITHUB_REPOSITORY"]
          media_repo = os.environ.get("MEDIA_REPOSITORY", "").strip() or current_repo
          token = os.environ.get("MEDIA_REPO_TOKEN", "").strip() or os.environ["GITHUB_REPOSITORY_TOKEN"]
          if media_repo != current_repo and not os.environ.get("MEDIA_REPO_TOKEN", "").strip():
              raise SystemExit(
                  "MEDIA_REPO_TOKEN is required when media_repository points to another repository."
              )

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "vid-pipeline-release-input",
          }

          def request_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          releases = request_json(f"{api}/repos/{media_repo}/releases?per_page=100")
          ref = os.environ["RELEASE_REF"].strip()
          release = next(
              (
                  item
                  for item in releases
                  if str(item.get("id")) == ref
                  or item.get("tag_name") == ref
                  or item.get("name") == ref
              ),
              None,
          )
          if release is None:
              raise SystemExit(f"Release not found: {ref!r} in {media_repo}")

          release_id = int(release["id"])
          assets = request_json(f"{api}/repos/{media_repo}/releases/{release_id}/assets?per_page=100")
          asset_name = os.environ["ASSET_NAME"]
          asset = next((item for item in assets if item.get("name") == asset_name), None)
          if asset is None:
              available = [item.get("name") for item in assets]
              raise SystemExit(f"Release asset not found: {asset_name!r}; available={available!r}")

          asset_id = int(asset["id"])
          target = os.environ["INPUT_MEDIA"]
          download_headers = dict(headers)
          download_headers["Accept"] = "application/octet-stream"
          req = urllib.request.Request(
              f"{api}/repos/{media_repo}/releases/assets/{asset_id}",
              headers=download_headers,
          )
          digest = hashlib.sha256()
          with urllib.request.urlopen(req, timeout=120) as response, open(target + ".part", "wb") as output:
              while chunk := response.read(1024 * 1024):
                  digest.update(chunk)
                  output.write(chunk)
          os.replace(target + ".part", target)

          size = os.path.getsize(target)
          expected_size = int(asset.get("size", -1))
          if expected_size >= 0 and size != expected_size:
              raise SystemExit(f"Downloaded size mismatch: {size} != {expected_size}")
          actual_digest = digest.hexdigest()
          expected_digest = str(asset.get("digest") or "")
          if expected_digest.startswith("sha256:") and expected_digest != f"sha256:{actual_digest}":
              raise SystemExit("Downloaded SHA-256 does not match GitHub release metadata")

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a", encoding="utf-8") as handle:
              handle.write(f"media_repository={media_repo}\n")
              handle.write(f"release_id={release_id}\n")
              handle.write(f"asset_id={asset_id}\n")
              handle.write(f"asset_size={size}\n")
              handle.write(f"sha256={actual_digest}\n")
          print(f"Downloaded authenticated release asset: {size} bytes")
          PY

      - name: Cache pyannote Community-1 model
        if: inputs.diarization_enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: pyannote-${{ runner.os }}-py311-audio-4.0.4-community-1-v1

      - name: Cache project-controlled ASR model
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-faster-whisper-1.2.1-large-v3-turbo-ct2-v1

      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          if [[ "${DIARIZATION_ENABLED,,}" == "true" ]]; then
            pip install -e '.[worker,diarization-pyannote]'
          else
            pip install -e '.[worker]'
          fi

      - name: Start optional local editorial service
        if: inputs.no_editorial == 'false'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null && break
            sleep 2
          done
          curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null
          ollama pull "$EDITORIAL_MODEL"

      - name: Run complete file pipeline
        shell: bash
        env:
          HF_TOKEN: ""
          HUGGING_FACE_HUB_TOKEN: ""
          VID_PIPELINE_PYANNOTE_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          job_name="${REQUEST_ID:-release-${{ github.run_id }}}"
          args=(run-file "$INPUT_MEDIA" --name "$job_name" --output-root outputs \
            --profile "$PROFILE" --language "$LANGUAGE" \
            --device cpu --compute-type int8)
          [[ -n "${MODEL:-}" ]] && args+=(--model "$MODEL")
          if [[ "${NO_EDITORIAL,,}" == "true" ]]; then
            args+=(--no-editorial)
          else
            args+=(--editorial-model "$EDITORIAL_MODEL" --editorial-base-url "$OLLAMA_BASE_URL")
          fi
          if [[ "${DIARIZATION_ENABLED,,}" == "true" ]]; then
            args+=(--diarize --num-speakers "$NUM_SPEAKERS" --speaker-role-mode "$SPEAKER_ROLE_MODE")
            [[ "${DIARIZATION_REQUIRED,,}" == "true" ]] && args+=(--diarization-required)
            IFS=',' read -ra roles <<< "$SPEAKER_ROLES"
            for role in "${roles[@]}"; do [[ -n "$role" ]] && args+=(--speaker-role "$role"); done
          fi
          vid-pipeline "${args[@]}" 2>&1 | tee pipeline.log

      - name: Prepare lean transcript artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transcript-artifact
          find outputs -path '*/delivery/*' -type f -exec cp {} transcript-artifact/ \;
          test "$(find transcript-artifact -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Upload transcript result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-transcript-${{ github.run_id }}
          path: transcript-artifact/*
          retention-days: 7
          if-no-files-found: error

      - name: Upload debug package
        if: success() && inputs.keep_debug_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-debug-${{ github.run_id }}
          path: |
            outputs/**
            pipeline.log
          retention-days: 1

      - name: Remove input and temporary media
        if: always()
        shell: bash
        run: |
          rm -f -- "$INPUT_MEDIA" "$INPUT_MEDIA.part"
          find /tmp/vid-pipeline-release-input -type f -delete 2>/dev/null || true
          find outputs -type f \( -name '*.wav' -o -name '*.mp4' -o -name '*.mkv' \) -delete 2>/dev/null || true
