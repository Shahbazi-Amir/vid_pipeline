name: Private media benchmark
run-name: Private media benchmark #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      asset_index:
        description: 1-based asset position in the newest published private release
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_MEDIA_REPO: ${{ secrets.PRIVATE_MEDIA_REPO }}
      PRIVATE_MEDIA_TOKEN: ${{ secrets.PRIVATE_MEDIA_TOKEN }}
      ASSET_INDEX: ${{ inputs.asset_index }}
      TARGET: /tmp/vid-pipeline-private-media.bin

    steps:
      - name: Validate private media configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_MEDIA_REPO" || { echo "PRIVATE_MEDIA_REPO secret is missing" >&2; exit 1; }
          test -n "$PRIVATE_MEDIA_TOKEN" || { echo "PRIVATE_MEDIA_TOKEN secret is missing" >&2; exit 1; }
          [[ "$ASSET_INDEX" =~ ^[1-9][0-9]*$ ]] || { echo "asset_index must be a positive integer" >&2; exit 1; }

      - name: Download private release asset and benchmark
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api = "https://api.github.com"
          repo = os.environ["PRIVATE_MEDIA_REPO"].strip()
          token = os.environ["PRIVATE_MEDIA_TOKEN"].strip()
          index = int(os.environ["ASSET_INDEX"]) - 1
          target = os.environ["TARGET"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "vid-pipeline-private-media-benchmark",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"Private media API request failed with HTTP {exc.code}") from None

          releases = get_json(f"{api}/repos/{repo}/releases?per_page=100")
          selected_assets = None
          for release in releases:
              if release.get("draft"):
                  continue
              release_id = int(release["id"])
              assets = get_json(f"{api}/repos/{repo}/releases/{release_id}/assets?per_page=100")
              if assets:
                  selected_assets = assets
                  break

          if not selected_assets:
              raise SystemExit("No published private release with assets was found")
          if index >= len(selected_assets):
              raise SystemExit(f"asset_index is out of range; release has {len(selected_assets)} assets")

          asset = selected_assets[index]
          asset_id = int(asset["id"])
          expected_size = int(asset.get("size", -1))
          expected_digest = str(asset.get("digest") or "")

          download_headers = dict(headers)
          download_headers["Accept"] = "application/octet-stream"
          request = urllib.request.Request(
              f"{api}/repos/{repo}/releases/assets/{asset_id}",
              headers=download_headers,
          )

          digest = hashlib.sha256()
          temporary = target + ".part"
          started = time.monotonic()
          try:
              with urllib.request.urlopen(request, timeout=120) as response, open(temporary, "wb") as output:
                  while chunk := response.read(1024 * 1024):
                      digest.update(chunk)
                      output.write(chunk)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Private release asset download failed with HTTP {exc.code}") from None

          elapsed = max(time.monotonic() - started, 0.001)
          os.replace(temporary, target)
          size = os.path.getsize(target)
          actual_digest = digest.hexdigest()

          if expected_size >= 0 and size != expected_size:
              raise SystemExit("Downloaded asset size mismatch")
          if expected_digest.startswith("sha256:") and expected_digest != f"sha256:{actual_digest}":
              raise SystemExit("Downloaded asset SHA-256 mismatch")

          mib_per_second = size / 1024 / 1024 / elapsed
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"size_bytes={size}\n")
              output.write(f"seconds={elapsed:.3f}\n")
              output.write(f"mib_per_second={mib_per_second:.3f}\n")

          print(f"Private asset verified: {size} bytes")
          print(f"Download time: {elapsed:.3f} seconds")
          print(f"Download speed: {mib_per_second:.3f} MiB/s")
          PY

      - name: Write benchmark summary
        shell: bash
        run: |
          {
            echo "## Private media benchmark"
            echo ""
            echo "- Size: ${{ steps.benchmark.outputs.size_bytes }} bytes"
            echo "- Download time: ${{ steps.benchmark.outputs.seconds }} seconds"
            echo "- Speed: ${{ steps.benchmark.outputs.mib_per_second }} MiB/s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove downloaded media
        if: always()
        shell: bash
        run: |
          rm -f -- "$TARGET" "$TARGET.part"
