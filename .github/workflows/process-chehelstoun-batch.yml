name: Process Chehelstoun audio batch
run-name: Chehelstoun transcription — ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/process-chehelstoun-batch.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  RELEASE_TAG: chehelstoun-archive-v1
  COLLECTION_ROOT: outputs/chehelstoun
  PROFILE: balanced
  LANGUAGE: fa
  AUDIO_PROFILE: safe

concurrency:
  group: chehelstoun-transcription-batch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.assets.outputs.matrix }}
      count: ${{ steps.assets.outputs.count }}
      issue_number: ${{ steps.report.outputs.issue_number }}
    steps:
      - name: Discover MP3 release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          matrix=$(jq -c '
            [.assets[]
              | select(.name | endswith(".mp3"))
              | {
                  episode: .name[0:2],
                  name: .name,
                  url: .browser_download_url,
                  size: .size
                }
            ]
            | sort_by(.episode)
            | {include: .}
          ' <<<"$release_json")
          count=$(jq -r '.include | length' <<<"$matrix")
          echo "Discovered $count MP3 assets"
          test "$count" -eq 38
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create batch tracking issue
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Chehelstoun transcription batch started.

          - run_id: ${GITHUB_RUN_ID}
          - release: ${RELEASE_TAG}
          - discovered MP3 files: ${{ steps.assets.outputs.count }}
          - mode: sequential (max-parallel=1)
          - ASR profile: ${PROFILE}
          - language: ${LANGUAGE}
          - audio profile: ${AUDIO_PROFILE}
          - output root: ${COLLECTION_ROOT}
          - run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          issue_url=$(gh issue create --title "Chehelstoun transcription batch ${GITHUB_RUN_ID}" --body "$body")
          issue_number=${issue_url##*/}
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

  transcribe:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      EPISODE: ${{ matrix.episode }}
      ASSET_NAME: ${{ matrix.name }}
      ASSET_URL: ${{ matrix.url }}
      ASSET_SIZE: ${{ matrix.size }}
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether episode is already committed
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "${COLLECTION_ROOT}/${EPISODE}/delivery/transcript.txt" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Episode ${EPISODE} already exists; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache ASR model
        if: steps.existing.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1

      - name: Install worker dependencies
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Download and validate release audio
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chehelstoun-input
          input="/tmp/chehelstoun-input/${EPISODE}.mp3"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            --max-time 600 "$ASSET_URL" -o "$input"
          actual=$(stat -c %s "$input")
          test "$actual" -eq "$ASSET_SIZE"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
            -of default=nw=1:nk=1 "$input" | grep -q .

      - name: Transcribe episode
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          input="/tmp/chehelstoun-input/${EPISODE}.mp3"
          title="${ASSET_NAME%.mp3}"
          title="${title#?? - }"
          rm -rf /tmp/chehelstoun-runtime
          mkdir -p /tmp/chehelstoun-runtime
          vid-pipeline run-file "$input" \
            --name "chehelstoun-${EPISODE}" \
            --output-root /tmp/chehelstoun-runtime \
            --profile "$PROFILE" \
            --language "$LANGUAGE" \
            --device cpu \
            --compute-type int8 \
            --audio-profile "$AUDIO_PROFILE" \
            --hotwords "چهلستون، کمیل رودی، دکتر کمیل رودی، سواد مالی، رادیو گفت‌وگو" \
            --title "$title" \
            --program "چهلستون" \
            --network "رادیو گفت‌وگو" \
            --speaker "دکتر کمیل رودی" \
            --source-url "$ASSET_URL" \
            --no-editorial \
            2>&1 | tee "/tmp/chehelstoun-${EPISODE}.log"

      - name: Stage canonical collection output
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          job_dir=$(find /tmp/chehelstoun-runtime -mindepth 1 -maxdepth 1 -type d \
            -name "chehelstoun-${EPISODE}-*" -print -quit)
          test -n "$job_dir"
          test -s "$job_dir/delivery/transcript.md"
          test -s "$job_dir/delivery/transcript.txt"
          test -s "$job_dir/delivery/transcript.timestamped.md"

          dest="${COLLECTION_ROOT}/${EPISODE}"
          rm -rf "$dest"
          mkdir -p "$dest/delivery"
          cp "$job_dir/delivery/transcript.md" "$dest/delivery/"
          cp "$job_dir/delivery/transcript.txt" "$dest/delivery/"
          cp "$job_dir/delivery/transcript.timestamped.md" "$dest/delivery/"
          [[ -f "$job_dir/result.json" ]] && cp "$job_dir/result.json" "$dest/result.json"
          [[ -f "$job_dir/source.json" ]] && cp "$job_dir/source.json" "$dest/source.json"

          python - "$dest/metadata.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          payload = {
              "collection": "چهلستون",
              "episode": os.environ["EPISODE"],
              "asset_name": os.environ["ASSET_NAME"],
              "source_release_tag": os.environ["RELEASE_TAG"],
              "source_url": os.environ["ASSET_URL"],
              "profile": os.environ["PROFILE"],
              "language": os.environ["LANGUAGE"],
              "audio_profile": os.environ["AUDIO_PROFILE"],
              "editorial": False,
              "asr_model": "large-v3-turbo",
              "pipeline_run_id": os.environ["GITHUB_RUN_ID"],
          }
          Path(sys.argv[1]).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit episode transcript to outputs/chehelstoun
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${COLLECTION_ROOT}/${EPISODE}"
          if git diff --cached --quiet; then
            echo "No transcript changes to commit."
            exit 0
          fi
          git commit -m "Add Chehelstoun transcript ${EPISODE}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to push transcript after retries" >&2
          exit 1

      - name: Upload lean transcript artifact
        if: success() && steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chehelstoun-${{ matrix.episode }}-transcript
          path: outputs/chehelstoun/${{ matrix.episode }}/
          retention-days: 30
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chehelstoun-${{ matrix.episode }}-failure
          path: |
            /tmp/chehelstoun-${{ matrix.episode }}.log
            /tmp/chehelstoun-runtime/**/state.json
            /tmp/chehelstoun-runtime/**/result.json
          retention-days: 7
          if-no-files-found: warn

      - name: Clean temporary media
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/chehelstoun-input /tmp/chehelstoun-runtime

  report:
    if: always()
    needs: [discover, transcribe]
    runs-on: ubuntu-latest
    steps:
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.discover.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")
          total=$(jq '[.jobs[] | select(.name | startswith("transcribe ("))] | length' <<<"$jobs")
          ok=$(jq '[.jobs[] | select((.name | startswith("transcribe (")) and .conclusion == "success")] | length' <<<"$jobs")
          failed=$(jq '[.jobs[] | select((.name | startswith("transcribe (")) and .conclusion == "failure")] | length' <<<"$jobs")
          cancelled=$(jq '[.jobs[] | select((.name | startswith("transcribe (")) and .conclusion == "cancelled")] | length' <<<"$jobs")
          body=$(cat <<EOF
          Batch finished.

          - run_id: ${GITHUB_RUN_ID}
          - matrix jobs observed: ${total}
          - success: ${ok}
          - failed: ${failed}
          - cancelled: ${cancelled}
          - output: https://github.com/${GITHUB_REPOSITORY}/tree/main/${COLLECTION_ROOT}
          - run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh issue comment "$ISSUE_NUMBER" --body "$body"
          if [[ "$failed" -eq 0 && "$cancelled" -eq 0 ]]; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
