name: Bank Mellat 8 final fast lane
run-name: Bank Mellat 8 M4A ASR ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bankmellatt-8-final-fast.yml'

permissions:
  contents: write
  actions: read

env:
  SOURCE_TAG: chehelstoun-archive-v1
  PROFILE: balanced
  LANGUAGE: fa
  AUDIO_PROFILE: safe
  VID_PIPELINE_ACCURACY_MODE: balanced
  DEST: scratch/bankmellatt-8-final-fast

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Locate exact 8.m4a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${SOURCE_TAG}" > /tmp/release.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          rel=json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          hits=[a for a in rel.get('assets',[]) if a.get('name','').strip() == '8.m4a']
          if len(hits) != 1:
              raise SystemExit(f'Expected exactly one 8.m4a; found {[a.get("name") for a in hits]}')
          a=hits[0]
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"ASSET_URL={a['browser_download_url']}\n")
              f.write(f"ASSET_SIZE={a['size']}\n")
          print('Found:', a['name'], a['size'], a['browser_download_url'])
          PY

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/vid-pipeline/asr
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1

      - name: Install worker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl rsync
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Download and validate new M4A
        shell: bash
        run: |
          set -euo pipefail
          input=/tmp/bankmellatt-8.m4a
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 "$ASSET_URL" -o "$input"
          test "$(stat -c %s "$input")" -eq "$ASSET_SIZE"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,duration -of default=nw=1 "$input"
          echo "INPUT=$input" >> "$GITHUB_ENV"

      - name: Run Persian ASR pipeline
        shell: bash
        run: |
          set -euo pipefail
          runtime=/tmp/bankmellatt-8-runtime
          rm -rf "$runtime"
          vid-pipeline run-file "$INPUT" \
            --name bankmellatt-8-new-m4a \
            --output-root "$runtime" \
            --profile "$PROFILE" \
            --language "$LANGUAGE" \
            --device cpu \
            --compute-type int8 \
            --audio-profile "$AUDIO_PROFILE" \
            --hotwords 'بانک ملت، کمیل رودی، دکتر کمیل رودی، سواد مالی' \
            --title 'بانک ملت - 8' \
            --program 'بانک ملت' \
            --speaker 'دکتر کمیل رودی' \
            --source-url "$ASSET_URL" \
            --no-editorial
          job_dir=$(find "$runtime" -mindepth 1 -maxdepth 1 -type d -name 'bankmellatt-*' -print -quit)
          test -n "$job_dir"
          test -s "$job_dir/delivery/transcript.txt"
          test -s "$job_dir/review/assistant-review-package.json"
          echo "JOB_DIR=$job_dir" >> "$GITHUB_ENV"

      - name: Persist only review inputs in scratch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DEST"
          mkdir -p "$DEST/review" "$DEST/accuracy" "$DEST/delivery"
          cp "$JOB_DIR/delivery/transcript.txt" "$DEST/delivery/transcript.txt"
          cp "$JOB_DIR/delivery/transcript.md" "$DEST/delivery/transcript.md"
          cp "$JOB_DIR/review/assistant-review-package.json" "$DEST/review/assistant-review-package.json"
          cp "$JOB_DIR/accuracy/transcript.consensus.json" "$DEST/accuracy/transcript.consensus.json"
          cp "$JOB_DIR/source.json" "$DEST/source.json"
          cat > "$DEST/metadata.json" <<EOF
          {
            "collection": "بانک ملت",
            "episode": 8,
            "asset_name": "8.m4a",
            "source_release_tag": "$SOURCE_TAG",
            "source_url": "$ASSET_URL",
            "profile": "$PROFILE",
            "asr_model": "large-v3-turbo",
            "language": "$LANGUAGE",
            "audio_profile": "$AUDIO_PROFILE",
            "accuracy_mode": "$VID_PIPELINE_ACCURACY_MODE",
            "chatgpt_review_ready": true,
            "pipeline_run_id": "$GITHUB_RUN_ID"
          }
          EOF

      - name: Commit scratch transcript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git commit -m 'Transcribe Bank Mellat 8 from new M4A'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
