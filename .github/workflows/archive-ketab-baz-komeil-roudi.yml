name: Archive Komeil Roudi Ketab Baz episode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-ketab-baz-komeil-roudi.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ketab-baz-s05e68-komeil-roudi
      OUTPUT_BASENAME: KetabBaz_S05E68_Komeil_Roudi
      YOUTUBE_URL: https://youtu.be/yohZIIrjSwE
      APARAT_URL: https://www.aparat.com/v/7oEKI/
      APARAT_HASH: 7oEKI
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Download full episode from Aparat API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist logs
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          video_hash = os.environ['APARAT_HASH']
          page = os.environ['APARAT_URL']
          api = f'https://www.aparat.com/api/fa/v1/video/video/show/videohash/{video_hash}?pr=1&mf=1&referer=direct'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36',
              'Referer': page,
              'Accept': 'application/json,text/plain,*/*',
          }
          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req, timeout=60) as response:
              payload = json.load(response)
          Path('logs/aparat-api.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')

          data = payload.get('data') or {}
          attrs = data.get('attributes') if isinstance(data, dict) else None
          if not isinstance(attrs, dict):
              attrs = data if isinstance(data, dict) else {}
          groups = attrs.get('file_link_all') or data.get('file_link_all') or []
          candidates = []
          if isinstance(groups, list):
              for group in groups:
                  if not isinstance(group, dict):
                      continue
                  label = str(group.get('profile') or group.get('label') or group.get('title') or group.get('quality') or '')
                  match = re.search(r'(\d{3,4})', label)
                  score = int(match.group(1)) if match else 0
                  urls = group.get('urls') or group.get('url') or []
                  if isinstance(urls, str):
                      urls = [urls]
                  if isinstance(urls, list):
                      for url in urls:
                          if isinstance(url, str) and url.startswith('http') and '.m3u8' not in url:
                              candidates.append((score, url))

          if not candidates:
              def walk(value):
                  if isinstance(value, dict):
                      for item in value.values():
                          yield from walk(item)
                  elif isinstance(value, list):
                      for item in value:
                          yield from walk(item)
                  elif isinstance(value, str):
                      yield value
              for url in walk(payload):
                  if url.startswith('http') and 'asset.aparat.com' in url and '.m3u8' not in url:
                      match = re.search(r'(\d{3,4})p', url)
                      candidates.append((int(match.group(1)) if match else 0, url))

          if not candidates:
              raise SystemExit('Aparat API returned no downloadable media URL')
          candidates.sort(key=lambda item: item[0])
          score, direct = candidates[-1]
          Path('logs/direct_url.txt').write_text(direct + '\n', encoding='utf-8')
          Path('logs/selected_quality.txt').write_text(str(score) + '\n', encoding='utf-8')
          print(f'Selected Aparat candidate quality score: {score}')
          PY

          direct=$(cat logs/direct_url.txt)
          curl -fL --retry 5 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36' \
            -e "$APARAT_URL" \
            "$direct" -o "dist/${OUTPUT_BASENAME}.mp4"

          test $(stat -c%s "dist/${OUTPUT_BASENAME}.mp4") -gt 1000000
          ffprobe -v error "dist/${OUTPUT_BASENAME}.mp4" >/dev/null
          printf '%s\n' "$APARAT_URL" > dist/source_url.txt
          ffprobe -v error -show_entries format=duration,size -of json "dist/${OUTPUT_BASENAME}.mp4" > dist/media_info.json
          (cd dist && sha256sum "${OUTPUT_BASENAME}.mp4" > SHA256SUMS.txt)
          cat > dist/README.txt <<EOF
          Ketab Baz (کتاب‌باز), season 5 episode 68 — guest: Dr. Komeil Roudi
          Topic: financial literacy / سواد مالی
          Public references: ${YOUTUBE_URL} and ${APARAT_URL}
          Archived media source: ${APARAT_URL}
          Download method: Aparat public video API, matching the public page video hash.
          EOF
          ls -lh dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Ketab Baz — Dr. Komeil Roudi (S05E68)" \
              --notes "Full public episode of Ketab Baz with Dr. Komeil Roudi discussing financial literacy. Source provenance and checksum are attached."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ketab-baz-download-logs
          path: logs/
          retention-days: 7

      - name: Report archive result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          source_used='not available'
          [[ -f dist/source_url.txt ]] && source_used=$(cat dist/source_url.txt)
          body=$(cat <<EOF
          Ketab Baz archive workflow finished.

          - status: ${JOB_STATUS}
          - run_id: ${GITHUB_RUN_ID}
          - commit: ${GITHUB_SHA}
          - source_used: ${source_used}
          - run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Ketab Baz Komeil Roudi archive report — ${GITHUB_RUN_ID}" --body "$body"
