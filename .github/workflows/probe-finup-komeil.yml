name: Probe and archive Finup Komeil Roudi media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-finup-komeil.yml'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

env:
  VIDEO_ID: bpelPbGcBMc
  VIDEO_URL: https://www.youtube.com/watch?v=bpelPbGcBMc
  RELEASE_TAG: finup21-komeil-roudi-financial-literacy
  OUTPUT_BASENAME: Finup21_Komeil_Roudi_Financial_Literacy

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade 'yt-dlp[default]'
          yt-dlp --version

      - name: Resolve official source and download
        shell: bash
        run: |
          set -u
          mkdir -p dist logs work
          : > logs/download.log

          echo 'Official Finup Event video:' | tee -a logs/download.log
          yt-dlp --flat-playlist --print '%(id)s\t%(title)s\t%(webpage_url)s' \
            'https://www.youtube.com/@finupevent/videos' 2>&1 \
            | grep "$VIDEO_ID" | tee -a logs/download.log

          ok=0
          for clients in \
            'tv_simply' \
            'android_vr' \
            'web_embedded' \
            'web_safari'; do
            echo "=== VIDEO client=${clients} ===" | tee -a logs/download.log
            rm -f work/media.*
            if yt-dlp \
              --no-playlist \
              --retries 1 --fragment-retries 1 \
              --js-runtimes node \
              --remote-components ejs:github \
              --extractor-args "youtube:player_client=${clients}" \
              -f 'b[ext=mp4]/b' \
              -o 'work/media.%(ext)s' \
              "$VIDEO_URL" 2>&1 | tee -a logs/download.log; then
              media=$(find work -maxdepth 1 -type f -name 'media.*' ! -name '*.part' -print -quit)
              if [[ -n "$media" ]] && [[ $(stat -c%s "$media") -gt 500000 ]]; then
                ext="${media##*.}"
                mv "$media" "dist/${OUTPUT_BASENAME}.${ext}"
                printf '%s\n' "${clients}-video" > dist/download_method.txt
                ok=1
                break
              fi
            fi
          done

          if [[ "$ok" -ne 1 ]]; then
            for clients in 'tv_simply' 'android_vr' 'web_embedded' 'web_safari'; do
              echo "=== AUDIO client=${clients} ===" | tee -a logs/download.log
              rm -f work/media.*
              if yt-dlp \
                --no-playlist \
                --retries 1 --fragment-retries 1 \
                --js-runtimes node \
                --remote-components ejs:github \
                --extractor-args "youtube:player_client=${clients}" \
                -f 'ba/b' \
                -o 'work/media.%(ext)s' \
                "$VIDEO_URL" 2>&1 | tee -a logs/download.log; then
                media=$(find work -maxdepth 1 -type f -name 'media.*' ! -name '*.part' -print -quit)
                if [[ -n "$media" ]] && [[ $(stat -c%s "$media") -gt 500000 ]]; then
                  ext="${media##*.}"
                  mv "$media" "dist/${OUTPUT_BASENAME}.${ext}"
                  printf '%s\n' "${clients}-audio" > dist/download_method.txt
                  ok=1
                  break
                fi
              fi
            done
          fi

          if [[ "$ok" -ne 1 ]]; then
            echo 'No downloadable media succeeded.' | tee -a logs/download.log
            exit 1
          fi

          media=$(find dist -maxdepth 1 -type f -name "${OUTPUT_BASENAME}.*" -print -quit)
          sha256sum "$media" > dist/SHA256SUMS.txt
          printf '%s\n' "$VIDEO_URL" > dist/source_url.txt
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -show_entries format=duration,size,format_name -of json "$media" > dist/media_info.json || true
          fi
          {
            echo 'Finup Event 21 — Money Matters'
            echo 'Speaker: Dr. Komeil Roudi / دکتر کمیل رودی'
            echo "Presentation: What Financial Literacy Is and What It Isn't / سواد مالی چه هست و چه نیست"
            echo "Official Finup Event YouTube video ID: ${VIDEO_ID}"
            echo 'This workflow archives the source media only. It does NOT start transcription.'
          } > dist/README.txt
          ls -lh dist/

      - name: Upload archive to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Finup 21 — Komeil Roudi — Financial Literacy" \
              --notes "Official Finup Event presentation by Dr. Komeil Roudi. Archived only; transcription not started."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          media=$(find dist -maxdepth 1 -type f -name "${OUTPUT_BASENAME}.*" -printf '%f' 2>/dev/null | head -1 || true)
          [[ -n "$media" ]] || media='not available'
          method='not available'
          [[ -f dist/download_method.txt ]] && method=$(cat dist/download_method.txt)
          body=$(printf '%s\n' \
            'Finup Komeil official media archive finished.' \
            '' \
            "- status: ${JOB_STATUS}" \
            "- official_video_id: ${VIDEO_ID}" \
            "- media: ${media}" \
            "- method: ${method}" \
            "- source: ${VIDEO_URL}" \
            "- run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Finup Komeil official archive — ${GITHUB_RUN_ID}" \
            --body "$body"
