name: Actions storage audit
run-name: Actions storage audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/actions-storage-cleanup
    paths:
      - ".github/bootstrap/actions-storage-audit.trigger"

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit repository Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          CURRENT_PRODUCTION_RUN: "31348536690"
          OLD_CUTOFF_UTC: "2026-08-10T00:00:00Z"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime

          repo = os.environ["REPOSITORY"]
          ref_name = os.environ["REF_NAME"]
          token = os.environ["GH_TOKEN"]
          protected_run = int(os.environ["CURRENT_PRODUCTION_RUN"])
          cutoff = datetime.fromisoformat(os.environ["OLD_CUTOFF_UTC"].replace("Z", "+00:00"))
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "vid-pipeline-actions-storage-audit",
          }

          artifacts = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              batch = payload.get("artifacts") or []
              if not batch:
                  break
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          def created_at(row):
              raw = str(row.get("created_at") or "1970-01-01T00:00:00Z")
              return datetime.fromisoformat(raw.replace("Z", "+00:00"))

          def compact(row):
              return {
                  "id": int(row.get("id") or 0),
                  "name": str(row.get("name") or ""),
                  "size_in_bytes": int(row.get("size_in_bytes") or 0),
                  "created_at": row.get("created_at"),
                  "expires_at": row.get("expires_at"),
                  "expired": bool(row.get("expired")),
                  "workflow_run_id": int((row.get("workflow_run") or {}).get("id") or 0),
              }

          total_bytes = sum(int(row.get("size_in_bytes") or 0) for row in artifacts)
          old = [
              row for row in artifacts
              if created_at(row) < cutoff
              and int((row.get("workflow_run") or {}).get("id") or 0) != protected_run
          ]
          old_bytes = sum(int(row.get("size_in_bytes") or 0) for row in old)
          recent = [row for row in artifacts if row not in old]
          recent_bytes = total_bytes - old_bytes
          largest = sorted(old, key=lambda row: int(row.get("size_in_bytes") or 0), reverse=True)[:50]

          report = {
              "schema_version": 1,
              "repository": repo,
              "cutoff_utc": cutoff.isoformat(),
              "protected_production_run": protected_run,
              "artifact_count": len(artifacts),
              "total_bytes": total_bytes,
              "old_candidate_count": len(old),
              "old_candidate_bytes": old_bytes,
              "recent_or_protected_count": len(recent),
              "recent_or_protected_bytes": recent_bytes,
              "old_candidates": [compact(row) for row in sorted(old, key=created_at)],
              "largest_old_candidates": [compact(row) for row in largest],
          }

          def mib(n):
              return n / 1024 / 1024

          lines = [
              "# GitHub Actions artifact storage audit",
              "",
              f"Repository: `{repo}`",
              f"Artifacts found: **{len(artifacts)}**",
              f"Artifact bytes visible via repository API: **{mib(total_bytes):.2f} MiB**",
              f"Old candidates before `{cutoff.isoformat()}`: **{len(old)}** / **{mib(old_bytes):.2f} MiB**",
              f"Recent/protected artifacts: **{len(recent)}** / **{mib(recent_bytes):.2f} MiB**",
              f"Protected production run: `{protected_run}`",
              "",
              "## Largest old candidates",
              "",
              "| MiB | Artifact | Run | Created UTC | ID |",
              "|---:|---|---:|---|---:|",
          ]
          for row in largest:
              run_id = int((row.get("workflow_run") or {}).get("id") or 0)
              name = str(row.get("name") or "").replace("|", "\\|")
              lines.append(
                  f"| {mib(int(row.get('size_in_bytes') or 0)):.2f} | {name} | {run_id} | {row.get('created_at')} | {row.get('id')} |"
              )
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)

          report_path = "benchmarks/actions-storage-audit.json"
          contents_url = f"https://api.github.com/repos/{repo}/contents/{report_path}"
          existing_sha = None
          try:
              req = urllib.request.Request(
                  contents_url + "?ref=" + urllib.parse.quote(ref_name, safe=""),
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  existing_sha = json.load(response).get("sha")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          encoded = base64.b64encode(
              (json.dumps(report, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          ).decode("ascii")
          body = {
              "message": "chore: record Actions storage audit",
              "content": encoded,
              "branch": ref_name,
          }
          if existing_sha:
              body["sha"] = existing_sha
          req = urllib.request.Request(
              contents_url,
              data=json.dumps(body).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              saved = json.load(response)
          print("AUDIT_REPORT_COMMIT=" + str((saved.get("commit") or {}).get("sha") or ""))
          print("AUDIT_JSON=" + json.dumps({
              "artifact_count": len(artifacts),
              "total_bytes": total_bytes,
              "old_candidate_count": len(old),
              "old_candidate_bytes": old_bytes,
              "recent_or_protected_count": len(recent),
              "recent_or_protected_bytes": recent_bytes,
              "protected_run": protected_run,
          }, separators=(",", ":")))
          PY
