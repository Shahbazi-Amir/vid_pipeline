name: Final pyannote-only validation

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/final-pyannote-only-validation.trigger"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install final dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization-pyannote]'

      - name: Run final test suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check .
          python -m compileall -q src tests scripts
          git diff --check

      - name: Verify pyannote-only repository contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          retired = "sher" + "pa"
          matches = []
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if retired in str(path).casefold():
                  matches.append(f'path:{path}')
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if retired in text.casefold():
                  matches.append(f'content:{path}')
          if matches:
              raise SystemExit('retired backend references remain: ' + ', '.join(matches))

          pyproject = Path('pyproject.toml').read_text(encoding='utf-8')
          if 'pyannote.audio==4.0.4' not in pyproject:
              raise SystemExit('pyannote dependency missing')

          core = Path('src/vid_pipeline/diarization.py').read_text(encoding='utf-8')
          if 'PyannoteDiarizationBackend' not in core:
              raise SystemExit('pyannote default backend wiring missing')

          cli = Path('src/vid_pipeline/pyannote_cli.py').read_text(encoding='utf-8')
          if 'PYANNOTE_BACKEND_NAME' not in cli:
              raise SystemExit('pyannote CLI wiring missing')

          uploaded = Path('.github/workflows/process-uploaded-video.yml').read_text(encoding='utf-8')
          url_flow = Path('.github/workflows/process-video.yml').read_text(encoding='utf-8')
          for name, text in [('uploaded', uploaded), ('url', url_flow)]:
              if 'pyannote-community-1' not in text:
                  raise SystemExit(f'{name} workflow pyannote backend missing')
              if 'VID_PIPELINE_PYANNOTE_TOKEN:' not in text:
                  raise SystemExit(f'{name} workflow dedicated pyannote token missing')
          PY

      - name: Record success and self-clean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          printf '%s\n' '{"status":"success","backend":"pyannote-community-1","legacy_backend_removed":true,"pytest":"pass","ruff":"pass","compileall":"pass","diff_check":"pass","repository_scan":"pass","video_2_test":"not_run_by_request"}' > validation/diarization-backend-cleanup.json
          rm -f .github/bootstrap/final-pyannote-only-validation.trigger
          rm -f .github/workflows/final-pyannote-only-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A validation/diarization-backend-cleanup.json \
            .github/bootstrap/final-pyannote-only-validation.trigger \
            .github/workflows/final-pyannote-only-validation.yml
          git commit -m "test: validate pyannote-only diarization tree"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
