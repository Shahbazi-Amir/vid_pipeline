name: Media backlog parallel
run-name: Media backlog parallel ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/media-backlog-parallel.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

env:
  PROFILE: balanced
  LANGUAGE: fa
  AUDIO_PROFILE: safe
  VID_PIPELINE_ACCURACY_MODE: balanced
  CHEHELSTOUN_TAG: chehelstoun-archive-v1
  BOOK_TAG: ketab-baz-s05e68-komeil-roudi
  BANK_TAG: bankmellatt
  VOICE_ASSET_NAME: Voice.260817_165035.m4a
  KETAB_BAZ_MAIN_ASSET: KetabBaz_S05E68_Komeil_Roudi.mp3

concurrency:
  group: media-backlog-parallel
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Discover pending release media
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${CHEHELSTOUN_TAG}" > /tmp/cheh.json
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${BOOK_TAG}" > /tmp/book.json
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${BANK_TAG}" > /tmp/bank.json

          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          media_exts={'.mp3','.m4a','.wav','.flac','.aac','.ogg','.opus','.mp4','.mkv','.mov','.webm','.avi','.m4v'}
          root=Path('.')

          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          cheh, book, bank = load('/tmp/cheh.json'), load('/tmp/book.json'), load('/tmp/bank.json')

          def media_assets(rel):
              return [a for a in rel.get('assets',[]) if Path(a.get('name','')).suffix.lower() in media_exts]

          def safe_slug(name):
              stem=Path(name).stem
              s=re.sub(r'[^A-Za-z0-9._-]+','-',stem).strip('-._').lower()
              if not s:
                  s='asset-'+hashlib.sha1(name.encode('utf-8')).hexdigest()[:12]
              return s[:80]

          tasks=[]
          # Mizan from Chehelstoun extras, excluding numbered episodes and Voice.
          extras=[a for a in media_assets(cheh) if not re.match(r'^\d{2}(?:\D|$)',a.get('name','')) and a.get('name') != os.environ['VOICE_ASSET_NAME']]
          named=[a for a in extras if 'mizan' in a.get('name','').lower() or 'میزان' in a.get('name','')]
          if named:
              mizan=sorted(named,key=lambda a:a.get('created_at',''))[-1]
          elif len(extras)==1:
              mizan=extras[0]
          else:
              mizan=None
          if mizan:
              tasks.append({
                  'kind':'mizan','display':'میزان','title':'میزان','dest':'outputs/mizan/01',
                  'name':mizan['name'],'url':mizan['browser_download_url'],'size':mizan['size'],
                  'hotwords':'میزان، کمیل رودی، دکتر کمیل رودی، سواد مالی','release_tag':cheh.get('tag_name','')
              })

          # Ketab Baz original + every extra media asset in the same release as Finup.
          for a in media_assets(book):
              name=a['name']
              if name == os.environ['KETAB_BAZ_MAIN_ASSET']:
                  tasks.append({
                      'kind':'ketab-baz','display':'کتاب‌باز','title':'کتاب‌باز - کمیل رودی','dest':'outputs/ketab-baz/01',
                      'name':name,'url':a['browser_download_url'],'size':a['size'],
                      'hotwords':'کتاب باز، کتاب‌باز، کمیل رودی، دکتر کمیل رودی، سروش صحت','release_tag':book.get('tag_name','')
                  })
              else:
                  slug=safe_slug(name)
                  tasks.append({
                      'kind':'finup','display':'فیناپ','title':'فیناپ - '+Path(name).stem,'dest':f'outputs/finup/{slug}',
                      'name':name,'url':a['browser_download_url'],'size':a['size'],
                      'hotwords':'فیناپ، کمیل رودی، دکتر کمیل رودی، سواد مالی','release_tag':book.get('tag_name','')
                  })

          # All current and future media assets from bankmellatt release.
          for a in sorted(media_assets(bank), key=lambda x:(x.get('created_at',''),x.get('name',''))):
              name=a['name']; slug=safe_slug(name)
              tasks.append({
                  'kind':'bankmellatt','display':'بانک ملت','title':'بانک ملت - '+Path(name).stem,'dest':f'outputs/bankmellatt/{slug}',
                  'name':name,'url':a['browser_download_url'],'size':a['size'],
                  'hotwords':'بانک ملت، کمیل رودی، دکتر کمیل رودی، سواد مالی','release_tag':bank.get('tag_name','')
              })

          # Deduplicate and skip outputs already fully transcript+review-package ready.
          pending=[]; seen=set()
          for t in tasks:
              key=(t['kind'],t['url'])
              if key in seen: continue
              seen.add(key)
              dest=root/t['dest']
              if (dest/'delivery/transcript.txt').is_file() and (dest/'review/assistant-review-package.json').is_file() and (dest/'pre_review/transcript.pre-review.json').is_file() and (dest/'accuracy/transcript.consensus.json').is_file():
                  print('SKIP complete:',t['kind'],t['name'])
                  continue
              pending.append(t)

          out={'include':pending}
          compact=json.dumps(out,ensure_ascii=False,separators=(',',':'))
          Path('/tmp/matrix.json').write_text(compact,encoding='utf-8')
          print('Pending tasks:',len(pending))
          for t in pending: print('-',t['kind'],t['name'],'=>',t['dest'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('matrix<<EOF\n'+compact+'\nEOF\n')
              f.write('count='+str(len(pending))+'\n')
          PY

      - name: Record live run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/media-backlog
          printf '{"run_id":"%s","url":"https://github.com/%s/actions/runs/%s","pending_count":%s}\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" '${{ steps.discover.outputs.count }}' > ops/media-backlog/latest-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/media-backlog/latest-run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record media backlog run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1

  process:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      KIND: ${{ matrix.kind }}
      DISPLAY: ${{ matrix.display }}
      TITLE: ${{ matrix.title }}
      DEST: ${{ matrix.dest }}
      ASSET_NAME: ${{ matrix.name }}
      ASSET_URL: ${{ matrix.url }}
      ASSET_SIZE: ${{ matrix.size }}
      HOTWORDS: ${{ matrix.hotwords }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recheck existing output
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          if [[ -s "$DEST/delivery/transcript.txt" && -s "$DEST/review/assistant-review-package.json" && -s "$DEST/pre_review/transcript.pre-review.json" && -s "$DEST/accuracy/transcript.consensus.json" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache ASR model
        if: steps.existing.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/vid-pipeline/asr
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1

      - name: Install worker
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl rsync
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Download and validate media with safe local filename
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ext="${ASSET_NAME##*.}"
          [[ "$ext" != "$ASSET_NAME" ]] || ext='media'
          rm -rf "/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-input" "/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-runtime"
          mkdir -p "/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-input" "/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-runtime"
          input="/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-input/input.${ext}"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 "$ASSET_URL" -o "$input"
          test "$(stat -c %s "$input")" -eq "$ASSET_SIZE"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$input" | grep -q .
          echo "input=$input" >> "$GITHUB_ENV"

      - name: Run Persian ASR pipeline
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          vid-pipeline run-file "$input" \
            --name "$KIND" \
            --output-root "/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-runtime" \
            --profile "$PROFILE" \
            --language "$LANGUAGE" \
            --device cpu \
            --compute-type int8 \
            --audio-profile "$AUDIO_PROFILE" \
            --hotwords "$HOTWORDS" \
            --title "$TITLE" \
            --program "$DISPLAY" \
            --speaker "دکتر کمیل رودی" \
            --source-url "$ASSET_URL" \
            --no-editorial

      - name: Build review-ready output
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          job_dir=$(find "/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-runtime" -mindepth 1 -maxdepth 1 -type d -name "${KIND}-*" -print -quit)
          test -n "$job_dir"
          test -s "$job_dir/delivery/transcript.txt"
          test -s "$job_dir/pre_review/transcript.pre-review.json"
          test -s "$job_dir/accuracy/transcript.consensus.json"
          test -s "$job_dir/review/assistant-review-package.json"
          rm -rf "$DEST"; mkdir -p "$DEST"
          for d in delivery pre_review accuracy review raw machine final; do
            if [[ -d "$job_dir/$d" ]]; then
              mkdir -p "$DEST/$d"
              rsync -a --exclude 'clips/' --exclude 'review-package.zip' --exclude '*.mp3' --exclude '*.m4a' --exclude '*.wav' --exclude '*.flac' --exclude '*.aac' --exclude '*.ogg' --exclude '*.opus' --exclude '*.mp4' --exclude '*.mkv' --exclude '*.mov' --exclude '*.webm' --exclude '*.avi' --exclude '*.m4v' "$job_dir/$d/" "$DEST/$d/"
            fi
          done
          rm -f "$DEST/final/review-package.zip"
          [[ -f "$job_dir/result.json" ]] && cp "$job_dir/result.json" "$DEST/result.json"
          [[ -f "$job_dir/source.json" ]] && cp "$job_dir/source.json" "$DEST/source.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          dest=Path(os.environ['DEST'])
          payload={
            'collection':os.environ['DISPLAY'],'asset_name':os.environ['ASSET_NAME'],'source_release_tag':os.environ['RELEASE_TAG'],
            'source_url':os.environ['ASSET_URL'],'profile':os.environ['PROFILE'],'asr_model':'large-v3-turbo','language':os.environ['LANGUAGE'],
            'audio_profile':os.environ['AUDIO_PROFILE'],'accuracy_mode':os.environ['VID_PIPELINE_ACCURACY_MODE'],'editorial':False,
            'chatgpt_review_ready':True,'review_clips_committed':False,'pipeline_run_id':os.environ['GITHUB_RUN_ID']}
          (dest/'metadata.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit output independently with contention retry
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$DEST/final/review-package.zip"
          oversized=$(find "$DEST" -type f -size +95M -print -quit)
          if [[ -n "$oversized" ]]; then
            echo "::error::Refusing to commit oversized generated file: $oversized"
            exit 1
          fi
          git add -f "$DEST"
          git diff --cached --quiet && exit 0
          git commit -m "Add ${DISPLAY} media transcript: ${ASSET_NAME}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if ! git pull --rebase origin main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Cleanup temporary media
        if: always()
        shell: bash
        run: |
          rm -rf "/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-input" "/tmp/${KIND}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}-runtime"