name: Private Asre Shirin episode 2 pilot
run-name: Asre Shirin episode 2 A-B pilot #${{ github.run_number }}

on:
  push:
    paths:
      - ".github/private-asre-shirin-pilot.trigger"

permissions:
  actions: read
  contents: read

concurrency:
  group: private-asre-shirin-pilot
  cancel-in-progress: false

env:
  AI_REVIEW_ENABLED: "false"
  VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      VID_PIPELINE_PYANNOTE_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/asre-shirin-cpu.txt

      - name: Cache pyannote Community-1 model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: pyannote-${{ runner.os }}-py311-${{ hashFiles('pyproject.toml', 'constraints/asre-shirin-cpu.txt') }}-community-1-v2

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'constraints/asre-shirin-cpu.txt') }}-large-v3-turbo-ct2-v2

      - name: Install CPU pilot dependencies
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchaudio==2.8.0 torchcodec==0.7.0
          pip install -c constraints/asre-shirin-cpu.txt -e '.[asre-shirin-cpu]'
          python - <<'PY'
          from importlib.metadata import version
          import torch
          assert torch.__version__ == "2.8.0+cpu", torch.__version__
          assert version("torchcodec").split("+", 1)[0] == "0.7.0", version("torchcodec")
          assert not torch.cuda.is_available()
          print(f"CPU_DEPENDENCIES torch={torch.__version__} torchcodec={version('torchcodec')}")
          PY
          elapsed=$((SECONDS - started))
          echo "ASRE_SHIRIN_SETUP_SECONDS=$elapsed" >> "$GITHUB_ENV"
          echo "PILOT_SETUP_SECONDS=$elapsed" >> "$GITHUB_ENV"

      - name: Load verified episode 2 mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("sources/asre_shirin/aparat_manifest.json").read_text(encoding="utf-8"))
          rows = [row for row in data["videos"] if int(row["result_number"]) == 2]
          if len(rows) != 1:
              raise SystemExit("verified episode 2 mapping is missing or ambiguous")
          row = rows[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PILOT_URL={row['url']}\n")
              handle.write(f"PILOT_UID={row['uid']}\n")
              handle.write(f"PILOT_TITLE={row['title']}\n")
          PY

      - name: Metadata-only resolver gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/process_asre_shirin_url.py \
            --url "$PILOT_URL" \
            --expected-uid "$PILOT_UID" \
            --episode 2 \
            --title "$PILOT_TITLE" \
            --collection-root pilot-candidate \
            --work-root pilot-work \
            --resolver-only

      - name: Candidate B - resolve, download once, and verify media
        shell: bash
        run: |
          set -euo pipefail
          timeout --verbose --signal=TERM --kill-after=2m 20m \
            python scripts/process_asre_shirin_url.py \
              --url "$PILOT_URL" \
              --expected-uid "$PILOT_UID" \
              --episode 2 \
              --title "$PILOT_TITLE" \
              --collection-root pilot-candidate \
              --work-root pilot-work \
              --ingest-only

      - name: Candidate B - primary ASR from verified local media
        shell: bash
        run: |
          set -euo pipefail
          timeout --verbose --signal=TERM --kill-after=2m 75m \
            python scripts/process_asre_shirin_url.py \
              --url "$PILOT_URL" \
              --expected-uid "$PILOT_UID" \
              --episode 2 \
              --title "$PILOT_TITLE" \
              --collection-root pilot-candidate \
              --work-root pilot-work \
              --asr-only

      - name: Candidate B - resume ASR and run automatic diarization
        shell: bash
        run: |
          set -euo pipefail
          timeout --verbose --signal=TERM --kill-after=2m 90m \
            python scripts/process_asre_shirin_url.py \
              --url "$PILOT_URL" \
              --expected-uid "$PILOT_UID" \
              --episode 2 \
              --title "$PILOT_TITLE" \
              --collection-root pilot-candidate \
              --work-root pilot-work

      - name: Baseline C - same verified bytes, diarization off
        shell: bash
        run: |
          set -euo pipefail
          media=pilot-work/ingest/episode-2/media.mp4
          test -s "$media"
          started=$SECONDS
          timeout --verbose --signal=TERM --kill-after=2m 120m \
            vid-pipeline run-file "$media" \
              --source-url "$PILOT_URL" \
              --output-root pilot-baseline \
              --name asre-shirin-2-baseline \
              --title "$PILOT_TITLE" \
              --program "سواد مالی در عصر شیرین" \
              --profile balanced \
              --model large-v3-turbo \
              --language fa \
              --device cpu \
              --compute-type int8 \
              --no-editorial \
              --no-diarize
          echo $((SECONDS - started)) > pilot-baseline-total-seconds.txt

      - name: Quality gate and benchmark report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_asre_shirin_pilot.py \
            --episode 2 \
            --candidate-root pilot-candidate \
            --candidate-work-root pilot-work \
            --baseline-root pilot-baseline \
            --baseline-total-seconds "$(cat pilot-baseline-total-seconds.txt)" \
            --output-json pilot-benchmark.json \
            --output-markdown pilot-benchmark.md

      - name: Upload text-only pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asre-shirin-episode-2-pilot
          path: |
            pilot-candidate/**
            pilot-benchmark.json
            pilot-benchmark.md
            pilot-baseline-total-seconds.txt
            pilot-work/asre-shirin-checkpoints.json
            pilot-work/ingest/episode-2/media.json
            pilot-work/pipeline/**/state.json
            pilot-work/pipeline/**/result.json
            pilot-work/pipeline/**/raw/transcript.raw.json
            pilot-work/pipeline/**/accuracy/manifest.json
            pilot-work/pipeline/**/accuracy/transcript.consensus.json
            pilot-work/pipeline/**/diarization/**
            pilot-baseline/**/state.json
            pilot-baseline/**/result.json
            pilot-baseline/**/raw/transcript.raw.json
            pilot-baseline/**/accuracy/manifest.json
          retention-days: 7
          if-no-files-found: warn

      - name: Remove pilot media
        if: always()
        run: rm -rf pilot-work/ingest pilot-work/pipeline pilot-baseline
