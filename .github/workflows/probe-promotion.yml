name: Probe production promotion

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/probe-promotion.trigger"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe workflow status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p validation
          python - <<'PY'
          import json
          import os
          import urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/promote-pyannote-production.yml/runs?per_page=5'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          runs = [
              {
                  'id': run['id'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'head_sha': run['head_sha'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'html_url': run['html_url'],
              }
              for run in data.get('workflow_runs', [])
          ]
          with open('validation/promotion-status.json', 'w', encoding='utf-8') as handle:
              json.dump({'runs': runs}, handle, indent=2)
              handle.write('\n')
          PY
      - name: Commit probe and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/probe-promotion.trigger
          rm -f .github/workflows/probe-promotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A validation/promotion-status.json .github/bootstrap/probe-promotion.trigger .github/workflows/probe-promotion.yml
          git commit -m "test: record production promotion status"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
