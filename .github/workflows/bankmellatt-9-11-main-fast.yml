name: Bank Mellat 11 fast fallback
run-name: Bank Mellat 11 fast fallback ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bankmellatt-9-11-main-fast.yml'

permissions:
  contents: write

env:
  SOURCE_TAG: chehelstoun-archive-v1
  PROFILE: fast
  LANGUAGE: fa
  AUDIO_PROFILE: safe
  VID_PIPELINE_ACCURACY_MODE: fast

jobs:
  transcribe-11-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/vid-pipeline/asr
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1
      - name: Install worker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl rsync
          python -m pip install --upgrade pip
          pip install -e '.[worker]'
      - name: Download 11.m4a
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '11.m4a' --dir /tmp
          test -s /tmp/11.m4a
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/11.m4a | grep -q .
      - name: Fast single-pass ASR
        shell: bash
        run: |
          set -euo pipefail
          runtime=/tmp/bankmellatt-11-fast-runtime
          rm -rf "$runtime"
          vid-pipeline run-file /tmp/11.m4a \
            --name bankmellatt-11-fast \
            --output-root "$runtime" \
            --profile "$PROFILE" \
            --language "$LANGUAGE" \
            --device cpu \
            --compute-type int8 \
            --audio-profile "$AUDIO_PROFILE" \
            --hotwords 'بانک ملت، کمیل رودی، دکتر کمیل رودی، سواد مالی' \
            --title 'بانک ملت 11 - fast fallback' \
            --program 'بانک ملت' \
            --speaker 'دکتر کمیل رودی' \
            --source-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${SOURCE_TAG}/11.m4a" \
            --no-editorial
          job_dir=$(find "$runtime" -mindepth 1 -maxdepth 1 -type d -name 'bankmellatt-11-fast*' -print -quit)
          test -s "$job_dir/delivery/transcript.txt"
          rm -rf scratch/bankmellatt-11-fast
          mkdir -p scratch/bankmellatt-11-fast
          cp "$job_dir/delivery/transcript.txt" scratch/bankmellatt-11-fast/transcript.txt
          [[ -s "$job_dir/delivery/transcript.md" ]] && cp "$job_dir/delivery/transcript.md" scratch/bankmellatt-11-fast/transcript.md
          [[ -s "$job_dir/review/assistant-review-package.json" ]] && cp "$job_dir/review/assistant-review-package.json" scratch/bankmellatt-11-fast/assistant-review-package.json
          [[ -s "$job_dir/accuracy/transcript.consensus.json" ]] && cp "$job_dir/accuracy/transcript.consensus.json" scratch/bankmellatt-11-fast/transcript.consensus.json
      - name: Commit scratch transcript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f scratch/bankmellatt-11-fast
          git commit -m 'Add Bank Mellat 11 fast fallback transcript'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
