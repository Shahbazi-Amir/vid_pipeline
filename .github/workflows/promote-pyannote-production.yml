name: Promote pyannote production backend

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/promote-pyannote-production.trigger"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Make pyannote the production diarization backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/process-uploaded-video.yml')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          workspace = '$' + '{{ github.workspace }}'
          env_hf_cache = '$' + '{{ env.HF_HUB_CACHE }}'
          runner_os = '$' + '{{ runner.os }}'
          secret_token = '$' + '{{ secrets.HF_TOKEN }}'

          asr_index = next(
              index for index, line in enumerate(lines)
              if line.startswith('      VID_PIPELINE_ASR_CACHE:')
          )
          if not any('VID_PIPELINE_DIARIZATION_BACKEND:' in line for line in lines):
              lines[asr_index:asr_index] = [
                  '      VID_PIPELINE_DIARIZATION_BACKEND: pyannote-community-1',
              ]
              asr_index += 1
          if not any(line.startswith('      HF_HOME:') for line in lines):
              lines[asr_index + 1:asr_index + 1] = [
                  f'      HF_HOME: {workspace}/.cache/huggingface',
                  f'      HF_HUB_CACHE: {workspace}/.cache/huggingface/hub',
              ]

          start = next(
              index for index, line in enumerate(lines)
              if line == '      - name: Cache diarization models'
          )
          end = next(
              index for index in range(start + 1, len(lines))
              if lines[index].startswith('      - name: ')
          )
          lines[start:end] = [
              '      - name: Cache pyannote Community-1 model',
              "        if: inputs.diarization_enabled == 'true'",
              '        uses: actions/cache@v4',
              '        with:',
              f'          path: {env_hf_cache}',
              f'          key: pyannote-{runner_os}-py311-audio-4.0.4-community-1-v1',
              '',
          ]

          dependency = "            pip install -e '.[worker,diarization]'"
          replacement = "            pip install -e '.[worker,diarization-pyannote]'"
          if dependency not in lines:
              raise SystemExit('dependency anchor not found')
          lines[lines.index(dependency)] = replacement

          hub_index = next(
              index for index, line in enumerate(lines)
              if line == '          HUGGING_FACE_HUB_TOKEN: ""'
          )
          if not any('VID_PIPELINE_PYANNOTE_TOKEN:' in line for line in lines):
              lines.insert(
                  hub_index + 1,
                  f'          VID_PIPELINE_PYANNOTE_TOKEN: {secret_token}',
              )

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization]'

      - name: Validate repository and workflow contract
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check .
          python -m compileall -q src tests
          git diff --check

      - name: Commit production promotion and clean temporary trigger
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/promote-pyannote-production.trigger
          rm -f .github/workflows/promote-pyannote-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/process-uploaded-video.yml \
            .github/bootstrap/promote-pyannote-production.trigger \
            .github/workflows/promote-pyannote-production.yml
          git commit -m "feat: make pyannote the production diarization backend"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
