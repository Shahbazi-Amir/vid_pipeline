name: Delete obsolete branches once

on:
  push:
    branches: [main]
    paths: [.github/bootstrap/delete-obsolete-branches.trigger]

permissions:
  contents: write

concurrency:
  group: delete-obsolete-branches-once
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the audited obsolete refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads"
          branches=(agent/trigger-khane-to-discovery recovery/asre-review-20260811)
          for branch in "${branches[@]}"; do
            encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            status=$(curl -sS -o /tmp/delete-response -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$api/$encoded")
            if [[ "$status" != 204 ]]; then
              echo "Failed to delete $branch: HTTP $status"
              cat /tmp/delete-response
              exit 1
            fi
            echo "Deleted $branch"
          done
