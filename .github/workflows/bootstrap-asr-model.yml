name: Bootstrap ASR model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/asr-large-v3-turbo-v1.trigger"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_REPO: mobiuslabsgmbh/faster-whisper-large-v3-turbo
      RELEASE_TAG: asr-model-large-v3-turbo-ct2-v1
      ASSET_NAME: large-v3-turbo-ct2-v1.tar.gz
      MODEL_ROOT: /tmp/asr-bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the one-time source and verify redistribution metadata
        shell: bash
        run: |
          set -euo pipefail
          pip install 'faster-whisper==1.2.1' 'huggingface-hub>=0.28,<1'
          mkdir -p "$MODEL_ROOT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, snapshot_download

          repo = os.environ["SOURCE_REPO"]
          info = HfApi().model_info(repo, files_metadata=True)
          license_name = str((info.card_data or {}).get("license", "")).lower()
          if license_name != "mit":
              raise SystemExit(f"Redistribution not approved: expected MIT, found {license_name!r}")
          target = Path(os.environ["MODEL_ROOT"]) / "model"
          snapshot_download(repo_id=repo, revision=info.sha, local_dir=target)
          for hidden in (target / ".cache", target / ".gitattributes"):
              if hidden.is_dir():
                  import shutil
                  shutil.rmtree(hidden)
              elif hidden.exists():
                  hidden.unlink()
          (Path(os.environ["MODEL_ROOT"]) / "source.json").write_text(
              json.dumps({"repository": repo, "revision": info.sha, "license": license_name}),
              encoding="utf-8",
          )
          PY

      - name: Validate a real local faster-whisper load
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from faster_whisper import WhisperModel
          WhisperModel(os.path.join(os.environ["MODEL_ROOT"], "model"), device="cpu", compute_type="int8")
          print("WhisperModel local-path load: PASS")
          PY

      - name: Package deterministically and create the real manifest
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$MODEL_ROOT" -czf "/tmp/$ASSET_NAME" model
          revision=$(python -c 'import json,os; print(json.load(open(os.environ["MODEL_ROOT"]+"/source.json"))["revision"])')
          python scripts/build_asr_manifest.py \
            --model-dir "$MODEL_ROOT/model" \
            --archive "/tmp/$ASSET_NAME" \
            --output models/asr/large-v3-turbo-ct2-v1.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$revision"

      - name: Create or resolve release and upload with GITHUB_TOKEN REST API
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          status=$(curl -sS -o /tmp/release.json -w '%{http_code}' "${auth[@]}" "$api/releases/tags/$RELEASE_TAG")
          if [[ "$status" == 404 ]]; then
            python - <<'PY' >/tmp/release-request.json
          import json, os
          print(json.dumps({
              "tag_name": os.environ["RELEASE_TAG"],
              "name": "Pinned ASR model: large-v3-turbo CT2 v1",
              "body": "MIT-licensed CT2 conversion used by vid_pipeline. Provenance and hashes are pinned in the repository manifest.",
              "draft": False,
              "prerelease": False,
          }))
          PY
            curl -fsS "${auth[@]}" -H 'Content-Type: application/json' \
              --data-binary @/tmp/release-request.json "$api/releases" >/tmp/release.json
          elif [[ "$status" != 200 ]]; then
            cat /tmp/release.json
            exit 1
          fi
          release_id=$(python -c 'import json; print(json.load(open("/tmp/release.json"))["id"])')
          curl -fsS "${auth[@]}" "$api/releases/$release_id/assets?per_page=100" >/tmp/assets.json
          reuse=$(python - "$ASSET_NAME" <<'PY'
          import json, sys
          assets = json.load(open("/tmp/assets.json"))
          manifest = json.load(open("models/asr/large-v3-turbo-ct2-v1.json"))
          asset = next((x for x in assets if x["name"] == sys.argv[1]), None)
          if asset is None:
              print("upload")
          elif (
              asset.get("digest") == "sha256:" + manifest["asset_sha256"]
              and asset["size"] == manifest["asset_size"]
          ):
              print("reuse")
          else:
              print("conflict")
          PY
          )
          if [[ "$reuse" == conflict ]]; then
            echo "Release asset name exists with a different digest or size; refusing overwrite."
            exit 1
          fi
          if [[ "$reuse" == upload ]]; then
            curl -fsS "${auth[@]}" -H 'Content-Type: application/gzip' -X POST \
              --upload-file "/tmp/$ASSET_NAME" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$ASSET_NAME" \
              >/tmp/uploaded-asset.json
          else
            echo "Existing immutable Release asset digest and size match; reusing it."
          fi

      - name: Commit real manifest and remove the one-time marker
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/asr-large-v3-turbo-v1.trigger
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/bootstrap-asr-model.yml')
          text = path.read_text(encoding='utf-8')
          push_block = '  push:\n    branches: [main]\n    paths:\n      - ".github/bootstrap/asr-large-v3-turbo-v1.trigger"\n'
          if push_block not in text:
              raise SystemExit('bootstrap push trigger block not found')
          path.write_text(text.replace(push_block, ''), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f models/asr/large-v3-turbo-ct2-v1.json
          git add \
            .github/bootstrap/asr-large-v3-turbo-v1.trigger \
            .github/workflows/bootstrap-asr-model.yml
          git commit -m "chore: pin project-controlled ASR model artifact"
          git push origin HEAD:main
