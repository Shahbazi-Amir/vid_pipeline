name: Chehelstoun review package queue
run-name: Chehelstoun review package queue ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chehelstoun-review-package-queue.yml'
  workflow_dispatch:
  schedule:
    - cron: '3,33 * * * *'

permissions:
  contents: write
  actions: write

env:
  RELEASE_TAG: chehelstoun-archive-v1
  COLLECTION_ROOT: outputs/chehelstoun
  PROFILE: balanced
  LANGUAGE: fa
  AUDIO_PROFILE: safe
  VID_PIPELINE_ACCURACY_MODE: balanced
  VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub

concurrency:
  group: chehelstoun-review-package-serial
  cancel-in-progress: false

jobs:
  materialize-one:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select exactly one completed episode without package
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          chosen=''
          for n in $(seq 1 38); do
            ep=$(printf '%02d' "$n")
            root="${COLLECTION_ROOT}/${ep}"
            [[ -s "$root/delivery/transcript.txt" ]] || continue
            [[ ! -s "$root/review/assistant-review-package.json" ]] || continue
            asset=$(jq -c --arg ep "$ep" '[.assets[] | select((.name | test("^[0-9]{2}.*\\.mp3$")) and (.name[0:2] == $ep))][0] // empty' <<<"$release_json")
            [[ -n "$asset" ]] || continue
            chosen="$ep"
            echo "episode=$ep" >> "$GITHUB_OUTPUT"
            echo "asset_name=$(jq -r '.name' <<<"$asset")" >> "$GITHUB_OUTPUT"
            echo "asset_url=$(jq -r '.browser_download_url' <<<"$asset")" >> "$GITHUB_OUTPUT"
            echo "asset_size=$(jq -r '.size' <<<"$asset")" >> "$GITHUB_OUTPUT"
            break
          done
          if [[ -z "$chosen" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'No completed episode currently needs a review package.'
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Selected episode ${chosen}."
          fi

      - uses: actions/setup-python@v5
        if: steps.select.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache ASR model
        if: steps.select.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1

      - name: Install review worker
        if: steps.select.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Download source audio
        if: steps.select.outputs.ready == 'true'
        env:
          EPISODE: ${{ steps.select.outputs.episode }}
          ASSET_URL: ${{ steps.select.outputs.asset_url }}
          ASSET_SIZE: ${{ steps.select.outputs.asset_size }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chehelstoun-review-input
          input="/tmp/chehelstoun-review-input/${EPISODE}.mp3"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 "$ASSET_URL" -o "$input"
          test "$(stat -c %s "$input")" -eq "$ASSET_SIZE"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$input" | grep -q .

      - name: Generate review package for selected episode
        if: steps.select.outputs.ready == 'true'
        env:
          EPISODE: ${{ steps.select.outputs.episode }}
          ASSET_NAME: ${{ steps.select.outputs.asset_name }}
          ASSET_URL: ${{ steps.select.outputs.asset_url }}
        shell: bash
        run: |
          set -euo pipefail
          input="/tmp/chehelstoun-review-input/${EPISODE}.mp3"
          title="${ASSET_NAME%.mp3}"
          title="${title#?? - }"
          rm -rf /tmp/chehelstoun-review-runtime
          mkdir -p /tmp/chehelstoun-review-runtime
          vid-pipeline run-file "$input" \
            --name "chehelstoun-${EPISODE}" \
            --output-root /tmp/chehelstoun-review-runtime \
            --profile "$PROFILE" \
            --language "$LANGUAGE" \
            --device cpu \
            --compute-type int8 \
            --audio-profile "$AUDIO_PROFILE" \
            --hotwords "چهلستون، کمیل رودی، دکتر کمیل رودی، سواد مالی، رادیو گفت‌وگو" \
            --title "$title" \
            --program "چهلستون" \
            --network "رادیو گفت‌وگو" \
            --speaker "دکتر کمیل رودی" \
            --source-url "$ASSET_URL" \
            --no-editorial

      - name: Persist package without deleting existing episode data
        if: steps.select.outputs.ready == 'true'
        env:
          EPISODE: ${{ steps.select.outputs.episode }}
          ASSET_NAME: ${{ steps.select.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          job_dir=$(find /tmp/chehelstoun-review-runtime -mindepth 1 -maxdepth 1 -type d -name "chehelstoun-${EPISODE}-*" -print -quit)
          test -n "$job_dir"
          test -s "$job_dir/raw/transcript.raw.json"
          test -s "$job_dir/review/assistant-review-package.json"
          test -s "$job_dir/pre_review/transcript.pre-review.json"
          test -s "$job_dir/accuracy/transcript.consensus.json"

          dest="${COLLECTION_ROOT}/${EPISODE}"
          mkdir -p "$dest/raw" "$dest/machine" "$dest/final" "$dest/pre_review" "$dest/accuracy" "$dest/review"
          for dir in raw machine pre_review accuracy review; do
            if [[ -d "$job_dir/$dir" ]]; then
              find "$job_dir/$dir" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do cp "$f" "$dest/$dir/"; done
            fi
          done
          for f in transcript.final.txt transcript.final.md editorial-report.json; do
            [[ -f "$job_dir/final/$f" ]] && cp "$job_dir/final/$f" "$dest/final/$f"
          done

          python - "$dest/metadata.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          payload.update({
              'collection': 'چهلستون', 'episode': os.environ['EPISODE'], 'asset_name': os.environ['ASSET_NAME'],
              'chatgpt_review_ready': True, 'review_package_mode': 'per_episode_self_draining_queue',
              'review_clips_committed': False, 'review_package_run_id': os.environ['GITHUB_RUN_ID'],
          })
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          status = path.parent / 'review' / 'status.json'
          status.write_text(json.dumps({
              'schema_version': 1, 'episode': os.environ['EPISODE'], 'status': 'package_ready',
              'package_run_id': os.environ['GITHUB_RUN_ID'], 'assistant_review_committed': False,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit this episode before dispatching the next
        if: steps.select.outputs.ready == 'true'
        env:
          EPISODE: ${{ steps.select.outputs.episode }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${COLLECTION_ROOT}/${EPISODE}/raw" \
                     "${COLLECTION_ROOT}/${EPISODE}/machine" \
                     "${COLLECTION_ROOT}/${EPISODE}/final" \
                     "${COLLECTION_ROOT}/${EPISODE}/pre_review" \
                     "${COLLECTION_ROOT}/${EPISODE}/accuracy" \
                     "${COLLECTION_ROOT}/${EPISODE}/review" \
                     "${COLLECTION_ROOT}/${EPISODE}/metadata.json"
          git commit -m "Add Chehelstoun review package ${EPISODE}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Dispatch next package if another transcript is ready
        if: steps.select.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          next=''
          for n in $(seq 1 38); do
            ep=$(printf '%02d' "$n")
            root="${COLLECTION_ROOT}/${ep}"
            if [[ -s "$root/delivery/transcript.txt" && ! -s "$root/review/assistant-review-package.json" ]]; then
              next="$ep"
              break
            fi
          done
          if [[ -n "$next" ]]; then
            echo "Dispatching next ready episode: $next"
            gh workflow run chehelstoun-review-package-queue.yml --ref main
          else
            echo 'Queue currently drained; scheduled fallback will pick up future transcripts.'
          fi

      - name: Cleanup temporary media
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/chehelstoun-review-input /tmp/chehelstoun-review-runtime
