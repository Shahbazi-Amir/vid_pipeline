name: Bank Mellat 8 fallback fast
run-name: Bank Mellat 8 fast ASR ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bankmellatt-8-fallback-fast.yml'

permissions:
  contents: write

env:
  SOURCE_TAG: chehelstoun-archive-v1
  DEST: scratch/bankmellatt-8-fallback

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Locate 8.m4a
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${SOURCE_TAG}" > /tmp/release.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          rel=json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          hits=[a for a in rel.get('assets',[]) if a.get('name','').strip()=='8.m4a']
          if len(hits)!=1: raise SystemExit(f'Expected one 8.m4a, got {[a.get("name") for a in hits]}')
          a=hits[0]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"ASSET_URL={a['browser_download_url']}\nASSET_SIZE={a['size']}\n")
          print(a['name'], a['size'])
          PY
      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/vid-pipeline/asr
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -e '.[worker]'
      - name: Download M4A
        run: |
          curl -fL --retry 5 --retry-all-errors "$ASSET_URL" -o /tmp/8.m4a
          test "$(stat -c %s /tmp/8.m4a)" -eq "$ASSET_SIZE"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,duration -of default=nw=1 /tmp/8.m4a
      - name: Fast Persian ASR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b8fast
          vid-pipeline run-file /tmp/8.m4a \
            --name bankmellatt-8-new-m4a-fast \
            --output-root /tmp/b8fast \
            --profile fast \
            --language fa \
            --device cpu \
            --compute-type int8 \
            --audio-profile safe \
            --hotwords 'بانک ملت، کمیل رودی، دکتر کمیل رودی، سواد مالی' \
            --title 'بانک ملت - 8' \
            --program 'بانک ملت' \
            --speaker 'دکتر کمیل رودی' \
            --source-url "$ASSET_URL" \
            --no-editorial
          job=$(find /tmp/b8fast -mindepth 1 -maxdepth 1 -type d -name 'bankmellatt-*' -print -quit)
          test -s "$job/delivery/transcript.txt"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$job/delivery/transcript.txt" "$DEST/transcript.txt"
          cp "$job/source.json" "$DEST/source.json"
      - name: Commit fast transcript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git commit -m 'Fast transcribe Bank Mellat 8 from new M4A'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
