name: Flush semantic review payloads
on:
  push:
    paths:
      - '.github/flush-semantic-review.trigger'
permissions:
  contents: write
  statuses: write
jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"review/semantic-flush\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode and validate pending semantic payloads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          payloads=(.semantic_review_payload/*/*.b64)
          ((${#payloads[@]} > 0)) || { echo 'no pending payloads'; exit 1; }
          processed=0
          for payload in "${payloads[@]}"; do
            collection="$(basename "$(dirname "$payload")")"
            episode="$(basename "$payload" .b64)"
            case "$collection" in
              asre_shirin) out="outputs/asre_shirin/review" ;;
              khane_to) out="outputs/khane_to/review" ;;
              dar_jostojo_dar_again_raw) out="outputs/dar_jostojo_dar_again_raw/review" ;;
              *) echo "unsupported collection $collection"; continue ;;
            esac
            work="/tmp/$collection-$episode"
            rm -rf "$work"; mkdir -p "$work"
            if ! python - "$payload" "$work/payload.tar.gz" <<'PY'
          import base64,sys
          from pathlib import Path
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          clean=''.join(ch for ch in src if ch.isalnum() or ch in '+/=')
          clean += '=' * ((-len(clean)) % 4)
          try:
              data=base64.b64decode(clean, validate=False)
          except Exception as e:
              print(f'decode failed: {sys.argv[1]}: {e}', file=sys.stderr); raise SystemExit(1)
          Path(sys.argv[2]).write_bytes(data)
          print(sys.argv[1], 'chars', len(src), 'decoded', len(data))
          PY
            then
              echo "SKIP decode-failed $payload"; continue
            fi
            if ! gzip -t "$work/payload.tar.gz"; then
              echo "SKIP gzip-invalid $payload"; continue
            fi
            tar -xzf "$work/payload.tar.gz" -C "$work"
            if ! test -s "$work/timestamped/$episode.md" || ! test -s "$work/md/$episode.md" || ! test -s "$work/txt/$episode.txt"; then
              echo "SKIP contract-invalid $payload"; continue
            fi
            if ! python - "$work/timestamped/$episode.md" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          times=re.findall(r'^\[(\d\d:\d\d:\d\d → \d\d:\d\d:\d\d)\]',s,re.M)
          assert times, p
          assert 'گوینده نامشخص' not in s, p
          print('VALID',p,len(times))
          PY
            then
              echo "SKIP semantic-contract $payload"; continue
            fi
            mkdir -p "$out/timestamped" "$out/md" "$out/txt"
            cp "$work/timestamped/$episode.md" "$out/timestamped/$episode.md"
            cp "$work/md/$episode.md" "$out/md/$episode.md"
            cp "$work/txt/$episode.txt" "$out/txt/$episode.txt"
            rm -f "$payload"
            processed=$((processed+1))
          done
          echo "processed=$processed"
          ((processed > 0)) || exit 1
      - name: Commit and push semantic checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'review: flush semantic ChatGPT checkpoints'
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            sleep $((attempt*2))
          done
          exit 1
      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"review/semantic-flush\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
