name: Chehelstoun per-episode review apply
run-name: Apply next ChatGPT review ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chehelstoun-review-apply.yml'
      - '.github/review-apply-trigger.txt'
      - 'outputs/chehelstoun/*/review/chatgpt-corrections.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/review-apply-trigger.txt'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chehelstoun-review-apply-serial
  cancel-in-progress: false

env:
  COLLECTION_ROOT: outputs/chehelstoun

jobs:
  apply-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select exactly one reviewed episode
        id: select
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for n in $(seq 1 38); do
            ep=$(printf '%02d' "$n")
            root="${COLLECTION_ROOT}/${ep}"
            [[ -s "$root/review/chatgpt-corrections.json" ]] || continue
            [[ -s "$root/review/assistant-review-package.json" ]] || continue
            [[ -s "$root/review/uncertain-spans.json" ]] || continue
            [[ -s "$root/raw/transcript.raw.json" ]] || continue
            [[ ! -s "$root/human/verification.json" ]] || continue
            python -m json.tool "$root/review/chatgpt-corrections.json" >/dev/null
            chosen="$ep"
            echo "episode=$ep" >> "$GITHUB_OUTPUT"
            break
          done
          if [[ -z "$chosen" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'No reviewed episode is waiting for apply.'
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Selected episode ${chosen}; only this episode will be applied."
          fi

      - uses: actions/setup-python@v5
        if: steps.select.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pipeline
        if: steps.select.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Complete only equivalent missing decisions
        if: steps.select.outputs.ready == 'true'
        env:
          EPISODE: ${{ steps.select.outputs.episode }}
        shell: bash
        run: |
          set -euo pipefail
          root="${COLLECTION_ROOT}/${EPISODE}"
          python - "$root/review/uncertain-spans.json" "$root/review/chatgpt-corrections.json" <<'PY'
          import json, sys
          from pathlib import Path

          uncertain_path = Path(sys.argv[1])
          corrections_path = Path(sys.argv[2])
          uncertain = json.loads(uncertain_path.read_text(encoding='utf-8'))
          corrections = json.loads(corrections_path.read_text(encoding='utf-8'))
          items = corrections.setdefault('items', [])
          by_segment = {
              int(item['segment_id']): item
              for item in items
              if isinstance(item, dict) and item.get('segment_id') is not None
          }
          auto_completed = []
          substantive_missing = []
          for review_item in uncertain.get('items') or []:
              if not review_item.get('required', True):
                  continue
              segment_id = int(review_item['segment_id'])
              if segment_id in by_segment:
                  continue
              source = ' '.join(str(review_item.get('source_text') or '').split())
              proposed = ' '.join(str(review_item.get('proposed_text') or '').split())
              if source == proposed:
                  item = {
                      'id': review_item['id'],
                      'segment_id': segment_id,
                      'decision': 'accept_original',
                      'replacement': source,
                      'auto_completed_reason': 'source_equals_proposed',
                  }
                  items.append(item)
                  by_segment[segment_id] = item
                  auto_completed.append(review_item['id'])
              else:
                  substantive_missing.append(review_item['id'])
          if substantive_missing:
              raise SystemExit(
                  'Substantive required review items are missing: ' + ', '.join(substantive_missing)
              )
          corrections['auto_completed_equivalent_items'] = auto_completed
          corrections_path.write_text(
              json.dumps(corrections, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('Equivalent missing items auto-completed:', auto_completed)
          PY

      - name: Apply ChatGPT corrections and promote
        if: steps.select.outputs.ready == 'true'
        env:
          EPISODE: ${{ steps.select.outputs.episode }}
        shell: bash
        run: |
          set -euo pipefail
          root="${COLLECTION_ROOT}/${EPISODE}"
          vid-review apply "$root" "$root/review/chatgpt-corrections.json" \
            --reviewer "ChatGPT" \
            --promote
          test -s "$root/human/verification.json"
          test -s "$root/human/transcript.human.txt"
          test -s "$root/human/transcript.human.md"
          test -s "$root/delivery/transcript.txt"
          python - "$root/review/status.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          payload.update({
              'schema_version': 1,
              'episode': os.environ['EPISODE'],
              'status': 'chatgpt_review_applied',
              'assistant_review_committed': True,
              'apply_run_id': os.environ['GITHUB_RUN_ID'],
          })
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Sync canonical finalized output
        if: steps.select.outputs.ready == 'true'
        env:
          EPISODE: ${{ steps.select.outputs.episode }}
        shell: bash
        run: |
          set -euo pipefail
          root="${COLLECTION_ROOT}/${EPISODE}"
          dest="outputs/finalized/chehelstoun/${EPISODE}"
          rm -rf "$dest"
          mkdir -p "$dest/review"
          test -s "$root/final/transcript.final.md"
          test -s "$root/final/transcript.final.txt"
          cp "$root/final/transcript.final.md" "$dest/transcript.md"
          cp "$root/final/transcript.final.txt" "$dest/transcript.txt"
          [[ -s "$root/delivery/transcript.timestamped.md" ]] && cp "$root/delivery/transcript.timestamped.md" "$dest/transcript.timestamped.md"
          cp "$root/review/chatgpt-corrections.json" "$dest/review/chatgpt-corrections.json"
          cp "$root/human/verification.json" "$dest/review/verification.json"
          [[ -s "$root/source.json" ]] && cp "$root/source.json" "$dest/source.json"
          [[ -s "$root/metadata.json" ]] && cp "$root/metadata.json" "$dest/metadata.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('outputs/canonical-status.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'schema_version':1,'canonical_paths':{'finalized':'outputs/finalized','review_ready':'outputs/review-ready'},'finalized':[],'review_ready':[]}
          item=f"chehelstoun/{os.environ['EPISODE']}"
          finalized=list(dict.fromkeys(data.get('finalized',[])+[item]))
          ready=[x for x in data.get('review_ready',[]) if x != item]
          data['finalized']=finalized
          data['review_ready']=ready
          data['finalized_count']=len(finalized)
          data['review_ready_count']=len(ready)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit this reviewed episode before moving on
        if: steps.select.outputs.ready == 'true'
        env:
          EPISODE: ${{ steps.select.outputs.episode }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${COLLECTION_ROOT}/${EPISODE}" "outputs/finalized/chehelstoun/${EPISODE}" outputs/canonical-status.json
          if git diff --cached --quiet; then
            echo "No review changes to commit for ${EPISODE}."
            exit 0
          fi
          git commit -m "Apply ChatGPT review to Chehelstoun ${EPISODE}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
