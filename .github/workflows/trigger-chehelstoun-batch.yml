name: Trigger Chehelstoun transcription batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-chehelstoun-batch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch transcription workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/process-chehelstoun-batch.yml/dispatches" \
            -f ref=main

      - name: Report dispatch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state='${{ steps.dispatch.outcome }}'
          gh issue create \
            --title "Chehelstoun batch dispatch ${GITHUB_RUN_ID}" \
            --body "Bootstrap dispatch outcome: ${state}\n\nRun: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
