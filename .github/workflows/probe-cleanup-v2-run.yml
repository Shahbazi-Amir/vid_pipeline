name: Probe cleanup v2 run

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/probe-cleanup-v2-run.trigger"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read cleanup v2 run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          sha = 'beb13a98bb766ed712709a3325bb6af7c1519548'
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={sha}&per_page=20"
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          runs = [{
              'id': run['id'], 'name': run['name'], 'status': run['status'],
              'conclusion': run['conclusion'], 'head_sha': run['head_sha'],
              'html_url': run['html_url'],
          } for run in data.get('workflow_runs', [])]
          Path('validation').mkdir(exist_ok=True)
          Path('validation/cleanup-v2-run-probe.json').write_text(
              json.dumps({'runs': runs}, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit probe and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/probe-cleanup-v2-run.trigger
          rm -f .github/workflows/probe-cleanup-v2-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A validation/cleanup-v2-run-probe.json \
            .github/bootstrap/probe-cleanup-v2-run.trigger \
            .github/workflows/probe-cleanup-v2-run.yml
          git commit -m "test: record cleanup v2 workflow status"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
