name: Private release collections
run-name: Private release collections #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/private-release-collections.trigger"

permissions:
  contents: write

concurrency:
  group: private-release-collections
  cancel-in-progress: false

env:
  PRIVATE_MEDIA_REPO: ${{ secrets.PRIVATE_MEDIA_REPO }}
  PRIVATE_MEDIA_TOKEN: ${{ secrets.PRIVATE_MEDIA_TOKEN }}
  AI_REVIEW_ENABLED: "false"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - id: check
        shell: bash
        env:
          HF_TOKEN_VALUE: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$PRIVATE_MEDIA_REPO" ]] || missing+=("PRIVATE_MEDIA_REPO")
          [[ -n "$PRIVATE_MEDIA_TOKEN" ]] || missing+=("PRIVATE_MEDIA_TOKEN")
          [[ -n "$HF_TOKEN_VALUE" ]] || missing+=("HF_TOKEN")
          if ((${#missing[@]})); then
            joined="$(IFS=,; echo "${missing[*]}")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
            echo "Private collection run is blocked by missing non-paid infrastructure secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "Private collection preflight passed with external AI review disabled."
          fi

  record_start:
    needs: preflight
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record orchestration status
        shell: bash
        env:
          READY: ${{ needs.preflight.outputs.ready }}
          MISSING: ${{ needs.preflight.outputs.missing }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          ready = os.environ.get("READY", "false") == "true"
          payload = {
              "state": "running" if ready else "blocked",
              "phase": "preflight",
              "ai_review": "disabled",
              "missing_secrets": [item for item in os.environ.get("MISSING", "").split(",") if item],
              "updated_at_utc": datetime.now(UTC).isoformat(),
          }
          path = Path("benchmarks/private-collections-status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/private-collections-status.json
          git commit -m "ci: record private collection no-review run" || true
          git push origin HEAD:main

  discover_tehran:
    needs: [preflight, record_start]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      count: ${{ steps.manifest.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        shell: bash
        env:
          RELEASE_SELECTOR: uni-tehran-pending
          NUMBERING_MODE: leading
          EXPECTED_NUMBERS: "4,7,13,28,29,30"
        run: python scripts/private_release_manifest.py

  process_tehran:
    needs: discover_tehran
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover_tehran.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ASSET_ID: ${{ matrix.asset_id }}
      EXPECTED_SIZE: ${{ matrix.size }}
      EXPECTED_DIGEST: ${{ matrix.digest }}
      MEDIA_SUFFIX: ${{ matrix.suffix }}
      RESULT_NUMBER: ${{ matrix.result_number }}
      COLLECTION_ROOT: private-result
      DIARIZATION_ENABLED: "true"
      DIARIZATION_REQUIRED: "true"
      NUM_SPEAKERS: "2"
      SPEAKER_ROLE_MODE: host-teacher
      VID_PIPELINE_DIARIZATION_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/diarization
      VID_PIPELINE_DIARIZATION_BACKEND: pyannote-community-1
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: pyannote-${{ runner.os }}-py311-audio-4.0.4-community-1-v1
      - uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-faster-whisper-1.2.1-large-v3-turbo-ct2-v1
      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[worker,diarization-pyannote]'
      - name: Process private media without external AI review
        shell: bash
        env:
          VID_PIPELINE_PYANNOTE_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            bash scripts/process_private_release_asset.sh && exit 0
            echo "Processing attempt $attempt failed for result $RESULT_NUMBER" >&2
            rm -rf outputs private-result /tmp/vid-pipeline-private
            sleep $((attempt * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: private-tehran-${{ matrix.result_number }}
          path: private-result/**
          retention-days: 2
          if-no-files-found: error
      - name: Remove media
        if: always()
        run: rm -rf /tmp/vid-pipeline-private

  commit_tehran:
    needs: [discover_tehran, process_tehran]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: private-tehran-*
          path: staging
          merge-multiple: true
      - name: Merge and verify Tehran base transcripts
        run: |
          set -euo pipefail
          python scripts/merge_collection_artifacts.py staging outputs/uni_tehran
          python scripts/verify_collection.py outputs/uni_tehran --numbers 1-38 --base-only
      - name: Commit Tehran completion
        shell: bash
        env:
          COUNT: ${{ needs.discover_tehran.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          payload = {
              "state": "running",
              "phase": "tehran_complete",
              "ai_review": "disabled",
              "tehran_processed": int(os.environ["COUNT"]),
              "updated_at_utc": datetime.now(UTC).isoformat(),
          }
          Path("benchmarks/private-collections-status.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/uni_tehran benchmarks/private-collections-status.json
          git commit -m "data: complete Tehran base transcript collection"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  discover_mq:
    needs: commit_tehran
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      count: ${{ steps.manifest.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        shell: bash
        env:
          RELEASE_SELECTOR: mq
          NUMBERING_MODE: auto
          EXPECTED_NUMBERS: ""
        run: python scripts/private_release_manifest.py

  process_mq:
    needs: discover_mq
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover_mq.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ASSET_ID: ${{ matrix.asset_id }}
      EXPECTED_SIZE: ${{ matrix.size }}
      EXPECTED_DIGEST: ${{ matrix.digest }}
      MEDIA_SUFFIX: ${{ matrix.suffix }}
      RESULT_NUMBER: ${{ matrix.result_number }}
      COLLECTION_ROOT: private-result
      DIARIZATION_ENABLED: "false"
      DIARIZATION_REQUIRED: "false"
      NUM_SPEAKERS: "1"
      SPEAKER_ROLE_MODE: generic
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-faster-whisper-1.2.1-large-v3-turbo-ct2-v1
      - name: Install worker dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[worker]'
      - name: Process private media without external AI review
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            bash scripts/process_private_release_asset.sh && exit 0
            echo "Processing attempt $attempt failed for result $RESULT_NUMBER" >&2
            rm -rf outputs private-result /tmp/vid-pipeline-private
            sleep $((attempt * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: private-mq-${{ matrix.result_number }}
          path: private-result/**
          retention-days: 2
          if-no-files-found: error
      - name: Remove media
        if: always()
        run: rm -rf /tmp/vid-pipeline-private

  commit_mq:
    needs: [discover_mq, process_mq]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: private-mq-*
          path: staging
          merge-multiple: true
      - name: Merge and verify MQ base transcripts
        run: |
          set -euo pipefail
          python scripts/merge_collection_artifacts.py staging outputs/mq
          python scripts/verify_collection.py outputs/mq --base-only
      - name: Commit MQ collection
        shell: bash
        env:
          COUNT: ${{ needs.discover_mq.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          payload = {
              "state": "running",
              "phase": "mq_complete",
              "ai_review": "disabled",
              "mq_processed": int(os.environ["COUNT"]),
              "updated_at_utc": datetime.now(UTC).isoformat(),
          }
          Path("benchmarks/private-collections-status.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/mq benchmarks/private-collections-status.json
          git commit -m "data: add MQ base transcript collection"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  discover_trainer:
    needs: commit_mq
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      count: ${{ steps.manifest.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        shell: bash
        env:
          RELEASE_SELECTOR: "تربیت مربی"
          NUMBERING_MODE: auto
          EXPECTED_NUMBERS: ""
        run: python scripts/private_release_manifest.py

  process_trainer:
    needs: discover_trainer
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover_trainer.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ASSET_ID: ${{ matrix.asset_id }}
      EXPECTED_SIZE: ${{ matrix.size }}
      EXPECTED_DIGEST: ${{ matrix.digest }}
      MEDIA_SUFFIX: ${{ matrix.suffix }}
      RESULT_NUMBER: ${{ matrix.result_number }}
      COLLECTION_ROOT: private-result
      DIARIZATION_ENABLED: "false"
      DIARIZATION_REQUIRED: "false"
      NUM_SPEAKERS: "1"
      SPEAKER_ROLE_MODE: generic
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-faster-whisper-1.2.1-large-v3-turbo-ct2-v1
      - name: Install worker dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[worker]'
      - name: Process private media without external AI review
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            bash scripts/process_private_release_asset.sh && exit 0
            echo "Processing attempt $attempt failed for result $RESULT_NUMBER" >&2
            rm -rf outputs private-result /tmp/vid-pipeline-private
            sleep $((attempt * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: private-trainer-${{ matrix.result_number }}
          path: private-result/**
          retention-days: 2
          if-no-files-found: error
      - name: Remove media
        if: always()
        run: rm -rf /tmp/vid-pipeline-private

  commit_trainer:
    needs: [discover_trainer, process_trainer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: private-trainer-*
          path: staging
          merge-multiple: true
      - name: Merge and verify trainer base transcripts
        run: |
          set -euo pipefail
          python scripts/merge_collection_artifacts.py staging outputs/tarbiat_morabi
          python scripts/verify_collection.py outputs/tarbiat_morabi --base-only
      - name: Commit trainer collection
        shell: bash
        env:
          COUNT: ${{ needs.discover_trainer.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          payload = {
              "state": "complete",
              "phase": "trainer_complete",
              "ai_review": "disabled",
              "trainer_processed": int(os.environ["COUNT"]),
              "updated_at_utc": datetime.now(UTC).isoformat(),
          }
          Path("benchmarks/private-collections-status.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/tarbiat_morabi benchmarks/private-collections-status.json
          git commit -m "data: add trainer base transcript collection"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
