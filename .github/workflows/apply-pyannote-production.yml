name: Apply pyannote production wiring

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/apply-pyannote-production.trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply production wiring
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/apply_pyannote_production.py
          python /tmp/apply_pyannote_production.py
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization]'
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check .
          python -m compileall -q src tests
          git diff --check
      - name: Commit production wiring
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/apply-pyannote-production.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vid_pipeline/cli.py src/vid_pipeline/github_client.py .github/workflows/process-uploaded-video.yml .github/bootstrap/apply-pyannote-production.trigger
          git commit -m "feat: wire pyannote backend into production workflow"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
