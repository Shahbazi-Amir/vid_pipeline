name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python -m compileall -q src tests scripts
      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in sorted(Path("schemas").glob("*.json")):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
              print(f"valid: {path}")
          PY
      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"valid: {path}")
          PY
      - run: python -c "import vid_pipeline"
      - run: vid-pipeline --help
      - name: Client-only installation
        run: |
          python -m venv /tmp/client-venv
          /tmp/client-venv/bin/pip install -e '.[client]'
          /tmp/client-venv/bin/vid-pipeline --help
          /tmp/client-venv/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("faster_whisper") is None
          assert importlib.util.find_spec("torch") is None
          PY
      - name: Reject generated media and oversized files
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          blocked_directories = {"outputs", "cache", "tmp"}
          blocked_suffixes = {".mp4", ".mkv", ".mov", ".wav", ".flac"}
          violations = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for item in tracked:
              if not item:
                  continue
              path = Path(item)
              if blocked_directories.intersection(path.parts) or path.suffix.lower() in blocked_suffixes:
                  violations.append(str(path))
              elif path.stat().st_size > 5 * 1024 * 1024:
                  violations.append(f"{path} (larger than 5 MiB)")
          if violations:
              raise SystemExit("Forbidden generated files:\n" + "\n".join(violations))
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux CPU image
        run: docker build -t vid-pipeline:ci .
      - name: Smoke-test package and CLI
        run: |
          docker run --rm --entrypoint python vid-pipeline:ci -c "import vid_pipeline"
          docker run --rm vid-pipeline:ci --help
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t vid-pipeline-api:ci .
      - name: Build worker image
        run: docker build -f docker/Dockerfile.worker -t vid-pipeline-worker:ci .
      - name: API smoke test
        run: |
          docker run -d --name pipeline-api -p 8000:8000 vid-pipeline-api:ci
          for i in $(seq 1 20); do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs pipeline-api
          exit 1
      - name: Worker smoke test
        run: |
          docker run --rm --entrypoint ffmpeg vid-pipeline-worker:ci -version
          docker run --rm --entrypoint ffprobe vid-pipeline-worker:ci -version
