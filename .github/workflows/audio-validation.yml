name: Audio validation

on:
  push:
    branches:
      - feature/audio-input-support
    paths:
      - 'src/vid_pipeline/audio.py'
      - 'src/vid_pipeline/media.py'
      - 'src/vid_pipeline/cli.py'
      - 'src/vid_pipeline/standalone.py'
      - 'src/vid_pipeline/github_client.py'
      - 'src/vid_pipeline/github_compat.py'
      - 'src/vid_pipeline/online_client.py'
      - 'src/vid_pipeline/server/api.py'
      - 'src/vid_pipeline/server/worker.py'
      - 'tests/integration/test_audio_input.py'
      - 'tests/test_github_compat_url.py'
      - 'tests/test_github_workflow_contract.py'
      - 'tests/test_uploaded_workflow_artifact_scope.py'
      - 'tests/test_url_dispatch_options_contract.py'
      - '.github/workflows/process-uploaded-video.yml'
      - '.github/workflows/process-video.yml'
      - '.github/workflows/audio-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  audio-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint audio scope
        run: |
          ruff check \
            src/vid_pipeline/audio.py \
            src/vid_pipeline/media.py \
            tests/integration/test_audio_input.py \
            tests/test_github_compat_url.py \
            tests/test_uploaded_workflow_artifact_scope.py \
            tests/test_url_dispatch_options_contract.py

      - name: Run audio integration tests
        run: python -m pytest -q tests/integration/test_audio_input.py

      - name: Run audio workflow contract tests
        run: |
          python -m pytest -q \
            tests/test_github_compat_url.py \
            tests/test_github_workflow_contract.py \
            tests/test_uploaded_workflow_artifact_scope.py \
            tests/test_url_dispatch_options_contract.py

      - name: Compile audio scope
        run: |
          python -m compileall -q \
            src/vid_pipeline/audio.py \
            src/vid_pipeline/media.py \
            tests/integration/test_audio_input.py

      - name: Publish audio validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="Audio validation passed"
          else
            STATE=failure
            DESCRIPTION="Audio validation failed"
          fi
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"audio-validation\",\"description\":\"$DESCRIPTION\"}"
