name: One-shot Clear Actions Cache

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  clear-cache:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all repository Actions caches after CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Before:"
          gh api "/repos/$REPO/actions/cache/usage"
          ids="$(gh api --paginate "/repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[].id')"
          if [[ -z "$ids" ]]; then
            echo "No caches found."
          else
            while IFS= read -r id; do
              [[ -z "$id" ]] && continue
              echo "Deleting cache $id"
              gh api --method DELETE "/repos/$REPO/actions/caches/$id"
            done <<< "$ids"
          fi
          echo "After:"
          gh api "/repos/$REPO/actions/cache/usage"
