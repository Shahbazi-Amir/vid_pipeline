name: Fix pyannote micro-switch smoothing

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/fix-pyannote-micro-switch.trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply conservative strong-island smoothing fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          diarization = "src/vid_pipeline/diarization.py"

          replace_once(
              diarization,
              '''    micro_turn_max_duration_seconds: float = 1.25\n    micro_turn_max_words: int = 3\n    smoothing_max_gap_seconds: float = 0.25\n''',
              '''    micro_turn_max_duration_seconds: float = 1.25\n    micro_turn_max_words: int = 3\n    strong_micro_island_max_duration_seconds: float = 0.90\n    strong_micro_island_max_words: int = 2\n    smoothing_max_gap_seconds: float = 0.25\n''',
          )

          replace_once(
              diarization,
              '''def _speaker_switches(rows: list[dict[str, Any]]) -> int:\n    speakers = [str(row.get("speaker") or "") for row in rows]\n    return sum(current != previous for previous, current in zip(speakers, speakers[1:]))\n\n\ndef smooth_speaker_turns(\n''',
              '''def _speaker_switches(rows: list[dict[str, Any]]) -> int:\n    speakers = [str(row.get("speaker") or "") for row in rows]\n    return sum(current != previous for previous, current in zip(speakers, speakers[1:]))\n\n\n_PROTECTED_SHORT_REPLIES = frozenset({\n    "بله", "نه", "آره", "اره", "خب", "درسته", "درست", "دقیقاً", "دقیقا",\n    "حتماً", "حتما", "البته", "باشه", "ممنون",\n})\n_SHORT_REPLY_TRIM = " \\t\\r\\n.,،:;؛!؟?…«»()[]{}\\\"'"\n\n\ndef _normalized_short_reply(text: str) -> str:\n    value = " ".join(str(text or "").strip().split()).strip(_SHORT_REPLY_TRIM)\n    return value.replace("ي", "ی").replace("ك", "ک")\n\n\ndef _is_protected_short_reply(text: str) -> bool:\n    return _normalized_short_reply(text) in _PROTECTED_SHORT_REPLIES\n\n\ndef smooth_speaker_turns(\n''',
          )

          old_func = '''def smooth_speaker_turns(\n    rows: list[dict[str, Any]], config: DiarizationConfig\n) -> tuple[list[dict[str, Any]], dict[str, int]]:\n    """Conservatively remove weak same-speaker sandwich micro-turns."""\n\n    smoothed = [dict(row) for row in rows]\n    before = len(smoothed)\n    switches_before = _speaker_switches(smoothed)\n    merged = preserved = 0\n    if config.smoothing_enabled:\n        index = 1\n        while index < len(smoothed) - 1:\n            previous, candidate, following = smoothed[index - 1:index + 2]\n            duration = max(0.0, float(candidate["end"]) - float(candidate["start"]))\n            word_count = int(candidate.get("aligned_word_count") or len(str(candidate.get("text") or "").split()))\n            evidence = candidate.get("speaker_evidence") or {}\n            same_speaker_sandwich = (\n                previous.get("speaker") == following.get("speaker")\n                and candidate.get("speaker") != previous.get("speaker")\n            )\n            local = (\n                float(candidate["start"]) - float(previous["end"])\n                <= config.smoothing_max_gap_seconds\n                and float(following["start"]) - float(candidate["end"])\n                <= config.smoothing_max_gap_seconds\n            )\n            micro = (\n                duration <= config.micro_turn_max_duration_seconds\n                and word_count <= config.micro_turn_max_words\n            )\n            near_zero = duration < config.minimum_export_turn_span_seconds\n            weak = bool(evidence.get("ambiguous", True)) or float(\n                evidence.get("overlap_margin", 0.0)\n            ) < config.smoothing_min_overlap_margin\n            boundary = str(previous.get("text") or "").rstrip().endswith(tuple(".!؟?")) or str(\n                candidate.get("text") or ""\n            ).rstrip().endswith(tuple(".!؟?"))\n            eligible = same_speaker_sandwich and local and micro\n            if eligible and weak and (near_zero or not boundary):\n                previous["text"] = join_word_tokens([\n                    str(previous.get("text") or ""), str(candidate.get("text") or ""),\n                    str(following.get("text") or ""),\n                ])\n                previous["end"] = following["end"]\n                previous["aligned_word_count"] = sum(\n                    int(row.get("aligned_word_count") or len(str(row.get("text") or "").split()))\n                    for row in (previous, candidate, following)\n                )\n                smoothed[index - 1:index + 2] = [previous]\n                merged += 1\n                index = max(1, index - 1)\n                continue\n            if eligible:\n                preserved += 1\n            index += 1\n    return smoothed, {\n        "pre_smoothing_segments": before,\n        "post_smoothing_segments": len(smoothed),\n        "speaker_switches_before": switches_before,\n        "speaker_switches_after": _speaker_switches(smoothed),\n        "micro_turns_merged": merged,\n        "micro_turns_preserved": preserved,\n    }\n'''

          new_func = '''def smooth_speaker_turns(\n    rows: list[dict[str, Any]], config: DiarizationConfig\n) -> tuple[list[dict[str, Any]], dict[str, int]]:\n    """Conservatively remove false same-speaker sandwich micro-turns."""\n\n    smoothed = [dict(row) for row in rows]\n    before = len(smoothed)\n    switches_before = _speaker_switches(smoothed)\n    merged = preserved = 0\n    weak_merged = strong_merged = protected_preserved = 0\n    if config.smoothing_enabled:\n        index = 1\n        while index < len(smoothed) - 1:\n            previous, candidate, following = smoothed[index - 1:index + 2]\n            duration = max(0.0, float(candidate["end"]) - float(candidate["start"]))\n            word_count = int(\n                candidate.get("aligned_word_count")\n                or len(str(candidate.get("text") or "").split())\n            )\n            evidence = candidate.get("speaker_evidence") or {}\n            same_speaker_sandwich = (\n                previous.get("speaker") == following.get("speaker")\n                and candidate.get("speaker") != previous.get("speaker")\n            )\n            local = (\n                float(candidate["start"]) - float(previous["end"])\n                <= config.smoothing_max_gap_seconds\n                and float(following["start"]) - float(candidate["end"])\n                <= config.smoothing_max_gap_seconds\n            )\n            micro = (\n                duration <= config.micro_turn_max_duration_seconds\n                and word_count <= config.micro_turn_max_words\n            )\n            near_zero = duration < config.minimum_export_turn_span_seconds\n            weak = bool(evidence.get("ambiguous", True)) or float(\n                evidence.get("overlap_margin", 0.0)\n            ) < config.smoothing_min_overlap_margin\n            boundary = str(previous.get("text") or "").rstrip().endswith(\n                tuple(".!؟?")\n            ) or str(candidate.get("text") or "").rstrip().endswith(tuple(".!؟?"))\n            protected_reply = _is_protected_short_reply(str(candidate.get("text") or ""))\n            raw_support = float(evidence.get("supporting_raw_turn_duration", 0.0) or 0.0)\n            strong_fragmentary_island = (\n                duration <= config.strong_micro_island_max_duration_seconds\n                and word_count <= config.strong_micro_island_max_words\n                and raw_support > 0.0\n                and raw_support <= config.strong_micro_island_max_duration_seconds\n                and not protected_reply\n                and not boundary\n            )\n            eligible = same_speaker_sandwich and local and micro\n            should_merge = (\n                eligible\n                and not protected_reply\n                and (near_zero or not boundary)\n                and (weak or strong_fragmentary_island)\n            )\n            if should_merge:\n                previous["text"] = join_word_tokens([\n                    str(previous.get("text") or ""),\n                    str(candidate.get("text") or ""),\n                    str(following.get("text") or ""),\n                ])\n                previous["end"] = following["end"]\n                previous["aligned_word_count"] = sum(\n                    int(\n                        row.get("aligned_word_count")\n                        or len(str(row.get("text") or "").split())\n                    )\n                    for row in (previous, candidate, following)\n                )\n                smoothed[index - 1:index + 2] = [previous]\n                merged += 1\n                if strong_fragmentary_island and not weak:\n                    strong_merged += 1\n                else:\n                    weak_merged += 1\n                index = max(1, index - 1)\n                continue\n            if eligible:\n                preserved += 1\n                if protected_reply:\n                    protected_preserved += 1\n            index += 1\n    return smoothed, {\n        "pre_smoothing_segments": before,\n        "post_smoothing_segments": len(smoothed),\n        "speaker_switches_before": switches_before,\n        "speaker_switches_after": _speaker_switches(smoothed),\n        "micro_turns_merged": merged,\n        "weak_micro_turns_merged": weak_merged,\n        "strong_micro_islands_merged": strong_merged,\n        "protected_short_replies_preserved": protected_preserved,\n        "micro_turns_preserved": preserved,\n    }\n'''
          replace_once(diarization, old_func, new_func)

          tests = "tests/test_diarization.py"
          anchor = '''@pytest.mark.parametrize("reply", ["بله", "نه", "درسته", "دقیقاً", "خب", "آره"])\ndef test_smoothing_preserves_strong_short_reply(reply):\n    rows = [\n        _aligned_turn(0, 5, "SPEAKER_00", "آیا این موضوع روشن است؟", margin=1),\n        _aligned_turn(5, 5.7, "SPEAKER_01", reply, margin=1),\n        _aligned_turn(5.7, 10, "SPEAKER_00", "پس ادامه می\\u200cدهیم", margin=1),\n    ]\n    result, diagnostics = smooth_speaker_turns(rows, DiarizationConfig())\n    assert [row["speaker"] for row in result] == ["SPEAKER_00", "SPEAKER_01", "SPEAKER_00"]\n    assert diagnostics["micro_turns_preserved"] == 1\n\n\n'''
          addition = anchor + '''def test_smoothing_merges_strong_fragmentary_micro_island_from_live_shape():\n    rows = [\n        _aligned_turn(0.0, 5.48, "SPEAKER_00", "ساختاری از دانش نگرش و مهارت که ظاهرا", margin=1.0),\n        _aligned_turn(5.48, 6.08, "SPEAKER_01", "قراره بهش", margin=0.937),\n        _aligned_turn(6.08, 7.54, "SPEAKER_00", "بگیم سواد مالی", margin=1.0),\n    ]\n    rows[1]["speaker_evidence"]["supporting_raw_turn_duration"] = 0.759\n    before_words = sum(int(row["aligned_word_count"]) for row in rows)\n    result, diagnostics = smooth_speaker_turns(rows, DiarizationConfig())\n    assert len(result) == 1\n    assert result[0]["speaker"] == "SPEAKER_00"\n    assert result[0]["text"] == (\n        "ساختاری از دانش نگرش و مهارت که ظاهرا قراره بهش بگیم سواد مالی"\n    )\n    assert int(result[0]["aligned_word_count"]) == before_words\n    assert diagnostics["strong_micro_islands_merged"] == 1\n    assert diagnostics["weak_micro_turns_merged"] == 0\n    assert diagnostics["speaker_switches_after"] == 0\n\n\ndef test_smoothing_preserves_protected_backchannel_without_question_boundary():\n    rows = [\n        _aligned_turn(0, 5, "SPEAKER_00", "این نکته خیلی مهم است", margin=1),\n        _aligned_turn(5, 5.6, "SPEAKER_01", "دقیقاً", margin=0.95),\n        _aligned_turn(5.6, 10, "SPEAKER_00", "و باید ادامه بدهیم", margin=1),\n    ]\n    result, diagnostics = smooth_speaker_turns(rows, DiarizationConfig())\n    assert [row["speaker"] for row in result] == ["SPEAKER_00", "SPEAKER_01", "SPEAKER_00"]\n    assert diagnostics["protected_short_replies_preserved"] == 1\n\n\ndef test_smoothing_does_not_merge_short_text_with_long_raw_support():\n    rows = [\n        _aligned_turn(0, 5, "SPEAKER_00", "شروع جمله", margin=1),\n        _aligned_turn(5, 5.6, "SPEAKER_01", "دو کلمه", margin=0.95),\n        _aligned_turn(5.6, 10, "SPEAKER_00", "ادامه جمله", margin=1),\n    ]\n    rows[1]["speaker_evidence"]["supporting_raw_turn_duration"] = 1.8\n    result, diagnostics = smooth_speaker_turns(rows, DiarizationConfig())\n    assert len(result) == 3\n    assert diagnostics["strong_micro_islands_merged"] == 0\n\n\n'''
          replace_once(tests, anchor, addition)
          PY

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization]'

      - name: Validate full repository
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check .
          python -m compileall -q src tests
          git diff --check

      - name: Commit fix and clean trigger
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/fix-pyannote-micro-switch.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vid_pipeline/diarization.py tests/test_diarization.py .github/bootstrap/fix-pyannote-micro-switch.trigger
          git commit -m "fix: smooth strong pyannote micro-islands"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
