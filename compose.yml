services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      VID_PIPELINE_DATABASE_URL: postgresql+psycopg://pipeline:pipeline@database/pipeline
      VID_PIPELINE_REDIS_URL: redis://redis:6379/0
      VID_PIPELINE_STORAGE_ROOT: /data/storage
      VID_PIPELINE_JOB_TIMEOUT_SECONDS: ${VID_PIPELINE_JOB_TIMEOUT_SECONDS:-43200}
      VID_PIPELINE_RESULT_TTL_SECONDS: ${VID_PIPELINE_RESULT_TTL_SECONDS:-604800}
      VID_PIPELINE_FAILURE_TTL_SECONDS: ${VID_PIPELINE_FAILURE_TTL_SECONDS:-2592000}
    ports: ["8000:8000"]
    volumes: [pipeline-storage:/data/storage]
    depends_on: [database, redis]
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      VID_PIPELINE_DATABASE_URL: postgresql+psycopg://pipeline:pipeline@database/pipeline
      VID_PIPELINE_REDIS_URL: redis://redis:6379/0
      VID_PIPELINE_STORAGE_ROOT: /data/storage
      VID_PIPELINE_ASR_CACHE: ${VID_PIPELINE_ASR_CACHE:-/models/asr}
    volumes:
      - pipeline-storage:/data/storage
      - model-cache:/models
    depends_on: [database, redis]
  redis:
    image: redis:7-alpine
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    volumes: [database-data:/var/lib/postgresql/data]
volumes:
  database-data:
  model-cache:
  pipeline-storage:
