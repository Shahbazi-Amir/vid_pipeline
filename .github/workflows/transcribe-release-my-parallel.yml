name: Transcribe release my in parallel
run-name: Release my — parallel transcription

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/transcribe-release-my-parallel.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-my-parallel-transcription
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      count: ${{ steps.inventory.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Inventory release media
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p inventory
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/my",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "vid-pipeline-release-my-parallel",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)

          media_extensions = {
              ".mp3", ".m4a", ".wav", ".flac", ".aac", ".ogg", ".opus",
              ".mp4", ".mkv", ".mov", ".webm", ".mpeg", ".mpg", ".m4v",
          }
          assets = []
          for asset in release.get("assets", []):
              suffix = pathlib.Path(asset["name"]).suffix.lower()
              if suffix not in media_extensions:
                  continue
              assets.append({
                  "id": asset["id"],
                  "name": asset["name"],
                  "size": asset["size"],
                  "digest": asset.get("digest") or "",
                  "suffix": suffix,
                  "browser_download_url": asset["browser_download_url"],
              })
          assets.sort(key=lambda item: item["name"].casefold())
          if not assets:
              raise SystemExit("Release tag 'my' contains no supported media assets")
          for index, item in enumerate(assets, start=1):
              item["index"] = f"{index:02d}"

          manifest = {
              "repository": repo,
              "release_tag": "my",
              "release_name": release.get("name"),
              "release_id": release.get("id"),
              "media_asset_count": len(assets),
              "processing_mode": "parallel_matrix_max_4",
              "max_parallel": 4,
              "transcription_profile": "balanced",
              "transcription_model": "large-v3-turbo",
              "assets": assets,
          }
          pathlib.Path("inventory/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          matrix = json.dumps({"include": assets}, ensure_ascii=False, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={matrix}\n")
              output.write(f"count={len(assets)}\n")
          print(f"Found {len(assets)} media assets")
          for item in assets:
              print(item["index"], item["name"], item["size"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-my-inventory
          path: inventory/manifest.json
          if-no-files-found: error
          retention-days: 7

  process:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Run transcription worker
        id: worker
        continue-on-error: true
        shell: bash
        env:
          PRIVATE_MEDIA_REPO: ${{ github.repository }}
          PRIVATE_MEDIA_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ matrix.id }}
          ASSET_NAME: ${{ matrix.name }}
          EXPECTED_SIZE: ${{ matrix.size }}
          EXPECTED_DIGEST: ${{ matrix.digest }}
          MEDIA_SUFFIX: ${{ matrix.suffix }}
          ASSET_URL: ${{ matrix.browser_download_url }}
          RESULT_NUMBER: ${{ matrix.index }}
          COLLECTION_ROOT: staging/release-my
          DIARIZATION_ENABLED: "false"
          AI_REVIEW_ENABLED: "false"
          TRANSCRIPTION_PROFILE: balanced
          TRANSCRIPTION_MODEL: large-v3-turbo
        run: |
          set +e
          mkdir -p staging/release-my/logs
          log="staging/release-my/logs/${RESULT_NUMBER}.log"
          bash scripts/process_private_release_asset.sh >"$log" 2>&1
          code=$?
          cat "$log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Add provenance and asset metadata
        if: steps.worker.outcome == 'success'
        shell: bash
        env:
          ASSET_ID: ${{ matrix.id }}
          ASSET_NAME: ${{ matrix.name }}
          EXPECTED_SIZE: ${{ matrix.size }}
          EXPECTED_DIGEST: ${{ matrix.digest }}
          ASSET_URL: ${{ matrix.browser_download_url }}
          RESULT_NUMBER: ${{ matrix.index }}
          COLLECTION_ROOT: staging/release-my
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["COLLECTION_ROOT"])
          number = os.environ["RESULT_NUMBER"]
          name = os.environ["ASSET_NAME"]
          url = os.environ["ASSET_URL"]
          md_header = (
              "## منبع فایل\n"
              "- Release: `my`\n"
              f"- Asset: `{name}`\n"
              f"- URL: {url}\n\n"
          )
          txt_header = (
              "منبع فایل:\n"
              "Release: my\n"
              f"Asset: {name}\n"
              f"URL: {url}\n\n"
          )
          for path in (root / "md" / f"{number}.md", root / "timestamped" / f"{number}.md"):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("## منبع فایل"):
                  path.write_text(md_header + text, encoding="utf-8")
          txt_path = root / "txt" / f"{number}.txt"
          text = txt_path.read_text(encoding="utf-8")
          if not text.startswith("منبع فایل:"):
              txt_path.write_text(txt_header + text, encoding="utf-8")

          assets = root / "assets"
          assets.mkdir(parents=True, exist_ok=True)
          (assets / f"{number}.json").write_text(
              json.dumps({
                  "release_tag": "my",
                  "asset_id": int(os.environ["ASSET_ID"]),
                  "asset_name": name,
                  "size": int(os.environ["EXPECTED_SIZE"]),
                  "digest": os.environ.get("EXPECTED_DIGEST", ""),
                  "browser_download_url": url,
                  "transcription_profile": "balanced",
                  "asr_model": "large-v3-turbo",
                  "review_status": "pending_chatgpt_review",
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload per-asset result and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-my-result-${{ matrix.index }}
          path: staging/release-my
          if-no-files-found: error
          retention-days: 7

      - name: Fail matrix item when worker failed
        if: steps.worker.outcome != 'success'
        shell: bash
        run: |
          echo "Transcription failed for ${{ matrix.index }} ${{ matrix.name }}"
          exit 1

  collect:
    needs:
      - inventory
      - process
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download inventory
        uses: actions/download-artifact@v4
        with:
          name: release-my-inventory
          path: collected/inventory

      - name: Download all per-asset results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: release-my-result-*
          path: collected/results
          merge-multiple: true

      - name: Materialize results and status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            outputs/release-my/raw/md \
            outputs/release-my/raw/timestamped \
            outputs/release-my/raw/txt \
            outputs/release-my/assets \
            outputs/release-my/logs

          cp collected/inventory/manifest.json outputs/release-my/manifest.json
          for source in md timestamped txt; do
            if [[ -d "collected/results/$source" ]]; then
              mkdir -p "outputs/release-my/raw/$source"
              cp -a "collected/results/$source/." "outputs/release-my/raw/$source/"
            fi
          done
          for source in assets logs; do
            if [[ -d "collected/results/$source" ]]; then
              mkdir -p "outputs/release-my/$source"
              cp -a "collected/results/$source/." "outputs/release-my/$source/"
            fi
          done

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/release-my")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = int(manifest["media_asset_count"])
          completed = sum(1 for p in (root / "raw" / "md").glob("*.md") if p.is_file() and p.stat().st_size > 0)
          state = "all_raw_transcripts_complete" if completed >= expected else "partial_failed"
          (root / "status.json").write_text(
              json.dumps({
                  "state": state,
                  "expected_media_assets": expected,
                  "completed_raw_transcripts": completed,
                  "max_parallel": 4,
                  "asr_model": "large-v3-turbo",
                  "review": "pending_chatgpt_review",
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"state={state} completed={completed}/{expected}")
          PY

      - name: Commit available transcription results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/release-my
          if git diff --cached --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "Update parallel transcripts from release my"
          git pull --rebase origin main
          git push origin HEAD:main
