[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcript-pipeline"
version = "0.7.0"
description = "Audio-to-transcript pipeline with multi-pass ASR consensus, lossless pre-review, and auditable human review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Amir Shahbazi" }
]
dependencies = []

[project.optional-dependencies]
download = [
  "yt-dlp"
]
whisper = [
  "faster-whisper>=1.2.1"
]
alignment = [
  "whisperx>=3.4"
]
diarization = [
  "pyannote.audio>=4.0"
]
all = [
  "yt-dlp",
  "faster-whisper>=1.2.1"
]
advanced = [
  "yt-dlp",
  "faster-whisper>=1.2.1",
  "whisperx>=3.4",
  "pyannote.audio>=4.0"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
vid-pipeline = "vid_pipeline.reliable_cli:main"
vid-review = "vid_pipeline.review_cli:main"
vid-accuracy = "vid_pipeline.accuracy_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
