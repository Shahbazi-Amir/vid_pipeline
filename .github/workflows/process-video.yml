name: Process video URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: Video page or direct media URL
        required: true
        type: string
      source_url:
        description: Optional public source page shown in the final file
        required: false
        type: string
      name:
        description: Optional job name
        required: false
        type: string
      title:
        description: Optional Persian title
        required: false
        type: string
      program:
        description: Optional program name
        required: false
        type: string
      network:
        description: Optional network or publisher
        required: false
        type: string
      date:
        description: Optional publication date
        required: false
        type: string
      guest:
        description: Optional guest name
        required: false
        type: string
      editorial_context:
        description: Topic and important names for the local editor
        required: false
        type: string
      whisper_model:
        description: faster-whisper model
        required: true
        default: large-v3-turbo
        type: string
      editorial_model:
        description: Local Ollama model
        required: true
        default: qwen2.5:7b
        type: string
      accuracy_mode:
        description: Multi-pass ASR mode
        required: true
        default: balanced
        type: choice
        options: [off, fast, balanced, maximum]
      whisperx_alignment:
        description: Install and run optional WhisperX alignment
        required: true
        default: false
        type: boolean
      diarization:
        description: Install and run optional pyannote diarization
        required: true
        default: false
        type: boolean
  push:
    paths:
      - 'runs/*.request.json'
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: video-transcript-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[vid-pipeline]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIDEO_URL: ${{ inputs.url }}
      SOURCE_URL: ${{ inputs.source_url }}
      JOB_NAME: ${{ inputs.name }}
      VIDEO_TITLE: ${{ inputs.title }}
      PROGRAM_NAME: ${{ inputs.program }}
      NETWORK_NAME: ${{ inputs.network }}
      VIDEO_DATE: ${{ inputs.date }}
      GUEST_NAME: ${{ inputs.guest }}
      EDITORIAL_CONTEXT: ${{ inputs.editorial_context }}
      WHISPER_MODEL: ${{ inputs.whisper_model || 'large-v3-turbo' }}
      EDITORIAL_MODEL: ${{ inputs.editorial_model || 'qwen2.5:7b' }}
      VID_PIPELINE_ACCURACY_MODE: ${{ inputs.accuracy_mode || 'balanced' }}
      VID_PIPELINE_WHISPERX_ALIGNMENT: ${{ inputs.whisperx_alignment || 'false' }}
      VID_PIPELINE_DIARIZATION: ${{ inputs.diarization || 'false' }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      OLLAMA_BASE_URL: http://127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request file
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          request_file=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep '^runs/.*\.request\.json$' | tail -n 1)
          test -n "$request_file"
          python - "$request_file" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          mapping = {
              "VIDEO_URL": data.get("media_url") or data.get("url") or "",
              "SOURCE_URL": data.get("source_url") or data.get("url") or "",
              "JOB_NAME": data.get("name") or "",
              "VIDEO_TITLE": data.get("title") or "",
              "PROGRAM_NAME": data.get("program") or "",
              "NETWORK_NAME": data.get("network") or "",
              "VIDEO_DATE": data.get("date") or "",
              "GUEST_NAME": data.get("guest") or "",
              "EDITORIAL_CONTEXT": data.get("editorial_context") or "",
              "WHISPER_MODEL": data.get("whisper_model") or "large-v3-turbo",
              "EDITORIAL_MODEL": data.get("editorial_model") or "qwen2.5:7b",
              "VID_PIPELINE_ACCURACY_MODE": data.get("accuracy_mode") or "balanced",
              "VID_PIPELINE_WHISPERX_ALIGNMENT": data.get("whisperx_alignment") or False,
              "VID_PIPELINE_DIARIZATION": data.get("diarization") or False,
          }
          for key, value in mapping.items():
              text = str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"{key}={text}")
          PY

      - name: Resolve issue request
        if: github.event_name == 'issues'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python - >> "$GITHUB_ENV" <<'PY'
          import json, os
          data = json.loads(os.environ["ISSUE_BODY"])
          mapping = {
              "VIDEO_URL": data.get("media_url") or data.get("url") or "",
              "SOURCE_URL": data.get("source_url") or data.get("url") or "",
              "JOB_NAME": data.get("name") or "",
              "VIDEO_TITLE": data.get("title") or "",
              "PROGRAM_NAME": data.get("program") or "",
              "NETWORK_NAME": data.get("network") or "",
              "VIDEO_DATE": data.get("date") or "",
              "GUEST_NAME": data.get("guest") or "",
              "EDITORIAL_CONTEXT": data.get("editorial_context") or "",
              "WHISPER_MODEL": data.get("whisper_model") or "large-v3-turbo",
              "EDITORIAL_MODEL": data.get("editorial_model") or "qwen2.5:7b",
              "VID_PIPELINE_ACCURACY_MODE": data.get("accuracy_mode") or "balanced",
              "VID_PIPELINE_WHISPERX_ALIGNMENT": data.get("whisperx_alignment") or False,
              "VID_PIPELINE_DIARIZATION": data.get("diarization") or False,
          }
          for key, value in mapping.items():
              text = str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"{key}={text}")
          PY

      - name: Validate request
        run: test -n "$VIDEO_URL"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          if [[ "${VID_PIPELINE_WHISPERX_ALIGNMENT,,}" == "true" || "${VID_PIPELINE_DIARIZATION,,}" == "true" ]]; then
            pip install -e '.[advanced]'
          else
            pip install -e '.[all]'
          fi

      - name: Install and start local Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null && break
            sleep 2
          done
          curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null
          ollama pull "$EDITORIAL_MODEL"

      - name: Run complete pipeline
        id: pipeline
        shell: bash
        run: |
          set -euo pipefail
          args=(run-url "$VIDEO_URL" --output-root outputs --language fa \
            --model "$WHISPER_MODEL" --device cpu --compute-type int8 \
            --editorial-model "$EDITORIAL_MODEL" --editorial-base-url "$OLLAMA_BASE_URL")
          [[ -n "${SOURCE_URL:-}" ]] && args+=(--source-url "$SOURCE_URL")
          [[ -n "${JOB_NAME:-}" ]] && args+=(--name "$JOB_NAME")
          [[ -n "${VIDEO_TITLE:-}" ]] && args+=(--title "$VIDEO_TITLE")
          [[ -n "${PROGRAM_NAME:-}" ]] && args+=(--program "$PROGRAM_NAME")
          [[ -n "${NETWORK_NAME:-}" ]] && args+=(--network "$NETWORK_NAME")
          [[ -n "${VIDEO_DATE:-}" ]] && args+=(--date "$VIDEO_DATE")
          [[ -n "${GUEST_NAME:-}" ]] && args+=(--guest "$GUEST_NAME")
          [[ -n "${EDITORIAL_CONTEXT:-}" ]] && args+=(--editorial-context "$EDITORIAL_CONTEXT")
          vid-pipeline "${args[@]}" 2>&1 | tee pipeline.log

      - name: Publish result to main
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: |
          set -euo pipefail
          safe_name=$(printf '%s' "${JOB_NAME:-run-$GITHUB_RUN_ID}" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//')
          target="processing/${safe_name:-run-$GITHUB_RUN_ID}"
          rm -rf "$target"
          mkdir -p "$target/reports"
          job_dir=$(find outputs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1 || true)
          if [[ -n "$job_dir" ]]; then
            for item in final machine raw accuracy pre_review review human source.json result.json state.json; do
              [[ -e "$job_dir/$item" ]] && cp -R "$job_dir/$item" "$target/"
            done
          fi
          [[ -f pipeline.log ]] && cp pipeline.log "$target/reports/"
          [[ -f ollama.log ]] && cp ollama.log "$target/reports/"
          python - "$target/status.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "schema_version": 2,
              "status": os.getenv("JOB_STATUS", "unknown"),
              "pipeline_outcome": os.getenv("PIPELINE_OUTCOME", "unknown"),
              "workflow_run_id": os.getenv("GITHUB_RUN_ID", ""),
              "media_url": os.getenv("VIDEO_URL", ""),
              "source_url": os.getenv("SOURCE_URL", ""),
              "whisper_model": os.getenv("WHISPER_MODEL", ""),
              "editorial_model": os.getenv("EDITORIAL_MODEL", ""),
              "accuracy_mode": os.getenv("VID_PIPELINE_ACCURACY_MODE", "balanced"),
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$target"
          git diff --cached --quiet && exit 0
          git commit -m "Publish transcript result for ${safe_name:-run-$GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload complete package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-transcript-${{ github.run_id }}
          path: |
            outputs/**
            pipeline.log
            ollama.log
          retention-days: 30
          if-no-files-found: warn
