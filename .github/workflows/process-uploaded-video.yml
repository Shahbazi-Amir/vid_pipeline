name: Process uploaded video
run-name: Uploaded video ${{ inputs.request_id }} — attempt ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      asset_id:
        required: true
        type: string
      dispatch_id:
        required: true
        type: string
      original_name:
        required: true
        type: string
      file_size:
        required: true
        type: string
      sha256:
        required: true
        type: string
      profile:
        required: true
        default: balanced
        type: choice
        options: [fast, balanced, accurate]
      model:
        required: true
        default: small
        type: string
      language:
        required: true
        default: fa
        type: string
      no_editorial:
        required: true
        default: "true"
        type: string
      audio_profile:
        required: true
        default: safe
        type: choice
        options: [none, safe, noisy]

permissions:
  # Draft release assets require a token whose repository identity has push
  # access. Keep every other GITHUB_TOKEN permission at its implicit `none`.
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INPUT_MEDIA: /tmp/vid-pipeline-input/media
      REQUEST_ID: ${{ inputs.request_id }}
      ASSET_ID: ${{ inputs.asset_id }}
      EXPECTED_SIZE: ${{ inputs.file_size }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      PROFILE: ${{ inputs.profile }}
      MODEL: ${{ inputs.model }}
      LANGUAGE: ${{ inputs.language }}
      NO_EDITORIAL: ${{ inputs.no_editorial }}
      AUDIO_PROFILE: ${{ inputs.audio_profile }}
      EDITORIAL_MODEL: qwen3:8b
      OLLAMA_BASE_URL: http://127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Download authenticated draft release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$INPUT_MEDIA")"
          python - "$ASSET_ID" "$INPUT_MEDIA" <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          asset_id, target = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/${{ github.repository }}/releases/assets/{asset_id}",
              headers={
                  "Accept": "application/octet-stream",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  status = response.status
                  if status != 200:
                      body = response.read(4096).decode("utf-8", "replace")
                      raise RuntimeError(
                          f"GitHub asset download returned HTTP {status}; body={body!r}"
                      )
                  with open(target, "wb") as output:
                      while chunk := response.read(1024 * 1024):
                          output.write(chunk)
          except urllib.error.HTTPError as exc:
              body = exc.read(4096).decode("utf-8", "replace")
              safe_headers = {
                  key: value
                  for key, value in exc.headers.items()
                  if key.lower()
                  in {
                      "content-type",
                      "location",
                      "x-accepted-github-permissions",
                      "x-github-request-id",
                      "x-oauth-scopes",
                  }
              }
              hint = {
                  401: "The workflow token was rejected.",
                  403: "The workflow token cannot read this private draft release asset.",
                  404: "The asset is missing or hidden from the workflow token.",
              }.get(exc.code, "GitHub rejected the asset download.")
              raise SystemExit(
                  f"{hint} HTTP {exc.code}; headers={safe_headers!r}; body={body!r}"
              ) from None
          PY

      - name: Verify input size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - "$INPUT_MEDIA" "$EXPECTED_SIZE" "$EXPECTED_SHA256" <<'PY'
          import hashlib
          import os
          import sys

          path, expected_size, expected_hash = sys.argv[1:]
          if os.path.getsize(path) != int(expected_size):
              raise SystemExit("downloaded asset size mismatch")
          digest = hashlib.sha256()
          with open(path, "rb") as media:
              for chunk in iter(lambda: media.read(1024 * 1024), b""):
                  digest.update(chunk)
          if digest.hexdigest() != expected_hash:
              raise SystemExit("downloaded asset SHA-256 mismatch")
          PY

      - name: Start optional local editorial service
        if: inputs.no_editorial == 'false'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null && break
            sleep 2
          done
          curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null
          ollama pull "$EDITORIAL_MODEL"

      - name: Run complete file pipeline
        shell: bash
        run: |
          set -euo pipefail
          args=(run-file "$INPUT_MEDIA" --name "$REQUEST_ID" --output-root outputs \
            --profile "$PROFILE" --model "$MODEL" --language "$LANGUAGE" \
            --device cpu --compute-type int8 --audio-profile "$AUDIO_PROFILE")
          if [[ "${NO_EDITORIAL,,}" == "true" ]]; then
            args+=(--no-editorial)
          else
            args+=(--editorial-model "$EDITORIAL_MODEL" --editorial-base-url "$OLLAMA_BASE_URL")
          fi
          vid-pipeline "${args[@]}" 2>&1 | tee pipeline.log

      - name: Verify result belongs to request
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(outputs/"$REQUEST_ID"-*/result.json)
          if [[ ${#results[@]} -ne 1 ]]; then
            echo "Expected exactly one result.json for request $REQUEST_ID; found ${#results[@]}" >&2
            exit 1
          fi
          job_root="${results[0]%/result.json}"
          test -s "$job_root/final/transcript.final.txt"
          echo "Validated request-scoped job root: $job_root"

      - name: Upload transcript result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-transcript-${{ inputs.request_id }}
          path: |
            outputs/${{ inputs.request_id }}-*/state.json
            outputs/${{ inputs.request_id }}-*/source.json
            outputs/${{ inputs.request_id }}-*/video-info.json
            outputs/${{ inputs.request_id }}-*/result.json
            outputs/${{ inputs.request_id }}-*/audio/audio-quality.json
            outputs/${{ inputs.request_id }}-*/raw/transcript.raw.json
            outputs/${{ inputs.request_id }}-*/raw/transcript.raw.md
            outputs/${{ inputs.request_id }}-*/machine/**
            outputs/${{ inputs.request_id }}-*/final/**
            pipeline.log
          retention-days: 1
          if-no-files-found: error

      - name: Remove input and temporary media
        if: always()
        shell: bash
        run: |
          rm -f -- "$INPUT_MEDIA"
          find /tmp/vid-pipeline-input -type f -delete 2>/dev/null || true
          find outputs -type f \( -name '*.wav' -o -name '*.mp4' -o -name '*.mkv' \) -delete 2>/dev/null || true
