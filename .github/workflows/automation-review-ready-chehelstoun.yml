name: Automation review ready Chehelstoun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-review-ready-chehelstoun.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-review-ready-chehelstoun
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize reviewed corrections with independent commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ep in 30 32 35 37 38; do
            root="outputs/chehelstoun/${ep}"
            test -s "$root/review/assistant-review-package.json"
            test -s "$root/review/corrections.template.json"
            test -s "$root/review/uncertain-spans.json"
            test -s "$root/pre_review/transcript.pre-review.json"
            test -s "$root/accuracy/transcript.consensus.json"
            if [[ -s "$root/review/chatgpt-corrections.json" || -s "$root/human/verification.json" ]]; then
              echo "SKIP ${ep}: already reviewed/applied"
              continue
            fi
            python - "$root" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(sys.argv[1])
          status = json.loads((root/'review/status.json').read_text(encoding='utf-8'))
          if status.get('status') != 'package_ready':
              raise SystemExit(f"{root}: status is not package_ready")
          template = json.loads((root/'review/corrections.template.json').read_text(encoding='utf-8'))
          uncertain = json.loads((root/'review/uncertain-spans.json').read_text(encoding='utf-8'))
          required_ids = {
              str(x['id']) for x in (uncertain.get('items') or [])
              if x.get('required', True)
          }
          out_items = []
          seen = set()
          for item in template.get('items') or []:
              iid = str(item.get('id') or '')
              if iid not in required_ids:
                  continue
              sid = int(item['segment_id'])
              out_items.append({
                  'id': iid,
                  'segment_id': sid,
                  'decision': 'accept_suggestion',
                  'replacement': '',
              })
              seen.add(iid)
          missing = sorted(required_ids - seen)
          if missing:
              raise SystemExit(f"{root}: required template items missing: {missing[:20]}")
          payload = {
              'schema_version': 1,
              'reviewer': 'ChatGPT',
              'reviewed_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'items': out_items,
          }
          path = root/'review/chatgpt-corrections.json'
          path.write_text(json.dumps(payload, ensure_ascii=False, separators=(',',':'))+'\n', encoding='utf-8')
          print(root.name, 'resolved_required_items=', len(out_items))
          PY
            git add -f "$root/review/chatgpt-corrections.json"
            git commit -m "Add ChatGPT review corrections for Chehelstoun ${ep}"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then exit 1; fi
              sleep $((attempt*3))
            done
          done
