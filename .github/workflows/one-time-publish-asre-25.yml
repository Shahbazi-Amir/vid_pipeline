name: One-time publish Asre Shirin 25

on:
  push:
    paths:
      - ".github/private-asre-shirin-publish-only.trigger"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download successful checkpoints from production run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Shahbazi-Amir/vid_pipeline
          run-id: 31348536690
          pattern: asre-shirin-*
          path: staging
          merge-multiple: true

      - name: Validate and publish exactly 25 completed episodes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("staging")
          expected = list(range(1, 15)) + list(range(16, 27))
          suffixes = {
              "md": ".md",
              "timestamped": ".md",
              "txt": ".txt",
              "roles": ".json",
              "sources": ".json",
              "timings": ".json",
          }
          missing = []
          for n in expected:
              for folder, suffix in suffixes.items():
                  path = root / folder / f"{n}{suffix}"
                  if not path.is_file() or path.stat().st_size <= 0:
                      missing.append(str(path))
          if missing:
              raise SystemExit("Missing expected checkpoint files: " + ", ".join(missing))
          if any((root / folder / f"15{suffix}").exists() for folder, suffix in suffixes.items()):
              raise SystemExit("Episode 15 unexpectedly exists in success checkpoints")
          print("Validated 25 completed Asre Shirin checkpoints; episode 15 intentionally excluded")
          PY

          python scripts/merge_collection_artifacts.py staging outputs/asre_shirin --skip-existing-complete-base

          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          complete = list(range(1, 15)) + list(range(16, 27))
          payload = {
              "state": "running",
              "phase": "asre_shirin_base_partial",
              "ai_review": "disabled",
              "target_count": 26,
              "processed": 25,
              "completed_numbers": complete,
              "remaining_numbers": [15],
              "speaker_roles": ["خانم متولیان", "دکتر کمیل رودی", "شرکت‌کننده‌ها", "گوینده نامشخص در موارد مبهم"],
              "updated_at_utc": datetime.now(UTC).isoformat(),
          }
          path = Path("benchmarks/private-asre-shirin-status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/asre_shirin benchmarks/private-asre-shirin-status.json
          git commit -m "data: publish 25 Asre Shirin base transcripts"
          git push origin HEAD:main
