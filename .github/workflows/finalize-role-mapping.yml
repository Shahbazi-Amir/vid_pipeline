name: Finalize host-teacher role mapping

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/finalize-role-mapping.trigger"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply conservative role mapper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/vid_pipeline/diarization.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def map_roles(')
          end = text.index('\n\ndef apply_roles', start)
          new = r'''def _median(values: list[float]) -> float:
              ordered = sorted(values)
              if not ordered:
                  return 0.0
              middle = len(ordered) // 2
              if len(ordered) % 2:
                  return float(ordered[middle])
              return float((ordered[middle - 1] + ordered[middle]) / 2)


          def _role_features(segments: list[dict[str, Any]], speaker: str) -> dict[str, Any]:
              items = [row for row in segments if str(row.get("speaker") or "") == speaker]
              word_counts = [
                  int(row.get("aligned_word_count") or len(str(row.get("text") or "").split()))
                  for row in items
              ]
              durations = [
                  max(0.0, float(row.get("end", 0.0)) - float(row.get("start", 0.0)))
                  for row in items
              ]
              # Deliberately exclude weak discourse words such as "یعنی". They are
              # common in explanations and previously caused teacher/host inversion.
              question_markers = (
                  "؟", "?", "چرا", "چطور", "چگونه", "آیا", "چی", "چه ",
                  "می شود", "می‌شود", "ممکن است",
              )
              question_count = sum(
                  any(marker in str(row.get("text") or "") for marker in question_markers)
                  for row in items
              )
              count = max(1, len(items))
              total_words = sum(word_counts)
              total_duration = sum(durations)
              return {
                  "utterance_count": len(items),
                  "question_count": question_count,
                  "question_fraction": question_count / count,
                  "mean_words": total_words / count,
                  "median_words": _median([float(value) for value in word_counts]),
                  "mean_duration": total_duration / count,
                  "median_duration": _median(durations),
                  "short_turn_fraction": sum(
                      words <= 12 or duration <= 6.0
                      for words, duration in zip(word_counts, durations)
                  ) / count,
                  "long_turn_fraction": sum(
                      words >= 40 or duration >= 18.0
                      for words, duration in zip(word_counts, durations)
                  ) / count,
                  "total_words": total_words,
                  "total_duration": total_duration,
              }


          def _relative_advantage(preferred: float, other: float) -> float:
              scale = max(abs(preferred), abs(other), 1e-9)
              return (preferred - other) / scale


          def map_roles_with_diagnostics(
              segments: list[dict[str, Any]],
              mode: str,
              overrides: dict[str, str] | None = None,
              threshold: float = 0.72,
          ) -> tuple[dict[str, dict[str, Any]], dict[str, Any]]:
              speakers = sorted({str(s.get("speaker")) for s in segments if s.get("speaker")})
              mapping = {
                  speaker: {"role": "", "confidence": 0.0, "source": "unresolved"}
                  for speaker in speakers
              }
              aliases = {"host": "مجری", "teacher": "استاد", "مجری": "مجری", "استاد": "استاد"}
              features = {speaker: _role_features(segments, speaker) for speaker in speakers}
              diagnostics: dict[str, Any] = {
                  "mode": mode,
                  "status": "unresolved",
                  "source": "none",
                  "confidence": 0.0,
                  "threshold": threshold,
                  "features": features,
                  "host_score_margin": 0.0,
              }

              for speaker, role in (overrides or {}).items():
                  if speaker in mapping:
                      mapped = aliases.get(role, role)
                      mapping[speaker] = {
                          "role": mapped,
                          "confidence": 1.0,
                          "source": "manual",
                      }

              manual = [speaker for speaker in speakers if mapping[speaker]["role"]]
              if manual:
                  if mode == "host-teacher" and len(speakers) == 2 and len(manual) == 1:
                      other = next(speaker for speaker in speakers if speaker not in manual)
                      complement = "استاد" if mapping[manual[0]]["role"] == "مجری" else "مجری"
                      mapping[other] = {
                          "role": complement,
                          "confidence": 1.0,
                          "source": "manual-complement",
                      }
                  diagnostics.update({
                      "status": "resolved_manual",
                      "source": "manual",
                      "confidence": 1.0,
                  })
                  return mapping, diagnostics

              if mode != "host-teacher":
                  diagnostics["status"] = "unresolved_mode"
                  return mapping, diagnostics
              if len(speakers) != 2:
                  diagnostics["status"] = "unresolved_speaker_count"
                  return mapping, diagnostics

              left, right = speakers
              a, b = features[left], features[right]
              # Positive margin means LEFT looks more like the host. The weighting
              # intentionally makes question tendency only one signal: teachers can
              # use rhetorical questions, while hosts are usually briefer and account
              # for less explanatory airtime overall.
              margin = (
                  0.10 * (a["question_fraction"] - b["question_fraction"])
                  + 0.20 * (a["short_turn_fraction"] - b["short_turn_fraction"])
                  + 0.20 * _relative_advantage(b["mean_words"], a["mean_words"])
                  + 0.20 * _relative_advantage(b["mean_duration"], a["mean_duration"])
                  + 0.10 * (b["long_turn_fraction"] - a["long_turn_fraction"])
                  + 0.10 * _relative_advantage(b["total_words"], a["total_words"])
                  + 0.10 * _relative_advantage(b["total_duration"], a["total_duration"])
              )
              host = left if margin >= 0 else right
              teacher = right if host == left else left
              separation = abs(margin)
              confidence = min(0.95, 0.5 + separation * 1.8)
              features[left]["host_score"] = round(0.5 + margin / 2, 6)
              features[right]["host_score"] = round(0.5 - margin / 2, 6)
              features[left]["teacher_score"] = round(1.0 - features[left]["host_score"], 6)
              features[right]["teacher_score"] = round(1.0 - features[right]["host_score"], 6)
              diagnostics.update({
                  "confidence": round(confidence, 3),
                  "host_score_margin": round(separation, 6),
              })
              if confidence < threshold:
                  diagnostics.update({
                      "status": "unresolved_low_confidence",
                      "source": "heuristic-v2",
                  })
                  return mapping, diagnostics

              mapping[host] = {
                  "role": "مجری",
                  "confidence": round(confidence, 3),
                  "source": "heuristic-v2",
              }
              mapping[teacher] = {
                  "role": "استاد",
                  "confidence": round(confidence, 3),
                  "source": "heuristic-v2",
              }
              diagnostics.update({
                  "status": "resolved_heuristic",
                  "source": "heuristic-v2",
                  "host_speaker": host,
                  "teacher_speaker": teacher,
              })
              return mapping, diagnostics


          def map_roles(
              segments: list[dict[str, Any]],
              mode: str,
              overrides: dict[str, str] | None = None,
              threshold: float = 0.72,
          ) -> dict[str, dict[str, Any]]:
              mapping, _ = map_roles_with_diagnostics(segments, mode, overrides, threshold)
              return mapping
          '''
          # Normalize indentation introduced by the raw workflow string.
          lines = new.splitlines()
          normalized = []
          for line in lines:
              normalized.append(line[10:] if line.startswith('          ') else line)
          text = text[:start] + '\n'.join(normalized) + text[end:]

          old = '''    mapping = map_roles(\n        aligned,\n        config.role_mode if len(aligned_effective) >= 2 else "generic",\n        config.role_overrides,\n        config.role_threshold,\n    )\n    apply_roles(aligned, mapping)\n'''
          new_call = '''    role_mode = config.role_mode if len(aligned_effective) >= 2 else "generic"\n    mapping, role_diagnostics = map_roles_with_diagnostics(\n        aligned,\n        role_mode,\n        config.role_overrides,\n        config.role_threshold,\n    )\n    apply_roles(aligned, mapping)\n'''
          if old not in text:
              raise SystemExit('role mapping call anchor not found')
          text = text.replace(old, new_call, 1)

          old_report = '''        "role_mapping": mapping, "runtime_seconds": round(time.monotonic() - started, 3),\n'''
          new_report = '''        "role_mapping": mapping,\n        "role_mapping_mode": role_mode,\n        "role_mapping_status": role_diagnostics["status"],\n        "role_mapping_features": role_diagnostics["features"],\n        "role_mapping_confidence": role_diagnostics["confidence"],\n        "role_mapping_source": role_diagnostics["source"],\n        "role_mapping_diagnostics": role_diagnostics,\n        "runtime_seconds": round(time.monotonic() - started, 3),\n'''
          if old_report not in text:
              raise SystemExit('role report anchor not found')
          text = text.replace(old_report, new_report, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_diarization.py')
          t = tests.read_text(encoding='utf-8')
          if 'map_roles_with_diagnostics,' not in t:
              if '    map_roles,\n' not in t:
                  raise SystemExit('test import anchor not found')
              t = t.replace('    map_roles,\n', '    map_roles,\n    map_roles_with_diagnostics,\n', 1)
          addition = r'''

          def _role_row(speaker: str, start: float, duration: float, text: str) -> dict[str, object]:
              return {
                  "speaker": speaker,
                  "start": start,
                  "end": start + duration,
                  "text": text,
                  "aligned_word_count": len(text.split()),
              }


          def test_role_mapping_clear_interview_pattern():
              rows = [
                  _role_row("SPEAKER_00", 0, 3, "آیا این موضوع روشن است؟"),
                  _role_row("SPEAKER_00", 20, 4, "چطور باید شروع کنیم؟"),
                  _role_row("SPEAKER_00", 50, 3, "چه نکته ای مهم است؟"),
                  _role_row("SPEAKER_00", 80, 4, "پس قدم بعدی چیست؟"),
                  _role_row("SPEAKER_01", 4, 16, " ".join(["توضیح"] * 48)),
                  _role_row("SPEAKER_01", 24, 26, " ".join(["پاسخ"] * 75)),
                  _role_row("SPEAKER_01", 53, 27, " ".join(["شرح"] * 82)),
                  _role_row("SPEAKER_01", 84, 30, " ".join(["تحلیل"] * 90)),
              ]
              mapping, diagnostics = map_roles_with_diagnostics(rows, "host-teacher")
              assert mapping["SPEAKER_00"]["role"] == "مجری"
              assert mapping["SPEAKER_01"]["role"] == "استاد"
              assert diagnostics["status"] == "resolved_heuristic"
              assert diagnostics["confidence"] >= 0.72


          def test_role_mapping_ambiguous_conversation_stays_unresolved():
              rows = [
                  _role_row("SPEAKER_00", 0, 10, "یک گفتگوی عادی با چند واژه مشابه"),
                  _role_row("SPEAKER_01", 10, 10, "یک گفتگوی عادی با چند واژه مشابه"),
                  _role_row("SPEAKER_00", 20, 10, "ادامه گفتگو بدون الگوی نقش مشخص"),
                  _role_row("SPEAKER_01", 30, 10, "ادامه گفتگو بدون الگوی نقش مشخص"),
              ]
              mapping, diagnostics = map_roles_with_diagnostics(rows, "host-teacher")
              assert not mapping["SPEAKER_00"]["role"]
              assert not mapping["SPEAKER_01"]["role"]
              assert diagnostics["status"] == "unresolved_low_confidence"


          def test_role_mapping_manual_override_wins_and_completes_pair():
              rows = [
                  _role_row("SPEAKER_00", 0, 30, " ".join(["شرح"] * 80)),
                  _role_row("SPEAKER_01", 30, 3, "آیا درست است؟"),
              ]
              mapping, diagnostics = map_roles_with_diagnostics(
                  rows, "host-teacher", {"SPEAKER_00": "host"}
              )
              assert mapping["SPEAKER_00"] == {
                  "role": "مجری", "confidence": 1.0, "source": "manual"
              }
              assert mapping["SPEAKER_01"]["role"] == "استاد"
              assert mapping["SPEAKER_01"]["source"] == "manual-complement"
              assert diagnostics["status"] == "resolved_manual"


          def test_role_mapping_does_not_treat_yani_as_question_signal():
              rows = [
                  _role_row("SPEAKER_00", 0, 4, "چطور این کار را انجام بدهیم؟"),
                  _role_row("SPEAKER_00", 40, 4, "آیا نکته دیگری هست؟"),
                  _role_row("SPEAKER_01", 4, 36, " ".join(["یعنی"] + ["توضیح"] * 80)),
                  _role_row("SPEAKER_01", 44, 40, " ".join(["یعنی"] + ["شرح"] * 90)),
              ]
              mapping, diagnostics = map_roles_with_diagnostics(rows, "host-teacher")
              assert mapping["SPEAKER_00"]["role"] == "مجری"
              assert mapping["SPEAKER_01"]["role"] == "استاد"
              assert diagnostics["features"]["SPEAKER_01"]["question_count"] == 0


          @pytest.mark.parametrize("speaker_count", [1, 3])
          def test_role_mapping_requires_exactly_two_speakers(speaker_count):
              rows = [
                  _role_row(f"SPEAKER_{index:02d}", index * 10, 5, "متن نمونه")
                  for index in range(speaker_count)
              ]
              mapping, diagnostics = map_roles_with_diagnostics(rows, "host-teacher")
              assert all(not item["role"] for item in mapping.values())
              assert diagnostics["status"] == "unresolved_speaker_count"
          '''
          if 'test_role_mapping_clear_interview_pattern' not in t:
              lines = addition.splitlines()
              normalized = [line[10:] if line.startswith('          ') else line for line in lines]
              t += '\n'.join(normalized) + '\n'
          tests.write_text(t, encoding='utf-8')
          PY

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization]'
          pytest -q
          ruff check .
          python -m compileall -q src tests
          git diff --check

      - name: Commit validated role mapper and remove marker
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/finalize-role-mapping.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vid_pipeline/diarization.py tests/test_diarization.py .github/bootstrap/finalize-role-mapping.trigger
          git commit -m "fix: make host-teacher role mapping conservative"
          git push origin HEAD:main
