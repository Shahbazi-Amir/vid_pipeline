name: Render ChatGPT review derivatives

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-chatgpt-review.yml"
      - "outputs/*/review/timestamped/*.md"

permissions:
  contents: write

concurrency:
  group: render-chatgpt-review
  cancel-in-progress: false

jobs:
  render-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local review CLI
        run: python -m pip install -e .

      - name: Render incomplete reviewed transcripts locally
        id: render
        shell: bash
        run: |
          set -euo pipefail
          unset VID_PIPELINE_REVIEW_API_KEY VID_PIPELINE_REVIEW_BASE_URL VID_PIPELINE_REVIEW_MODEL
          export AI_REVIEW_ENABLED=false

          changed=false
          while IFS=$'\t' read -r collection number; do
            [[ -n "$collection" && -n "$number" ]] || continue
            echo "Rendering local derivatives for $collection review $number"
            vid-review ai-collection "$collection" "$number"
            changed=true
          done < <(python - <<'PY'
          from pathlib import Path

          for timed in sorted(Path("outputs").glob("*/review/timestamped/*.md")):
              collection = timed.parents[2]
              number = timed.stem
              if not number.isdigit() or not timed.stat().st_size:
                  continue
              md = collection / "review" / "md" / f"{number}.md"
              txt = collection / "review" / "txt" / f"{number}.txt"
              if not md.is_file() or not md.stat().st_size or not txt.is_file() or not txt.stat().st_size:
                  print(f"{collection}\t{number}")
          PY
          )

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit rendered Markdown and text
        if: steps.render.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'outputs/*/review/md/*.md' 'outputs/*/review/txt/*.txt'
          git commit -m "review: render pending ChatGPT derivatives" || exit 0
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
