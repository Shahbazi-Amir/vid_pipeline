name: Publish semantic ChatGPT review payload

on:
  push:
    paths:
      - '.semantic_review_payload/**/*.b64'

permissions:
  contents: write

concurrency:
  group: publish-semantic-review-payload
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode, validate, and stage semantic reviews
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          payloads=(.semantic_review_payload/*/*.b64)
          ((${#payloads[@]} > 0)) || { echo 'no payloads'; exit 1; }
          for payload in "${payloads[@]}"; do
            collection="$(basename "$(dirname "$payload")")"
            episode="$(basename "$payload" .b64)"
            case "$collection" in
              asre_shirin) out="outputs/asre_shirin/review" ;;
              khane_to) out="outputs/khane_to/review" ;;
              dar_jostojo_dar_again_raw) out="outputs/dar_jostojo_dar_again_raw/review" ;;
              *) echo "unsupported collection: $collection"; exit 1 ;;
            esac
            work="/tmp/review-$collection-$episode"
            rm -rf "$work" && mkdir -p "$work"
            base64 -d "$payload" > "$work/payload.tar.gz"
            tar -xzf "$work/payload.tar.gz" -C "$work"
            test -s "$work/timestamped/$episode.md"
            test -s "$work/md/$episode.md"
            test -s "$work/txt/$episode.txt"
            python - "$work/timestamped/$episode.md" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          times=re.findall(r'^\[(\d\d:\d\d:\d\d → \d\d:\d\d:\d\d)\]',s,re.M)
          assert times, 'no timestamp blocks'
          assert 'گوینده نامشخص' not in s
          print(p, 'timestamp blocks', len(times))
          PY
            mkdir -p "$out/timestamped" "$out/md" "$out/txt"
            cp "$work/timestamped/$episode.md" "$out/timestamped/$episode.md"
            cp "$work/md/$episode.md" "$out/md/$episode.md"
            cp "$work/txt/$episode.txt" "$out/txt/$episode.txt"
            rm -f "$payload"
          done
      - name: Commit semantic review checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'review: publish semantic ChatGPT review checkpoint'
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
