name: Process video URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: Video page or direct media URL
        required: true
        type: string
      source_url:
        description: Optional public source page shown in the final file
        required: false
        type: string
      name:
        description: Optional job name
        required: false
        type: string
      title:
        description: Optional Persian title
        required: false
        type: string
      program:
        description: Optional program name
        required: false
        type: string
      network:
        description: Optional network or publisher
        required: false
        type: string
      date:
        description: Optional publication date
        required: false
        type: string
      guest:
        description: Optional guest name
        required: false
        type: string
      editorial_context:
        description: Topic and important names for the local editor
        required: false
        type: string
      whisper_model:
        description: faster-whisper model
        required: true
        default: large-v3-turbo
        type: string
      editorial_model:
        description: Local Ollama model
        required: true
        default: qwen2.5:7b
        type: string
  push:
    paths:
      - 'runs/*.request.json'

permissions:
  contents: read

concurrency:
  group: video-transcript-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIDEO_URL: ${{ inputs.url }}
      SOURCE_URL: ${{ inputs.source_url }}
      JOB_NAME: ${{ inputs.name }}
      VIDEO_TITLE: ${{ inputs.title }}
      PROGRAM_NAME: ${{ inputs.program }}
      NETWORK_NAME: ${{ inputs.network }}
      VIDEO_DATE: ${{ inputs.date }}
      GUEST_NAME: ${{ inputs.guest }}
      EDITORIAL_CONTEXT: ${{ inputs.editorial_context }}
      WHISPER_MODEL: ${{ inputs.whisper_model || 'large-v3-turbo' }}
      EDITORIAL_MODEL: ${{ inputs.editorial_model || 'qwen2.5:7b' }}
      OLLAMA_BASE_URL: http://127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request file
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          request_file=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep '^runs/.*\.request\.json$' \
            | tail -n 1)
          test -n "$request_file"
          python - "$request_file" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          mapping = {
              "VIDEO_URL": data.get("media_url") or data.get("url") or "",
              "SOURCE_URL": data.get("source_url") or data.get("url") or "",
              "JOB_NAME": data.get("name") or "",
              "VIDEO_TITLE": data.get("title") or "",
              "PROGRAM_NAME": data.get("program") or "",
              "NETWORK_NAME": data.get("network") or "",
              "VIDEO_DATE": data.get("date") or "",
              "GUEST_NAME": data.get("guest") or "",
              "EDITORIAL_CONTEXT": data.get("editorial_context") or "",
              "WHISPER_MODEL": data.get("whisper_model") or "large-v3-turbo",
              "EDITORIAL_MODEL": data.get("editorial_model") or "qwen2.5:7b",
          }
          for key, value in mapping.items():
              text = str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"{key}={text}")
          PY

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIDEO_URL"
          echo "Video source resolved."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -e '.[all]'
          ffmpeg -version

      - name: Install and start local Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null
          ollama pull "$EDITORIAL_MODEL"

      - name: Run complete local URL-to-reviewed-transcript pipeline
        shell: bash
        run: |
          set -euo pipefail
          args=(
            run-url "$VIDEO_URL"
            --output-root outputs
            --language fa
            --model "$WHISPER_MODEL"
            --device cpu
            --compute-type int8
            --editorial-model "$EDITORIAL_MODEL"
            --editorial-base-url "$OLLAMA_BASE_URL"
          )
          if [[ -n "${SOURCE_URL:-}" ]]; then args+=(--source-url "$SOURCE_URL"); fi
          if [[ -n "${JOB_NAME:-}" ]]; then args+=(--name "$JOB_NAME"); fi
          if [[ -n "${VIDEO_TITLE:-}" ]]; then args+=(--title "$VIDEO_TITLE"); fi
          if [[ -n "${PROGRAM_NAME:-}" ]]; then args+=(--program "$PROGRAM_NAME"); fi
          if [[ -n "${NETWORK_NAME:-}" ]]; then args+=(--network "$NETWORK_NAME"); fi
          if [[ -n "${VIDEO_DATE:-}" ]]; then args+=(--date "$VIDEO_DATE"); fi
          if [[ -n "${GUEST_NAME:-}" ]]; then args+=(--guest "$GUEST_NAME"); fi
          if [[ -n "${EDITORIAL_CONTEXT:-}" ]]; then
            args+=(--editorial-context "$EDITORIAL_CONTEXT")
          fi
          vid-pipeline "${args[@]}" 2>&1 | tee pipeline.log

      - name: Upload reviewed transcript package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-transcript-${{ github.run_id }}
          path: |
            outputs/**
            pipeline.log
            ollama.log
          retention-days: 30
          if-no-files-found: warn
