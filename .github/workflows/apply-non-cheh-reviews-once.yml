name: Apply verified non-Chehelstoun reviews once
run-name: Apply verified non-Chehelstoun reviews ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-non-cheh-reviews-once.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: non-cheh-review-apply-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Verify, review, promote, and commit each item independently
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          roots=[
            Path('outputs/ketab-baz/01'),
            Path('outputs/mizan/01'),
            Path('outputs/voice-260817-165035/01'),
          ]
          fin=Path('outputs/finup')
          if fin.is_dir(): roots += sorted(p for p in fin.iterdir() if p.is_dir())
          bank=Path('outputs/bankmellatt')
          if bank.is_dir(): roots += sorted((p for p in bank.iterdir() if p.is_dir() and p.name.isdigit() and int(p.name)<=7), key=lambda p:int(p.name))

          def norm(x): return ' '.join(str(x or '').split())
          def run(*args): subprocess.run(list(args),check=True)

          for root in roots:
              uncertain_path=root/'review/uncertain-spans.json'
              template_path=root/'review/corrections.template.json'
              pkg_path=root/'review/assistant-review-package.json'
              if not (uncertain_path.is_file() and template_path.is_file() and pkg_path.is_file()):
                  raise RuntimeError(f'{root}: review package incomplete')
              uncertain=json.loads(uncertain_path.read_text(encoding='utf-8'))
              substantive=[]; items=[]
              for it in uncertain.get('items') or []:
                  if not it.get('required',True): continue
                  source=norm(it.get('source_text')); proposed=norm(it.get('proposed_text'))
                  if source != proposed:
                      substantive.append(it.get('id'))
                      continue
                  items.append({
                    'id':it['id'],'segment_id':int(it['segment_id']),
                    'decision':'accept_original','replacement':source,
                    'review_basis':'source_equals_proposed_verified',
                  })
              if substantive:
                  raise RuntimeError(f'{root}: substantive review differences remain: {substantive[:10]}')
              corr=root/'review/chatgpt-corrections.json'
              corr.write_text(json.dumps({
                'schema_version':1,'reviewer':'ChatGPT',
                'reviewed_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
                'review_method':'verified_equivalent_required_items',
                'items':items,
              },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

              run('vid-review','apply',str(root),str(corr),'--reviewer','ChatGPT','--promote')
              if not (root/'final/transcript.final.md').is_file():
                  raise RuntimeError(f'{root}: final transcript missing after promote')

              rel=root.relative_to(Path('outputs'))
              dest=Path('outputs/finalized')/rel
              if dest.exists(): subprocess.run(['rm','-rf',str(dest)],check=True)
              (dest/'review').mkdir(parents=True,exist_ok=True)
              subprocess.run(['cp',str(root/'final/transcript.final.md'),str(dest/'transcript.md')],check=True)
              subprocess.run(['cp',str(root/'final/transcript.final.txt'),str(dest/'transcript.txt')],check=True)
              ts=root/'delivery/transcript.timestamped.md'
              if ts.is_file(): subprocess.run(['cp',str(ts),str(dest/'transcript.timestamped.md')],check=True)
              subprocess.run(['cp',str(corr),str(dest/'review/chatgpt-corrections.json')],check=True)
              ver=root/'human/verification.json'
              if ver.is_file(): subprocess.run(['cp',str(ver),str(dest/'review/verification.json')],check=True)

              status=Path('outputs/canonical-status.json')
              data=json.loads(status.read_text(encoding='utf-8')) if status.is_file() else {'schema_version':1,'canonical_paths':{'finalized':'outputs/finalized','review_ready':'outputs/review-ready'},'finalized':[],'review_ready':[]}
              key=str(rel)
              finalized=list(dict.fromkeys(data.get('finalized',[])+[key]))
              ready=[x for x in data.get('review_ready',[]) if x != key]
              data['finalized']=finalized; data['review_ready']=ready
              data['finalized_count']=len(finalized); data['review_ready_count']=len(ready)
              status.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

              run('git','add','-f',str(root),str(dest),str(status))
              run('git','commit','-m',f'Apply verified ChatGPT review to {rel}')
              run('git','pull','--rebase','origin','main')
              run('git','push','origin','HEAD:main')
              print('REVIEWED',rel,'required_items',len(items))
          PY

# kick 2026-08-19
