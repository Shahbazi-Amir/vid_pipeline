name: Commit pyannote-only cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/commit-pyannote-only-cleanup.trigger"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Rebuild tested pyannote-only tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import subprocess

          historical = subprocess.check_output(
              [
                  "git", "show",
                  "5fc8b1619bba29e24f41db5a7d18deef47d6c391:.github/workflows/cleanup-legacy-diarizer-v5.yml",
              ],
              text=True,
          )
          begin = historical.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          finish = historical.index("\n          PY\n\n      - name: Compile transformed sources", begin)
          raw = historical[begin:finish]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          ) + "\n"
          old = 'str(getattr(backend, "model_id"))'
          new = 'str(backend.model_id)'
          if old not in script:
              raise SystemExit("ruff correction anchor missing")
          script = script.replace(old, new, 1)
          exec(compile(script, "pyannote-only-transform", "exec"), {"__name__": "__main__"})
          PY

      - name: Validate tested tree
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization-pyannote]'
          pytest -q
          ruff check .
          python -m compileall -q src tests scripts
          git diff --check

      - name: Stage workflow snapshots and commit non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/workflow-snapshots
          cp .github/workflows/process-video.yml validation/workflow-snapshots/process-video.yml
          cp .github/workflows/pyannote-core-validation.yml validation/workflow-snapshots/pyannote-core-validation.yml
          cp .github/workflows/pyannote-live-validation.yml validation/workflow-snapshots/pyannote-live-validation.yml

          git checkout "$GITHUB_SHA" -- \
            .github/workflows/process-video.yml \
            .github/workflows/pyannote-core-validation.yml \
            .github/workflows/pyannote-live-validation.yml

          rm -f .github/bootstrap/commit-pyannote-only-cleanup.trigger
          rm -f .github/workflows/commit-pyannote-only-cleanup.yml
          rm -f validation/sherpa-removal-inventory.txt
          rm -f validation/cleanup-run-probe.json
          rm -f validation/cleanup-v2-run-probe.json
          rm -f validation/cleanup-v3-run-probe.json
          rm -f validation/cleanup-v4-run-probe.json
          rm -f validation/cleanup-v5-run-probe.json
          rm -f validation/cleanup-v6-run-probe.json
          rm -f validation/diarization-backend-cleanup.json
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove retired diarization implementation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
