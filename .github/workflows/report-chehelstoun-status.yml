name: Report Chehelstoun archive status

on:
  workflow_run:
    workflows: ["Build Chehelstoun audio release"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Publish status to issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STATUS: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="Chehelstoun archive build report"
          body=$(cat <<EOF
          Automated Chehelstoun archive build finished.

          - status: ${RUN_STATUS}
          - run_id: ${RUN_ID}
          - commit: ${HEAD_SHA}
          - run: ${RUN_URL}
          - expected release tag: chehelstoun-archive-v1
          EOF
          )
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Chehelstoun archive build report") | .number' | head -n1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
