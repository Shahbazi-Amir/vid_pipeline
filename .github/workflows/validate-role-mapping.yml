name: Validate role mapping

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/validate-role-mapping.trigger"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization]'

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check .
          python -m compileall -q src tests
          git diff --check

      - name: Record success and clean marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          printf '%s\n' '{"status":"success","pytest":"pass","ruff":"pass","compileall":"pass","diff_check":"pass"}' > validation/role-mapping-validation.json
          rm -f .github/bootstrap/validate-role-mapping.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/role-mapping-validation.json .github/bootstrap/validate-role-mapping.trigger
          git commit -m "test: validate conservative role mapping"
          git push origin HEAD:main
