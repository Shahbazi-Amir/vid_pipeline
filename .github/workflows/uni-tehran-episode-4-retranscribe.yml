name: Retranscribe University of Tehran episode 4
run-name: University of Tehran episode 4 isolated retranscription

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/uni-tehran-episode-4-retranscribe.yml"

permissions:
  contents: read

concurrency:
  group: uni-tehran-episode-4-retranscribe
  cancel-in-progress: false

env:
  SOURCE_URL: https://github.com/Shahbazi-Amir/vid_pipeline/releases/download/archive%2Ftest-khamenei-59617-full-20260730/4-.mp4
  SOURCE_SHA256: 295fe78d60e29b57f3541a19cbf499d24bed4d67cc6c7ab0f0861899f7f1dcbf
  VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
  VID_PIPELINE_DIARIZATION_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/diarization
  VID_PIPELINE_DIARIZATION_BACKEND: pyannote-community-1

jobs:
  retranscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      VID_PIPELINE_PYANNOTE_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/asre-shirin-cpu.txt

      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: pyannote-${{ runner.os }}-py311-${{ hashFiles('pyproject.toml', 'constraints/asre-shirin-cpu.txt') }}-community-1-v2

      - uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'constraints/asre-shirin-cpu.txt') }}-large-v3-turbo-ct2-v2

      - name: Install CPU worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchaudio==2.8.0 torchcodec==0.7.0
          pip install -c constraints/asre-shirin-cpu.txt -e '.[asre-shirin-cpu]'

      - name: Download and verify source media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p isolated-work episode-4/base
          curl --fail --location --retry 3 --output isolated-work/4-.mp4 "$SOURCE_URL"
          echo "$SOURCE_SHA256  isolated-work/4-.mp4" | sha256sum --check -
          ffprobe -v error -show_entries format=duration,size,format_name -of json isolated-work/4-.mp4 > episode-4/source-media.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("episode-4/source-media.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["source_url"] = "https://github.com/Shahbazi-Amir/vid_pipeline/releases/download/archive%2Ftest-khamenei-59617-full-20260730/4-.mp4"
          data["sha256"] = "295fe78d60e29b57f3541a19cbf499d24bed4d67cc6c7ab0f0861899f7f1dcbf"
          data["target_collection"] = "uni_tehran"
          data["episode"] = 4
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Run isolated ASR and diarization
        shell: bash
        run: |
          set -euo pipefail
          timeout --verbose --signal=TERM --kill-after=2m 180m \
            vid-pipeline run-file isolated-work/4-.mp4 \
              --source-url "$SOURCE_URL" \
              --output-root isolated-output \
              --name uni-tehran-4-retranscription \
              --title "دانشگاه تهران — قسمت ۴" \
              --program "دانشگاه تهران" \
              --profile balanced \
              --model large-v3-turbo \
              --language fa \
              --device cpu \
              --compute-type int8 \
              --no-editorial \
              --diarize \
              --num-speakers 2 \
              --speaker-role-mode host-teacher \
              --diarization-required

      - name: Collect and validate transcript outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          from pathlib import Path
          root = Path("isolated-output")
          targets = {
              "transcript.md": Path("episode-4/base/4.md"),
              "transcript.timestamped.md": Path("episode-4/base/4.timestamped.md"),
              "transcript.txt": Path("episode-4/base/4.txt"),
          }
          for source_name, target in targets.items():
              matches = list(root.glob(f"**/delivery/{source_name}"))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one {source_name}; found {len(matches)}")
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(matches[0], target)
              if target.stat().st_size == 0:
                  raise SystemExit(f"Empty output: {target}")
          PY
          python scripts/verify_collection.py episode-4 --numbers 4 --base-only || true
          test -s episode-4/base/4.md
          test -s episode-4/base/4.timestamped.md
          test -s episode-4/base/4.txt

      - name: Upload isolated result
        uses: actions/upload-artifact@v4
        with:
          name: uni-tehran-episode-4-retranscription
          path: |
            episode-4/**
            isolated-output/**
          retention-days: 14
          if-no-files-found: error

      - name: Remove source media
        if: always()
        shell: bash
        run: rm -rf isolated-work
