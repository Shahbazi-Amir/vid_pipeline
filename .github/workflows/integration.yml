name: Online integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  online-end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Upload, job, mock worker, render and download
        run: pytest -q tests/test_online_pipeline.py
