name: Probe Pyannote Live Status

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/probe-pyannote-live-status.trigger"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe pyannote workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p validation
          for workflow in pyannote-live-validation.yml apply-pyannote-production.yml; do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${workflow}/runs?event=push&branch=main&per_page=5" \
              > "/tmp/${workflow}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          fields = ('id','status','conclusion','head_sha','created_at','updated_at','html_url','run_attempt','display_title')
          def read(name):
              data = json.loads(Path('/tmp/' + name + '.json').read_text())
              runs = data.get('workflow_runs') or []
              return [{k: run.get(k) for k in fields} for run in runs]
          payload = {
              'live_runs': read('pyannote-live-validation.yml'),
              'production_apply_runs': read('apply-pyannote-production.yml'),
          }
          Path('validation/pyannote-live-status.json').write_text(
              json.dumps(payload, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, indent=2))
          PY
      - name: Commit probe and cleanup marker
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/probe-pyannote-live-status.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pyannote-live-status.json .github/bootstrap/probe-pyannote-live-status.trigger
          git commit -m "test: record pyannote live status" || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
