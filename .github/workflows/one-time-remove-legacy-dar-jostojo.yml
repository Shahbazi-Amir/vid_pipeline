name: Remove legacy dar_jostojo output

on:
  push:
    paths:
      - ".github/remove-legacy-dar-jostojo.trigger"

permissions:
  contents: write

concurrency:
  group: remove-legacy-dar-jostojo
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove legacy output folder and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf outputs/dar_jostojo
          git add -A outputs/dar_jostojo
          if git diff --cached --quiet; then
            echo "outputs/dar_jostojo already absent"
            exit 0
          fi
          git commit -m "chore: remove legacy dar_jostojo outputs"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          exit 1
