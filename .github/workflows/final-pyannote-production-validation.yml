name: Final pyannote production validation

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/final-pyannote-production-validation.trigger"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization-pyannote]'

      - name: Validate final production tree
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check .
          python -m compileall -q src tests
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/process-uploaded-video.yml').read_text(encoding='utf-8')
          required = [
              'VID_PIPELINE_DIARIZATION_BACKEND: pyannote-community-1',
              "pip install -e '.[worker,diarization-pyannote]'",
              'VID_PIPELINE_PYANNOTE_TOKEN: ${{ secrets.HF_TOKEN }}',
              'HF_TOKEN: ""',
              'HUGGING_FACE_HUB_TOKEN: ""',
              'Cache project-controlled ASR model',
              "test \"$(find transcript-artifact -maxdepth 1 -type f | wc -l)\" -eq 3",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing production wiring: {missing}')
          PY

      - name: Record success and self-clean
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          printf '%s\n' '{"status":"success","pytest":"pass","ruff":"pass","compileall":"pass","diff_check":"pass","production_wiring":"pass"}' > validation/final-pyannote-production-validation.json
          rm -f .github/bootstrap/final-pyannote-production-validation.trigger
          rm -f .github/workflows/final-pyannote-production-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A validation/final-pyannote-production-validation.json \
            .github/bootstrap/final-pyannote-production-validation.trigger \
            .github/workflows/final-pyannote-production-validation.yml
          git commit -m "test: validate final pyannote production tree"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Record failure and self-clean
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          printf '%s\n' '{"status":"failure"}' > validation/final-pyannote-production-validation.json
          rm -f .github/bootstrap/final-pyannote-production-validation.trigger
          rm -f .github/workflows/final-pyannote-production-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A validation/final-pyannote-production-validation.json \
            .github/bootstrap/final-pyannote-production-validation.trigger \
            .github/workflows/final-pyannote-production-validation.yml
          git commit -m "test: record final pyannote production validation failure"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
