name: Flush semantic review chunks v2
on:
  push:
    paths:
      - '.github/flush-semantic-chunks-v2.trigger'
permissions:
  contents: write
  statuses: write
jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"pending\",\"context\":\"review/semantic-chunk-flush-v2\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reassemble and validate semantic review packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(.semantic_review_chunks/*/*)
          ((${#dirs[@]} > 0)) || { echo no-chunks; exit 1; }
          processed=0
          for dir in "${dirs[@]}"; do
            test -d "$dir" || continue
            collection="$(basename "$(dirname "$dir")")"
            episode="$(basename "$dir")"
            case "$collection" in
              asre_shirin) out=outputs/asre_shirin/review ;;
              khane_to) out=outputs/khane_to/review ;;
              dar_jostojo_dar_again_raw) out=outputs/dar_jostojo_dar_again_raw/review ;;
              *) echo unsupported:$collection; exit 1 ;;
            esac
            work="/tmp/$collection-$episode"; rm -rf "$work"; mkdir -p "$work"
            cat "$dir"/part* | base64 -d > "$work/payload.tar.gz"
            gzip -t "$work/payload.tar.gz"
            tar -xzf "$work/payload.tar.gz" -C "$work"
            test -s "$work/timestamped/$episode.md"
            test -s "$work/md/$episode.md"
            test -s "$work/txt/$episode.txt"
            python - "$work/timestamped/$episode.md" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          t=re.findall(r'^\[(\d\d:\d\d:\d\d → \d\d:\d\d:\d\d)\]',s,re.M)
          assert t and 'گوینده نامشخص' not in s
          print('VALID',p,len(t))
          PY
            mkdir -p "$out"/{timestamped,md,txt}
            cp "$work/timestamped/$episode.md" "$out/timestamped/$episode.md"
            cp "$work/md/$episode.md" "$out/md/$episode.md"
            cp "$work/txt/$episode.txt" "$out/txt/$episode.txt"
            rm -rf "$dir"
            rm -f ".semantic_review_payload/$collection/$episode.b64"
            processed=$((processed+1))
          done
          echo processed=$processed
          ((processed > 0))
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'review: publish semantic ChatGPT checkpoints backlog'
          for a in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git pull --rebase origin main; sleep $((a*2)); done
          exit 1
      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"success\",\"context\":\"review/semantic-chunk-flush-v2\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
