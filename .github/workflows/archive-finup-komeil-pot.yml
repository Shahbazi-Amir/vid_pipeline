name: Archive Finup Komeil with PO token

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-finup-komeil-pot.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  VIDEO_ID: bpelPbGcBMc
  VIDEO_URL: https://www.youtube.com/watch?v=bpelPbGcBMc
  RELEASE_TAG: finup21-komeil-roudi-financial-literacy
  OUTPUT_BASENAME: Finup21_Komeil_Roudi_Financial_Literacy

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp and PO-token provider
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
          docker pull brainicism/bgutil-ytdlp-pot-provider:1.3.1
          docker run --name bgutil-provider -d --init -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:1.3.1
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4416/ping

      - name: Download official Finup media
        id: dl
        shell: bash
        run: |
          set -u
          mkdir -p dist logs work
          common=(
            --no-playlist
            --retries 2
            --fragment-retries 2
            --extractor-args 'youtube:player_client=mweb'
          )

          ok=0
          echo '=== mweb + bgutil POT: video ===' | tee logs/download.log
          if yt-dlp "${common[@]}" \
            -f 'best[ext=mp4]/best' \
            -o 'work/media.%(ext)s' \
            "$VIDEO_URL" 2>&1 | tee -a logs/download.log; then
            ok=1
          fi

          if [[ "$ok" -ne 1 ]]; then
            rm -f work/media.*
            echo '=== mweb + bgutil POT: audio ===' | tee -a logs/download.log
            if yt-dlp "${common[@]}" \
              -f 'bestaudio/best' \
              -o 'work/media.%(ext)s' \
              "$VIDEO_URL" 2>&1 | tee -a logs/download.log; then
              ok=1
            fi
          fi

          if [[ "$ok" -ne 1 ]]; then
            exit 1
          fi

          media=$(find work -maxdepth 1 -type f -name 'media.*' ! -name '*.part' -print -quit)
          test -n "$media"
          test "$(stat -c%s "$media")" -gt 500000
          ext="${media##*.}"
          dest="dist/${OUTPUT_BASENAME}.${ext}"
          mv "$media" "$dest"
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -show_entries format=duration,size,format_name -of json "$dest" > dist/media_info.json || true
          fi
          sha256sum "$dest" > dist/SHA256SUMS.txt
          printf '%s\n' "$VIDEO_URL" > dist/source_url.txt
          cat > dist/README.txt <<EOF
Finup Event 21 — Money Matters
Speaker: Dr. Komeil Roudi / دکتر کمیل رودی
Presentation: What Financial Literacy Is and What It Isn't / سواد مالی چه هست و چه نیست
Official Finup Event YouTube video ID: ${VIDEO_ID}
Download method: yt-dlp mweb client + bgutil proof-of-origin token provider.
This workflow only archives media and does NOT start transcription.
EOF
          ls -lh dist/

      - name: Upload to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Finup 21 — Komeil Roudi — Financial Literacy" \
              --notes "Official Finup Event presentation by Dr. Komeil Roudi. No transcription is started by this release archive workflow."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          media=$(find dist -maxdepth 1 -type f -name "${OUTPUT_BASENAME}.*" -printf '%f' 2>/dev/null | head -1 || true)
          [[ -n "$media" ]] || media='not available'
          body=$(cat <<EOF
Finup Komeil PO-token archive finished.

- status: ${JOB_STATUS}
- official_video_id: ${VIDEO_ID}
- media: ${media}
- source: ${VIDEO_URL}
- run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
- release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}
EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Finup Komeil PO archive report — ${GITHUB_RUN_ID}" \
            --body "$body"
