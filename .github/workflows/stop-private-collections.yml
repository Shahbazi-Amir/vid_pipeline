name: Stop private release collections

on:
  push:
    paths:
      - ".github/workflows/stop-private-collections.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-release-collections
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop active private collection processing
        run: echo "Private collection orchestration stopped to prevent further external review API usage."
