name: Audio portal checks
on:
  push:
    branches: [feature/hosted-audio-portal]
    paths: ['apps/audio_portal/**', 'scripts/audio_portal_worker.py', 'tests/test_audio_portal.py', '.github/workflows/audio-portal*.yml', '.streamlit/config.toml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pyyaml -r apps/audio_portal/requirements.txt
      - run: python -m pytest -q tests/test_audio_portal.py
