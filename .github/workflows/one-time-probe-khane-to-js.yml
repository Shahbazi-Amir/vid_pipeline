name: One-time probe Khane To JS

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  probe-js:
    if: github.event.pull_request.head.ref == 'agent/trigger-khane-to-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch Fintelligence Blog Angular sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,ssl,urllib.parse,urllib.request
          from pathlib import Path
          base='https://www.fintelligence.ir/'
          paths=[
            '/Scripts/App/Angular/Services/dataAjax.js?ver=5',
            '/Scripts/App/Angular/Services/BlogRepository.js?ver=5',
            '/Scripts/App/Angular/Controllers/BlogSearchController.js?ver=5',
          ]
          out={}
          for path in paths:
              url=urllib.parse.urljoin(base,path)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':base})
              with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as r:
                  raw=r.read().decode(r.headers.get_content_charset() or 'utf-8',errors='replace')
              out[path]={'url':url,'bytes':len(raw.encode('utf-8')),'content':raw[:50000]}
          Path('benchmarks').mkdir(exist_ok=True)
          Path('benchmarks/private-khane-to-js-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish JS probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/private-khane-to-js-probe.json
          git commit -m 'data: probe Khane To blog JS endpoints' || exit 0
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
