name: Audio validation

on:
  pull_request:
    paths:
      - 'src/vid_pipeline/audio.py'
      - 'src/vid_pipeline/media.py'
      - 'src/vid_pipeline/release_source.py'
      - 'src/vid_pipeline/chatgpt_handoff.py'
      - 'src/vid_pipeline/cli.py'
      - 'src/vid_pipeline/standalone.py'
      - 'src/vid_pipeline/github_client.py'
      - 'src/vid_pipeline/github_compat.py'
      - 'src/vid_pipeline/online_client.py'
      - 'src/vid_pipeline/server/api.py'
      - 'src/vid_pipeline/server/worker.py'
      - 'tests/integration/test_audio_input.py'
      - 'tests/test_release_source.py'
      - 'tests/test_chatgpt_handoff.py'
      - 'tests/test_github_compat_url.py'
      - 'tests/test_github_workflow_contract.py'
      - 'tests/test_uploaded_workflow_artifact_scope.py'
      - 'tests/test_url_dispatch_options_contract.py'
      - '.github/workflows/process-uploaded-video.yml'
      - '.github/workflows/process-video.yml'
      - '.github/workflows/process-release-media.yml'
      - '.github/workflows/audio-validation.yml'
  push:
    branches:
      - feature/audio-input-support
    paths:
      - 'src/vid_pipeline/audio.py'
      - 'src/vid_pipeline/media.py'
      - 'src/vid_pipeline/release_source.py'
      - 'src/vid_pipeline/chatgpt_handoff.py'
      - 'src/vid_pipeline/cli.py'
      - 'src/vid_pipeline/standalone.py'
      - 'src/vid_pipeline/github_client.py'
      - 'src/vid_pipeline/github_compat.py'
      - 'src/vid_pipeline/online_client.py'
      - 'src/vid_pipeline/server/api.py'
      - 'src/vid_pipeline/server/worker.py'
      - 'tests/integration/test_audio_input.py'
      - 'tests/test_release_source.py'
      - 'tests/test_chatgpt_handoff.py'
      - 'tests/test_github_compat_url.py'
      - 'tests/test_github_workflow_contract.py'
      - 'tests/test_uploaded_workflow_artifact_scope.py'
      - 'tests/test_url_dispatch_options_contract.py'
      - '.github/workflows/process-uploaded-video.yml'
      - '.github/workflows/process-video.yml'
      - '.github/workflows/process-release-media.yml'
      - '.github/workflows/audio-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint audio scope
        run: |
          ruff check \
            src/vid_pipeline/audio.py \
            src/vid_pipeline/media.py \
            src/vid_pipeline/release_source.py \
            src/vid_pipeline/chatgpt_handoff.py \
            tests/integration/test_audio_input.py \
            tests/test_release_source.py \
            tests/test_chatgpt_handoff.py \
            tests/test_github_compat_url.py \
            tests/test_uploaded_workflow_artifact_scope.py \
            tests/test_url_dispatch_options_contract.py

      - name: Run audio integration and source tests
        run: >-
          python -m pytest -q tests/integration/test_audio_input.py
          tests/test_release_source.py tests/test_chatgpt_handoff.py

      - name: Run audio workflow contract tests
        run: |
          python -m pytest -q \
            tests/test_github_compat_url.py \
            tests/test_github_workflow_contract.py \
            tests/test_uploaded_workflow_artifact_scope.py \
            tests/test_url_dispatch_options_contract.py

      - name: Compile audio scope
        run: |
          python -m compileall -q \
            src/vid_pipeline/audio.py \
            src/vid_pipeline/media.py \
            src/vid_pipeline/release_source.py \
            src/vid_pipeline/chatgpt_handoff.py \
            tests/integration/test_audio_input.py
