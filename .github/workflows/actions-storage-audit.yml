name: Actions storage audit
run-name: Actions storage audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/actions-storage-cleanup
    paths:
      - ".github/bootstrap/actions-storage-audit.trigger"

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit repository Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_PRODUCTION_RUN: "31348536690"
          OLD_CUTOFF_UTC: "2026-08-10T00:00:00Z"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          protected_run = int(os.environ["CURRENT_PRODUCTION_RUN"])
          cutoff = datetime.fromisoformat(os.environ["OLD_CUTOFF_UTC"].replace("Z", "+00:00"))

          artifacts = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "vid-pipeline-actions-storage-audit",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              batch = payload.get("artifacts") or []
              if not batch:
                  break
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          def created_at(row):
              raw = str(row.get("created_at") or "1970-01-01T00:00:00Z")
              return datetime.fromisoformat(raw.replace("Z", "+00:00"))

          total_bytes = sum(int(row.get("size_in_bytes") or 0) for row in artifacts)
          old = [
              row for row in artifacts
              if created_at(row) < cutoff
              and int((row.get("workflow_run") or {}).get("id") or 0) != protected_run
          ]
          old_bytes = sum(int(row.get("size_in_bytes") or 0) for row in old)
          recent = [row for row in artifacts if row not in old]
          recent_bytes = total_bytes - old_bytes

          largest = sorted(old, key=lambda row: int(row.get("size_in_bytes") or 0), reverse=True)[:50]

          def mib(n):
              return n / 1024 / 1024

          lines = [
              "# GitHub Actions artifact storage audit",
              "",
              f"Repository: `{repo}`",
              f"Artifacts found: **{len(artifacts)}**",
              f"Artifact bytes visible via repository API: **{mib(total_bytes):.2f} MiB**",
              f"Old candidates before `{cutoff.isoformat()}`: **{len(old)}** / **{mib(old_bytes):.2f} MiB**",
              f"Recent/protected artifacts: **{len(recent)}** / **{mib(recent_bytes):.2f} MiB**",
              f"Protected production run: `{protected_run}`",
              "",
              "## Largest old candidates",
              "",
              "| MiB | Artifact | Run | Created UTC | ID |",
              "|---:|---|---:|---|---:|",
          ]
          for row in largest:
              run_id = int((row.get("workflow_run") or {}).get("id") or 0)
              name = str(row.get("name") or "").replace("|", "\\|")
              lines.append(
                  f"| {mib(int(row.get('size_in_bytes') or 0)):.2f} | {name} | {run_id} | {row.get('created_at')} | {row.get('id')} |"
              )

          summary = "\n".join(lines) + "\n"
          print(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(summary)

          print("AUDIT_JSON=" + json.dumps({
              "artifact_count": len(artifacts),
              "total_bytes": total_bytes,
              "old_candidate_count": len(old),
              "old_candidate_bytes": old_bytes,
              "recent_or_protected_count": len(recent),
              "recent_or_protected_bytes": recent_bytes,
              "protected_run": protected_run,
          }, separators=(",", ":")))
          PY
