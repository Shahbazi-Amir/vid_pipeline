name: Archive Finup Komeil Roudi audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-finup-komeil.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  VIDEO_ID: bpelPbGcBMc
  VIDEO_URL: https://youtu.be/bpelPbGcBMc
  RELEASE_TAG: finup21-komeil-roudi-financial-literacy
  OUTPUT_BASENAME: Finup21_Komeil_Roudi_Financial_Literacy

jobs:
  archive-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl
          python3 -m pip install --upgrade 'yt-dlp[default,curl-cffi]'
          yt-dlp --version

      - name: Download audio from official Finup YouTube source
        shell: bash
        run: |
          set -u
          mkdir -p dist work logs
          : > logs/audio-download.log
          success=0
          method=''

          validate_and_convert() {
            input="$1"
            label="$2"
            if [[ -s "$input" ]] && [[ $(stat -c%s "$input") -gt 500000 ]] && ffprobe -v error "$input" >/dev/null 2>&1; then
              duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$input" 2>/dev/null || echo 0)
              echo "candidate=${label} bytes=$(stat -c%s "$input") duration=${duration}" | tee -a logs/audio-download.log
              if awk "BEGIN {exit !(${duration:-0} > 60)}"; then
                ffmpeg -y -v error -i "$input" -vn -codec:a libmp3lame -q:a 2 "dist/${OUTPUT_BASENAME}.mp3"
                if [[ -s "dist/${OUTPUT_BASENAME}.mp3" ]] && [[ $(stat -c%s "dist/${OUTPUT_BASENAME}.mp3") -gt 500000 ]]; then
                  success=1
                  method="$label"
                  return 0
                fi
              fi
            fi
            return 1
          }

          echo '=== DIRECT YT-DLP AUDIO ===' | tee -a logs/audio-download.log
          for client in android_vr web_embedded web_safari tv_simply; do
            rm -f work/direct.*
            if yt-dlp \
              --no-playlist \
              --retries 1 --fragment-retries 1 \
              --js-runtimes node \
              --remote-components ejs:github \
              --extractor-args "youtube:player_client=${client}" \
              -f 'ba/b' \
              -o 'work/direct.%(ext)s' \
              "$VIDEO_URL" 2>&1 | tee -a logs/audio-download.log; then
              f=$(find work -maxdepth 1 -type f -name 'direct.*' ! -name '*.part' -print -quit)
              if [[ -n "$f" ]] && validate_and_convert "$f" "yt-dlp-${client}"; then
                break
              fi
            fi
          done

          if [[ "$success" -ne 1 ]]; then
            echo '=== PIPED API AUDIO ===' | tee -a logs/audio-download.log
            for base in \
              'https://pipedapi.kavin.rocks' \
              'https://pipedapi.tokhmi.xyz' \
              'https://pipedapi.moomoo.me' \
              'https://pipedapi.syncpundit.io' \
              'https://api-piped.mha.fi' \
              'https://piped-api.garudalinux.org' \
              'https://pipedapi.rivo.lol' \
              'https://pipedapi.leptons.xyz'; do
              echo "PIPED ${base}" | tee -a logs/audio-download.log
              rm -f work/piped.json work/piped-audio.bin
              if curl -fsSL --retry 1 --connect-timeout 10 --max-time 45 \
                "${base}/streams/${VIDEO_ID}" -o work/piped.json 2>>logs/audio-download.log; then
                title=$(jq -r '.title // empty' work/piped.json 2>/dev/null || true)
                echo "title=${title}" | tee -a logs/audio-download.log
                stream=$(jq -r '[.audioStreams[]? | select(.url != null)] | sort_by(.bitrate // 0) | reverse | .[0].url // empty' work/piped.json 2>/dev/null || true)
                if [[ -n "$stream" ]]; then
                  if curl -fL --retry 2 --retry-all-errors --connect-timeout 15 --max-time 600 \
                    -A 'Mozilla/5.0' "$stream" -o work/piped-audio.bin 2>>logs/audio-download.log; then
                    if validate_and_convert work/piped-audio.bin "piped-${base#https://}"; then
                      break
                    fi
                  fi
                fi
              fi
            done
          fi

          if [[ "$success" -ne 1 ]]; then
            echo '=== INVIDIOUS API AUDIO ===' | tee -a logs/audio-download.log
            for base in \
              'https://inv.nadeko.net' \
              'https://invidious.nerdvpn.de' \
              'https://yt.chocolatemoo53.com' \
              'https://invidious.tiekoetter.com'; do
              echo "INVIDIOUS ${base}" | tee -a logs/audio-download.log
              rm -f work/inv.json work/inv-audio.bin
              if curl -fsSL --retry 1 --connect-timeout 10 --max-time 45 \
                "${base}/api/v1/videos/${VIDEO_ID}?local=true" -o work/inv.json 2>>logs/audio-download.log; then
                title=$(jq -r '.title // empty' work/inv.json 2>/dev/null || true)
                echo "title=${title}" | tee -a logs/audio-download.log
                stream=$(jq -r '[.adaptiveFormats[]? | select((.type // "") | startswith("audio/")) | select(.url != null)] | sort_by((.bitrate // "0")|tonumber) | reverse | .[0].url // empty' work/inv.json 2>/dev/null || true)
                if [[ -n "$stream" ]]; then
                  if [[ "$stream" == /* ]]; then stream="${base}${stream}"; fi
                  if curl -fL --retry 2 --retry-all-errors --connect-timeout 15 --max-time 600 \
                    -A 'Mozilla/5.0' "$stream" -o work/inv-audio.bin 2>>logs/audio-download.log; then
                    if validate_and_convert work/inv-audio.bin "invidious-${base#https://}"; then
                      break
                    fi
                  fi
                fi
              fi
            done
          fi

          if [[ "$success" -ne 1 ]]; then
            echo 'No valid audio stream could be downloaded.' | tee -a logs/audio-download.log
            exit 1
          fi

          media="dist/${OUTPUT_BASENAME}.mp3"
          ffprobe -v error -show_entries format=duration,size,format_name -of json "$media" > dist/media_info.json
          sha256sum "$media" > dist/SHA256SUMS.txt
          printf '%s\n' "$VIDEO_URL" > dist/source_url.txt
          printf '%s\n' "$method" > dist/download_method.txt
          {
            echo 'Finup Event 21 — Money Matters'
            echo 'Speaker: Dr. Komeil Roudi / دکتر کمیل رودی'
            echo "Presentation: What Financial Literacy Is and What It Isn't / سواد مالی چه هست و چه نیست"
            echo "Official YouTube video ID: ${VIDEO_ID}"
            echo "Audio acquisition method: ${method}"
            echo 'Audio archive only; transcription is NOT started.'
          } > dist/README.txt
          ls -lh dist/

      - name: Upload MP3 to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Finup 21 — Komeil Roudi — Financial Literacy" \
              --notes "Official Finup Event presentation by Dr. Komeil Roudi. Audio archive plus provenance and checksum. Transcription is not started."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finup-komeil-audio-download-logs
          path: logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Report audio archive result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          method='not available'
          media='not available'
          info='not available'
          [[ -f dist/download_method.txt ]] && method=$(cat dist/download_method.txt)
          [[ -f "dist/${OUTPUT_BASENAME}.mp3" ]] && media="${OUTPUT_BASENAME}.mp3"
          [[ -f dist/media_info.json ]] && info=$(tr -d '\n' < dist/media_info.json)
          body=$(printf '%s\n' \
            'Finup Komeil audio archive workflow finished.' \
            '' \
            "- status: ${JOB_STATUS}" \
            "- source: ${VIDEO_URL}" \
            "- video_id: ${VIDEO_ID}" \
            "- media: ${media}" \
            "- method: ${method}" \
            "- media_info: ${info}" \
            "- run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Finup Komeil audio archive — ${GITHUB_RUN_ID}" \
            --body "$body"
