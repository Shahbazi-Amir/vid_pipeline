name: Process uploaded video
run-name: Uploaded video ${{ inputs.request_id }} — attempt ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      asset_id:
        required: true
        type: string
      dispatch_id:
        required: true
        type: string
      original_name:
        required: true
        type: string
      file_size:
        required: true
        type: string
      sha256:
        required: true
        type: string
      profile:
        required: true
        default: balanced
        type: choice
        options: [fast, balanced, accurate]
      model:
        description: Optional explicit model override; empty uses the selected profile
        required: false
        default: ""
        type: string
      language:
        required: true
        default: fa
        type: string
      no_editorial:
        required: true
        default: "true"
        type: string
      keep_debug_artifacts:
        required: true
        default: "false"
        type: string
      diarization_enabled:
        required: true
        default: "false"
        type: string
      diarization_required:
        required: true
        default: "false"
        type: string
      num_speakers:
        required: true
        default: "2"
        type: string
      speaker_role_mode:
        required: true
        default: generic
        type: choice
        options: [generic, host-teacher]
      speaker_roles:
        required: false
        default: ""
        type: string

permissions:
  # Draft release assets require a token whose repository identity has push
  # access. Keep every other GITHUB_TOKEN permission at its implicit `none`.
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INPUT_MEDIA: /tmp/vid-pipeline-input/media
      REQUEST_ID: ${{ inputs.request_id }}
      ASSET_ID: ${{ inputs.asset_id }}
      EXPECTED_SIZE: ${{ inputs.file_size }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      PROFILE: ${{ inputs.profile }}
      MODEL: ${{ inputs.model }}
      LANGUAGE: ${{ inputs.language }}
      NO_EDITORIAL: ${{ inputs.no_editorial }}
      DIARIZATION_ENABLED: ${{ inputs.diarization_enabled }}
      DIARIZATION_REQUIRED: ${{ inputs.diarization_required }}
      NUM_SPEAKERS: ${{ inputs.num_speakers }}
      SPEAKER_ROLE_MODE: ${{ inputs.speaker_role_mode }}
      SPEAKER_ROLES: ${{ inputs.speaker_roles }}
      VID_PIPELINE_DIARIZATION_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/diarization
      EDITORIAL_MODEL: qwen3:8b
      OLLAMA_BASE_URL: http://127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache diarization models
        if: inputs.diarization_enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_DIARIZATION_CACHE }}
          key: diarization-${{ runner.os }}-py311-sherpa-1.13.4-segmentation-3.0-int8-3dspeaker-eres2net

      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          if [[ "${DIARIZATION_ENABLED,,}" == "true" ]]; then
            pip install -e '.[worker,diarization]'
          else
            pip install -e '.[worker]'
          fi

      - name: Download authenticated draft release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$INPUT_MEDIA")"
          python - "$ASSET_ID" "$INPUT_MEDIA" <<'PY'
          import os
          import sys
          import hashlib
          import time
          import urllib.error
          import urllib.request

          asset_id, target = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/${{ github.repository }}/releases/assets/{asset_id}",
              headers={
                  "Accept": "application/octet-stream",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          temporary = target + ".part"
          for attempt in range(4):
            try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  status = response.status
                  if status != 200:
                      body = response.read(4096).decode("utf-8", "replace")
                      raise RuntimeError(
                          f"GitHub asset download returned HTTP {status}; body={body!r}"
                      )
                  with open(temporary, "wb") as output:
                      while chunk := response.read(1024 * 1024):
                          output.write(chunk)
              if os.path.getsize(temporary) != int(os.environ["EXPECTED_SIZE"]):
                  raise RuntimeError("downloaded asset size mismatch")
              digest = hashlib.sha256()
              with open(temporary, "rb") as media:
                  for chunk in iter(lambda: media.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != os.environ["EXPECTED_SHA256"]:
                  raise RuntimeError("downloaded asset SHA-256 mismatch")
              os.replace(temporary, target)
              break
            except urllib.error.HTTPError as exc:
              body = exc.read(4096).decode("utf-8", "replace")
              safe_headers = {
                  key: value
                  for key, value in exc.headers.items()
                  if key.lower()
                  in {
                      "content-type",
                      "location",
                      "x-accepted-github-permissions",
                      "x-github-request-id",
                      "x-oauth-scopes",
                  }
              }
              hint = {
                  401: "The workflow token was rejected.",
                  403: "The workflow token cannot read this private draft release asset.",
                  404: "The asset is missing or hidden from the workflow token.",
              }.get(exc.code, "GitHub rejected the asset download.")
              if exc.code in {401, 403, 404} or attempt == 3:
                raise SystemExit(
                  f"{hint} HTTP {exc.code}; headers={safe_headers!r}; body={body!r}"
                ) from None
            except Exception:
              if attempt == 3:
                  raise
            finally:
              if os.path.exists(temporary) and not os.path.exists(target):
                  os.remove(temporary)
            time.sleep(2 ** attempt)
          PY

      - name: Verify input size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - "$INPUT_MEDIA" "$EXPECTED_SIZE" "$EXPECTED_SHA256" <<'PY'
          import hashlib
          import os
          import sys

          path, expected_size, expected_hash = sys.argv[1:]
          if os.path.getsize(path) != int(expected_size):
              raise SystemExit("downloaded asset size mismatch")
          digest = hashlib.sha256()
          with open(path, "rb") as media:
              for chunk in iter(lambda: media.read(1024 * 1024), b""):
                  digest.update(chunk)
          if digest.hexdigest() != expected_hash:
              raise SystemExit("downloaded asset SHA-256 mismatch")
          PY

      - name: Start optional local editorial service
        if: inputs.no_editorial == 'false'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null && break
            sleep 2
          done
          curl -fsS "$OLLAMA_BASE_URL/api/tags" >/dev/null
          ollama pull "$EDITORIAL_MODEL"

      - name: Run complete file pipeline
        shell: bash
        run: |
          set -euo pipefail
          args=(run-file "$INPUT_MEDIA" --name "$REQUEST_ID" --output-root outputs \
            --profile "$PROFILE" --language "$LANGUAGE" \
            --device cpu --compute-type int8)
          [[ -n "${MODEL:-}" ]] && args+=(--model "$MODEL")
          if [[ "${NO_EDITORIAL,,}" == "true" ]]; then
            args+=(--no-editorial)
          else
            args+=(--editorial-model "$EDITORIAL_MODEL" --editorial-base-url "$OLLAMA_BASE_URL")
          fi
          if [[ "${DIARIZATION_ENABLED,,}" == "true" ]]; then
            args+=(--diarize --num-speakers "$NUM_SPEAKERS" --speaker-role-mode "$SPEAKER_ROLE_MODE")
            [[ "${DIARIZATION_REQUIRED,,}" == "true" ]] && args+=(--diarization-required)
            IFS=',' read -ra roles <<< "$SPEAKER_ROLES"
            for role in "${roles[@]}"; do [[ -n "$role" ]] && args+=(--speaker-role "$role"); done
          fi
          vid-pipeline "${args[@]}" 2>&1 | tee pipeline.log

      - name: Prepare lean transcript artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transcript-artifact
          find outputs -path '*/delivery/*' -type f -exec cp {} transcript-artifact/ \;
          test "$(find transcript-artifact -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Upload transcript result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-transcript-${{ inputs.request_id }}
          path: transcript-artifact/*
          retention-days: 1
          if-no-files-found: error

      - name: Upload debug package
        if: success() && inputs.keep_debug_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ inputs.request_id }}
          path: |
            outputs/**
            pipeline.log
          retention-days: 1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ inputs.request_id }}
          path: |
            outputs/**/state.json
            outputs/**/result.json
            pipeline.log
          retention-days: 7
          if-no-files-found: warn

      - name: Remove input and temporary media
        if: always()
        shell: bash
        run: |
          rm -f -- "$INPUT_MEDIA"
          find /tmp/vid-pipeline-input -type f -delete 2>/dev/null || true
          find outputs -type f \( -name '*.wav' -o -name '*.mp4' -o -name '*.mkv' \) -delete 2>/dev/null || true
