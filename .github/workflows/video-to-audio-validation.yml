name: Video to audio validation

on:
  pull_request:
    paths:
      - 'src/vid_pipeline/audio_export.py'
      - 'src/vid_pipeline/cli.py'
      - 'src/vid_pipeline/download.py'
      - 'tests/integration/test_video_to_audio.py'
      - 'tests/integration/test_audio_input.py'
      - 'docs/video-to-audio.md'
      - '.github/workflows/video-to-audio-validation.yml'
  push:
    branches:
      - feature/video-to-audio
    paths:
      - 'src/vid_pipeline/audio_export.py'
      - 'src/vid_pipeline/cli.py'
      - 'src/vid_pipeline/download.py'
      - 'tests/integration/test_video_to_audio.py'
      - 'tests/integration/test_audio_input.py'
      - 'docs/video-to-audio.md'
      - '.github/workflows/video-to-audio-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-to-audio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-audio-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint video-to-audio scope
        run: |
          ruff check \
            src/vid_pipeline/audio_export.py \
            src/vid_pipeline/cli.py \
            tests/integration/test_video_to_audio.py

      - name: Run delivery audio E2E and ASR audio regression tests
        run: |
          python -m pytest -q \
            tests/integration/test_video_to_audio.py \
            tests/integration/test_audio_input.py

      - name: Compile video-to-audio scope
        run: |
          python -m compileall -q \
            src/vid_pipeline/audio_export.py \
            src/vid_pipeline/cli.py \
            tests/integration/test_video_to_audio.py
