name: Probe cleanup v5 run
on:
  push:
    branches: [main]
    paths: [".github/bootstrap/probe-cleanup-v5-run.trigger"]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          sha='119eec63351630231508ee7c2dea368a8187cd08'
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={sha}&per_page=20",headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          runs=[{'id':x['id'],'name':x['name'],'status':x['status'],'conclusion':x['conclusion'],'html_url':x['html_url']} for x in data.get('workflow_runs',[])]
          Path('validation').mkdir(exist_ok=True)
          Path('validation/cleanup-v5-run-probe.json').write_text(json.dumps({'runs':runs},indent=2)+'\n')
          PY
      - name: Commit and clean
        run: |
          rm -f .github/bootstrap/probe-cleanup-v5-run.trigger .github/workflows/probe-cleanup-v5-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: record cleanup v5 workflow status"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
