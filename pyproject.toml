[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcript-pipeline"
version = "0.7.0"
description = "Audio-to-transcript pipeline with multi-pass ASR consensus, lossless pre-review, and auditable human review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Amir Shahbazi" }
]
dependencies = []

[project.optional-dependencies]
client = [
  "httpx>=0.27"
]
api = [
  "boto3>=1.34",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "rq>=2.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30"
]
worker = [
  "boto3>=1.34",
  "faster-whisper>=1.2.1",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "rq>=2.0",
  "sqlalchemy>=2.0",
  "yt-dlp"
]
web = [
  "httpx>=0.27",
  "streamlit>=1.42,<2"
]
download = [
  "yt-dlp"
]
whisper = [
  "faster-whisper>=1.2.1"
]
alignment = [
  "whisperx>=3.4"
]
diarization = [
  "pyannote.audio==4.0.4",
  "soundfile>=0.12,<1"
]
diarization-pyannote = [
  "pyannote.audio==4.0.4",
  "soundfile>=0.12,<1"
]
cpu-worker = [
  "faster-whisper==1.2.1",
  "pyannote.audio==4.0.4",
  "soundfile==0.13.1"
]
all = [
  "boto3>=1.34",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "rq>=2.0",
  "sqlalchemy>=2.0",
  "streamlit>=1.42,<2",
  "uvicorn>=0.30",
  "yt-dlp",
  "faster-whisper>=1.2.1"
]
advanced = [
  "yt-dlp",
  "faster-whisper>=1.2.1",
  "whisperx>=3.4",
  "pyannote.audio==4.0.4",
  "soundfile>=0.12,<1"
]
dev = [
  "boto3>=1.34",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pytest>=8.0",
  "pyyaml>=6.0",
  "ruff>=0.5",
  "sqlalchemy>=2.0"
]

[project.scripts]
vid-pipeline = "vid_pipeline.pyannote_cli:main"
vid-review = "vid_pipeline.review_cli:main"
vid-accuracy = "vid_pipeline.accuracy_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["scripts/video_batch_runner.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
