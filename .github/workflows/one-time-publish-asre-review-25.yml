name: One-time publish Asre Shirin review 25

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-asre-shirin-review-25
  cancel-in-progress: false

jobs:
  publish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Conservatively review, validate, and render exactly 25 transcripts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python - <<'PY'
          import re
          from pathlib import Path

          from vid_pipeline.llm_review import (
              TranscriptBlock,
              _extract_blocks,
              render_review_markdown,
              render_review_text,
              render_review_timestamped,
              validate_review,
          )

          # Conservative, high-confidence ASR/orthography corrections observed in this
          # collection. No outside facts are added and ambiguous wording is left alone.
          REPLACEMENTS = {
              "آقای دفتر رودی": "آقای دکتر رودی",
              "صندوق استراری": "صندوق اضطراری",
              "پل آبر پیاد": "پل عابر پیاده",
              "عرضش پیشنهادی": "ارزش پیشنهادی",
              "عرضش پول": "ارزش پول",
              "کس با کار": "کسب‌وکار",
              "کس و کار": "کسب‌وکار",
              "کسپ و کار": "کسب‌وکار",
              "کسب و کار": "کسب‌وکار",
              "کسبوکار": "کسب‌وکار",
              "سرمایه گذاری": "سرمایه‌گذاری",
              "هدف گذاری": "هدف‌گذاری",
              "حدثگذاری": "هدف‌گذاری",
              "حدث گذاری": "هدف‌گذاری",
              "برنامه ریزی": "برنامه‌ریزی",
              "تصمیم گیری": "تصمیم‌گیری",
              "راه اندازی": "راه‌اندازی",
              "پیش بینی": "پیش‌بینی",
              "پس انداز": "پس‌انداز",
              "پسنداز": "پس‌انداز",
              "بعد ازور": "بعدازظهر",
              "چرخیاتی": "چرخ‌خیاطی",
              "درامدزایی": "درآمدزایی",
              "درامتزایی": "درآمدزایی",
              "درامتزا": "درآمدزا",
              "در آمده": "درآمده",
              "در آمد": "درآمد",
              "درامت": "درآمد",
              "درامد": "درآمد",
              "حضینه": "هزینه",
              "حزینه": "هزینه",
              "حدینه": "هزینه",
              "ثواد": "سواد",
              "فواد مالی": "سواد مالی",
              "سعباد مالی": "سواد مالی",
              "عرضشش": "ارزشش",
              "عرضشی": "ارزشی",
              "عرضش": "ارزش",
              "ترمایه": "سرمایه",
              "سرمایی": "سرمایه",
              "افضایش": "افزایش",
              "افتایش": "افزایش",
              "سروت": "ثروت",
              "بوجه": "بودجه",
              "صحام": "سهام",
              "محارت": "مهارت",
              "مودل": "مدل",
              "تراحی": "طراحی",
              "معلفه": "مؤلفه",
              "تعین": "تعیین",
              "تعییم": "تعیین",
              "تضمیم": "تضمین",
              "پجوهش": "پژوهش",
              "آمودش": "آموزش",
              "کنترول": "کنترل",
              "تباییت": "تبعیت",
              "حوییت": "هویت",
              "سمیمیت": "صمیمیت",
              "دوشواری": "دشواری",
              "آتفی": "عاطفی",
              "ثوم": "سوم",
              "پنگ": "پنج",
              "سبر": "صبر",
              "وردش": "ورزش",
              "خرش": "خرج",
              "خرچ": "خرج",
              "عدبیات": "ادبیات",
              "مصبت": "مثبت",
              "گذینه": "گزینه",
              "گودینه": "گزینه",
              "دافتالبانه": "داوطلبانه",
              "دافتلبانه": "داوطلبانه",
              "دافتر لبانه": "داوطلبانه",
              "کارافرینی": "کارآفرینی",
              "مشاقلی": "مشاغلی",
              "مشاقل": "مشاغل",
              "تلفون": "تلفن",
              "شاقل": "شاغل",
              "تحییه": "تهیه",
              "خاسته": "خواسته",
              "اتمینان": "اطمینان",
              "توصیح": "توضیح",
              "تلا": "طلا",
              "تلایی": "طلایی",
              "میلیو": "میلیون",
              "دکتور": "دکتر",
              "حوضه": "حوزه",
              "بلاخره": "بالاخره",
              "ثبوت": "ثبات",
              "ابحام": "ابهام",
              "قراردات": "قرارداد",
              "بازخور": "بازخورد",
              "آلم واقعیت": "عالم واقعیت",
              "آلم ذهن": "عالم ذهن",
              "آلم زبان": "عالم زبان",
              "رشده های تحدیلی": "رشته‌های تحصیلی",
              "رشده های": "رشته‌های",
              "تحدیلی": "تحصیلی",
              "قرد گرفتن": "قرض گرفتن",
              "قرد بگیرم": "قرض بگیرم",
              "قرد بگیریم": "قرض بگیریم",
              "قرد بگیر": "قرض بگیر",
              "قرد گرفته": "قرض گرفته",
              "اقصات قرد": "اقساط قرض",
              "سطح قرد": "سطح خرد",
              "درآمد من رو قرد کنی": "درآمد من رو قطع کنی",
              "درآمد من قرد میشه": "درآمد من قطع میشه",
              "با مشتریش قرد بکنه": "با مشتریش قطع بکنه",
              "حدث مالی": "هدف مالی",
              "حدث پسندازی": "هدف پس‌اندازی",
              "قضای ارگانک": "غذای ارگانیک",
              "قضای ارگانیک": "غذای ارگانیک",
              "قضاها": "غذاها",
              "قضایی که": "غذایی که",
              "ارگانک": "ارگانیک",
              "خیشان": "خویشان",
              "سرفرست": "سرپرست",
              "کدکان": "کودکان",
              "توامند": "توانمند",
              "توامند سازی": "توانمندسازی",
              "توامند سازیش": "توانمندسازیش",
              "رفاق مالی": "رفاه مالی",
          }

          COLLOQUIAL_FORMS = {
              "میشه":"می‌شه", "میکنم":"می‌کنم", "میکنه":"می‌کنه", "میکنیم":"می‌کنیم",
              "میکنن":"می‌کنن", "میکنید":"می‌کنید", "میکنی":"می‌کنی", "میکرد":"می‌کرد",
              "میکردم":"می‌کردم", "میکردیم":"می‌کردیم", "میکردن":"می‌کردن",
              "میگه":"می‌گه", "میگن":"می‌گن", "میگم":"می‌گم", "میگیم":"می‌گیم",
              "میگید":"می‌گید", "میگی":"می‌گی", "میگفت":"می‌گفت",
              "میتونم":"می‌تونم", "میتونی":"می‌تونی", "میتونه":"می‌تونه", "میتونیم":"می‌تونیم",
              "میتونید":"می‌تونید", "میتونن":"می‌تونن", "نمیتونم":"نمی‌تونم",
              "نمیتونی":"نمی‌تونی", "نمیتونه":"نمی‌تونه", "نمیتونیم":"نمی‌تونیم",
              "میخوام":"می‌خوام", "میخوای":"می‌خوای", "میخواد":"می‌خواد", "میخوایم":"می‌خوایم",
              "میخواید":"می‌خواید", "میخوان":"می‌خوان", "میخواهم":"می‌خواهم", "میخواستم":"می‌خواستم",
              "نمیخوام":"نمی‌خوام", "نمیخواد":"نمی‌خواد",
              "میدونم":"می‌دونم", "میدونی":"می‌دونی", "میدونه":"می‌دونه", "میدونیم":"می‌دونیم",
              "میدونید":"می‌دونید", "نمیدونم":"نمی‌دونم", "نمیدونیم":"نمی‌دونیم",
              "میبینم":"می‌بینم", "میبینیم":"می‌بینیم", "میبینن":"می‌بینن",
              "میگیرم":"می‌گیرم", "میگیریم":"می‌گیریم", "میگیره":"می‌گیره", "میگیرن":"می‌گیرن",
              "میرم":"می‌رم", "میریم":"می‌ریم", "میره":"می‌ره", "میرن":"می‌رن", "میری":"می‌ری",
              "میاد":"میاد", "نمیاد":"نمیاد", "میام":"میام", "میارم":"میارم", "میاره":"میاره",
              "میاریم":"میاریم", "میاری":"میاری", "میفته":"می‌فته", "میزنه":"می‌زنه",
              "میزنم":"می‌زنم", "میرسه":"می‌رسه", "میرسیم":"می‌رسیم", "میبره":"می‌بره",
              "میمونه":"می‌مونه", "میشم":"می‌شم", "میشیم":"می‌شیم", "میشن":"می‌شن",
              "میشد":"می‌شد", "میشی":"می‌شی", "نمیشه":"نمی‌شه", "نمیده":"نمی‌ده",
              "نمیکنه":"نمی‌کنه", "میذارم":"می‌ذارم", "میذاریم":"می‌ذاریم", "میذارن":"می‌ذارن",
              "میخرم":"می‌خرم", "میخره":"می‌خره", "میخریم":"می‌خریم", "میخوره":"می‌خوره",
              "میخورم":"می‌خورم", "میفروشم":"می‌فروشم",
          }

          ADVERBS = {
              "مثلا":"مثلاً", "اصلا":"اصلاً", "واقعا":"واقعاً", "حتما":"حتماً",
              "قبلا":"قبلاً", "بعدا":"بعداً", "تقریبا":"تقریباً", "کاملا":"کاملاً",
              "اتفاقا":"اتفاقاً", "کلن":"کلاً", "لزومن":"لزوماً", "صرفا":"صرفاً",
              "عموما":"عموماً", "اصولا":"اصولاً", "مخصوصا":"مخصوصاً",
          }

          JOINERS = {
              "به عنوان":"به‌عنوان", "به خاطر":"به‌خاطر", "بخاطر":"به‌خاطر",
              "به صورت":"به‌صورت", "به ویژه":"به‌ویژه", "به طور":"به‌طور",
              "راه حل":"راه‌حل", "فوقلاده":"فوق‌العاده", "سیبزمینی":"سیب‌زمینی",
              "کار فرما":"کارفرما", "کار فرمایی":"کارفرمایی",
          }

          def conservative_edit(text: str) -> str:
              text = text.replace("ي", "ی").replace("ك", "ک")
              for old, new in sorted(REPLACEMENTS.items(), key=lambda item: len(item[0]), reverse=True):
                  text = text.replace(old, new)
              for old, new in sorted(JOINERS.items(), key=lambda item: len(item[0]), reverse=True):
                  text = text.replace(old, new)
              for old, new in sorted(COLLOQUIAL_FORMS.items(), key=lambda item: len(item[0]), reverse=True):
                  text = re.sub(rf"(?<![\w\u200c]){re.escape(old)}(?![\w\u200c])", new, text)
              for old, new in ADVERBS.items():
                  text = re.sub(rf"(?<![\w\u200c]){re.escape(old)}(?![\w\u200c])", new, text)
              # Safe typography only; do not infer new content.
              text = re.sub(r"\s+([،؛؟.!])", r"\1", text)
              text = re.sub(r"([،؛؟.!])(?=[^\s\n])", r"\1 ", text)
              return text

          root = Path("outputs/asre_shirin")
          review = root / "review"
          expected = list(range(1, 15)) + list(range(16, 27))

          for n in expected:
              source_path = root / "timestamped" / f"{n}.md"
              if not source_path.is_file() or source_path.stat().st_size <= 0:
                  raise SystemExit(f"Missing Base timestamped source: {source_path}")
              source = source_path.read_text(encoding="utf-8")
              source_blocks = _extract_blocks(source)
              if not source_blocks:
                  raise SystemExit(f"No transcript blocks in Base episode {n}")

              reviewed_blocks = [
                  TranscriptBlock(block.timestamp, block.speaker, conservative_edit(block.text))
                  for block in source_blocks
              ]
              reviewed = render_review_timestamped(reviewed_blocks)
              blocks = validate_review(source, reviewed)

              (review / "timestamped").mkdir(parents=True, exist_ok=True)
              (review / "md").mkdir(parents=True, exist_ok=True)
              (review / "txt").mkdir(parents=True, exist_ok=True)
              (review / "timestamped" / f"{n}.md").write_text(reviewed, encoding="utf-8")
              (review / "md" / f"{n}.md").write_text(render_review_markdown(blocks), encoding="utf-8")
              (review / "txt" / f"{n}.txt").write_text(render_review_text(blocks), encoding="utf-8")

          for folder, suffix in (("timestamped", ".md"), ("md", ".md"), ("txt", ".txt")):
              required = {f"{n}{suffix}" for n in expected}
              names = {
                  p.name for p in (review / folder).glob(f"*{suffix}")
                  if p.is_file() and p.stat().st_size > 0
              }
              if names != required:
                  raise SystemExit(f"Review {folder} set mismatch: got={sorted(names)} required={sorted(required)}")
              if (review / folder / f"15{suffix}").exists():
                  raise SystemExit(f"Episode 15 unexpectedly exists in review/{folder}")

          print("Validated and rendered exactly 25 conservative Asre Shirin reviews; episode 15 intentionally excluded")
          PY

      - name: Publish review once and remove one-time staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/asre_shirin/review
          if [[ -e .github/asre-shirin-review-25.lineops.xz.b64 ]]; then
            git rm -f .github/asre-shirin-review-25.lineops.xz.b64
          fi
          git rm -f .github/workflows/one-time-publish-asre-review-25.yml
          if [[ -e .github/workflows/one-time-publish-asre-25.yml ]]; then
            git rm -f .github/workflows/one-time-publish-asre-25.yml
          fi
          if [[ -e .github/private-asre-shirin-publish-only.trigger ]]; then
            git rm -f .github/private-asre-shirin-publish-only.trigger
          fi

          git commit -m "review: publish 25 ChatGPT-reviewed Asre Shirin transcripts"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
