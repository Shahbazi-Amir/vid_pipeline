name: Post-Chehelstoun media queue
run-name: Post-Chehelstoun media queue ${{ github.run_id }}

on:
  workflow_run:
    workflows: ["Chehelstoun review materialization"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: post-chehelstoun-heavy-asr
  cancel-in-progress: false

env:
  PROFILE: balanced
  LANGUAGE: fa
  AUDIO_PROFILE: safe
  VID_PIPELINE_ACCURACY_MODE: balanced
  CHEHELSTOUN_RELEASE_TAG: chehelstoun-archive-v1

jobs:
  process-queue:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/vid-pipeline/asr
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1

      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl rsync
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Discover Mizan and Ketab Baz release assets
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          releases = json.loads(Path('/tmp/releases.json').read_text(encoding='utf-8'))
          media_exts = {'.mp3', '.m4a', '.wav', '.flac', '.aac', '.ogg', '.mp4', '.mkv', '.mov', '.webm'}

          def media_assets(release):
              return [
                  a for a in release.get('assets', [])
                  if Path(a.get('name', '')).suffix.lower() in media_exts
              ]

          cheh_tag = os.environ['CHEHELSTOUN_RELEASE_TAG']
          cheh = next((r for r in releases if r.get('tag_name') == cheh_tag), None)
          if cheh is None:
              raise SystemExit(f'Chehelstoun release not found: {cheh_tag}')

          # Chehelstoun episode assets are numbered 01..38. Any non-numbered media
          # asset added to this dedicated release is treated as the requested Mizan file.
          mizan_candidates = [
              a for a in media_assets(cheh)
              if not re.match(r'^\d{2}(?:\D|$)', a.get('name', ''))
          ]
          if not mizan_candidates:
              raise SystemExit('No non-numbered media asset found in the Chehelstoun release for Mizan.')
          mizan = sorted(mizan_candidates, key=lambda a: a.get('created_at', ''))[-1]

          def book_score(release):
              parts = [release.get('tag_name', ''), release.get('name', '')]
              parts += [a.get('name', '') for a in release.get('assets', [])]
              text = ' '.join(parts)
              low = text.lower()
              score = 0
              if 'کتاب' in text:
                  score += 5
              if 'bookbaz' in low or 'book-baz' in low or 'book_baz' in low:
                  score += 5
              if 'ketabbaz' in low or 'ketab-baz' in low or 'ketab_baz' in low:
                  score += 5
              if 'ketab' in low:
                  score += 2
              if 'book' in low:
                  score += 1
              return score

          book_releases = [
              r for r in releases
              if r.get('tag_name') != cheh_tag and media_assets(r) and book_score(r) > 0
          ]
          if not book_releases:
              raise SystemExit('No separate Ketab Baz release with a media asset was found.')
          book_release = sorted(book_releases, key=lambda r: (book_score(r), r.get('published_at') or ''), reverse=True)[0]
          book_assets = media_assets(book_release)
          if not book_assets:
              raise SystemExit('Ketab Baz release has no supported media asset.')
          book = sorted(book_assets, key=lambda a: a.get('created_at', ''))[-1]

          queue = [
              {
                  'slug': 'mizan',
                  'display': 'میزان',
                  'output_root': 'outputs/mizan/01',
                  'asset_name': mizan['name'],
                  'asset_url': mizan['browser_download_url'],
                  'asset_size': mizan['size'],
                  'release_tag': cheh.get('tag_name', ''),
                  'hotwords': 'میزان، کمیل رودی، دکتر کمیل رودی، سواد مالی',
              },
              {
                  'slug': 'ketab-baz',
                  'display': 'کتاب‌باز',
                  'output_root': 'outputs/ketab-baz/01',
                  'asset_name': book['name'],
                  'asset_url': book['browser_download_url'],
                  'asset_size': book['size'],
                  'release_tag': book_release.get('tag_name', ''),
                  'hotwords': 'کتاب باز، کتاب‌باز، کمیل رودی، دکتر کمیل رودی، سروش صحت',
              },
          ]
          Path('/tmp/media-queue.json').write_text(
              json.dumps(queue, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          for item in queue:
              print(f"queued {item['display']}: {item['asset_name']} from {item['release_tag']}")
          PY
          echo "queue<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/media-queue.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Process queue sequentially
        env:
          QUEUE_JSON: ${{ steps.discover.outputs.queue }}
          VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$QUEUE_JSON" > /tmp/media-queue.json
          count=$(jq 'length' /tmp/media-queue.json)

          for idx in $(seq 0 $((count - 1))); do
            item=$(jq -c ".[$idx]" /tmp/media-queue.json)
            slug=$(jq -r '.slug' <<<"$item")
            display=$(jq -r '.display' <<<"$item")
            dest=$(jq -r '.output_root' <<<"$item")
            asset_name=$(jq -r '.asset_name' <<<"$item")
            asset_url=$(jq -r '.asset_url' <<<"$item")
            asset_size=$(jq -r '.asset_size' <<<"$item")
            release_tag=$(jq -r '.release_tag' <<<"$item")
            hotwords=$(jq -r '.hotwords' <<<"$item")

            if [[ -s "$dest/review/assistant-review-package.json" \
               && -s "$dest/pre_review/transcript.pre-review.json" \
               && -s "$dest/accuracy/transcript.consensus.json" \
               && -s "$dest/delivery/transcript.txt" ]]; then
              echo "$display is already complete and review-ready; skipping."
              continue
            fi

            echo "=== Processing $display: $asset_name ==="
            rm -rf "/tmp/${slug}-input" "/tmp/${slug}-runtime"
            mkdir -p "/tmp/${slug}-input" "/tmp/${slug}-runtime"
            input="/tmp/${slug}-input/${asset_name}"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 \
              "$asset_url" -o "$input"
            test "$(stat -c %s "$input")" -eq "$asset_size"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$input" | grep -q .

            title="${asset_name%.*}"
            vid-pipeline run-file "$input" \
              --name "$slug" \
              --output-root "/tmp/${slug}-runtime" \
              --profile "$PROFILE" \
              --language "$LANGUAGE" \
              --device cpu \
              --compute-type int8 \
              --audio-profile "$AUDIO_PROFILE" \
              --hotwords "$hotwords" \
              --title "$title" \
              --program "$display" \
              --speaker "دکتر کمیل رودی" \
              --source-url "$asset_url" \
              --no-editorial

            job_dir=$(find "/tmp/${slug}-runtime" -mindepth 1 -maxdepth 1 -type d -name "${slug}-*" -print -quit)
            test -n "$job_dir"
            test -s "$job_dir/delivery/transcript.txt"
            test -s "$job_dir/pre_review/transcript.pre-review.json"
            test -s "$job_dir/accuracy/transcript.consensus.json"
            test -s "$job_dir/review/assistant-review-package.json"

            rm -rf "$dest"
            mkdir -p "$dest"
            for d in delivery pre_review accuracy review; do
              if [[ -d "$job_dir/$d" ]]; then
                mkdir -p "$dest/$d"
                rsync -a \
                  --exclude 'clips/' \
                  --exclude '*.mp3' --exclude '*.m4a' --exclude '*.wav' \
                  --exclude '*.flac' --exclude '*.aac' --exclude '*.ogg' \
                  --exclude '*.mp4' --exclude '*.mkv' --exclude '*.mov' --exclude '*.webm' \
                  "$job_dir/$d/" "$dest/$d/"
              fi
            done
            [[ -f "$job_dir/result.json" ]] && cp "$job_dir/result.json" "$dest/result.json"
            [[ -f "$job_dir/source.json" ]] && cp "$job_dir/source.json" "$dest/source.json"

            ITEM="$item" python - "$dest/metadata.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          item = json.loads(os.environ['ITEM'])
          payload = {
              'collection': item['display'],
              'asset_name': item['asset_name'],
              'source_release_tag': item['release_tag'],
              'source_url': item['asset_url'],
              'profile': os.environ['PROFILE'],
              'asr_model': 'large-v3-turbo',
              'language': os.environ['LANGUAGE'],
              'audio_profile': os.environ['AUDIO_PROFILE'],
              'accuracy_mode': os.environ['VID_PIPELINE_ACCURACY_MODE'],
              'editorial': False,
              'chatgpt_review_ready': True,
              'review_clips_committed': False,
              'pipeline_run_id': os.environ['GITHUB_RUN_ID'],
          }
          Path(sys.argv[1]).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$dest"
            if ! git diff --cached --quiet; then
              git commit -m "Add ${display} transcript and review package"
              for attempt in 1 2 3; do
                git pull --rebase origin main
                if git push origin HEAD:main; then
                  break
                fi
                if [[ "$attempt" -eq 3 ]]; then
                  echo "Failed to push $display output" >&2
                  exit 1
                fi
                sleep $((attempt * 4))
              done
            fi

            rm -rf "/tmp/${slug}-input" "/tmp/${slug}-runtime"
          done

      - name: Create queue completion report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Post-Chehelstoun media queue finished.

          Order:
          1. Mizan -> outputs/mizan/01
          2. Ketab Baz -> outputs/ketab-baz/01

          Both use the same Persian balanced ASR + accuracy/review-package path, without an LLM API.

          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh issue create --title "Mizan + Ketab Baz transcription queue ${GITHUB_RUN_ID}" --body "$body"
