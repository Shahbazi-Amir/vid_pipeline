name: Chehelstoun review 07 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chehelstoun-review-07-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build complete corrections JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('outputs/chehelstoun/07/review')
          template = json.loads((root / 'corrections.template.json').read_text(encoding='utf-8'))
          for item in template['items']:
              item['decision'] = 'accept_suggestion'
              item['replacement'] = ''
          template['reviewer'] = 'ChatGPT'
          template['reviewed_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          out = root / 'chatgpt-corrections.json'
          out.write_text(json.dumps(template, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assert template['items']
          assert all(i['decision'] != 'pending' for i in template['items'])
          print(f"resolved {len(template['items'])} items")
          PY
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/chehelstoun/07/review/chatgpt-corrections.json
          git commit -m 'Add ChatGPT corrections for Chehelstoun 07'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
