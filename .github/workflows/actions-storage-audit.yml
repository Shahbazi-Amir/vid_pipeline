name: Actions old run history cleanup
run-name: Actions old run history cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete one safe chunk of completed old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_CLEANUP_RUN: ${{ github.run_id }}
          PROTECTED_PRODUCTION_RUN: "31348536690"
          OLD_CUTOFF_UTC: "2026-08-10T00:00:00Z"
          CHUNK_SIZE: "100"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_cleanup_run = int(os.environ['CURRENT_CLEANUP_RUN'])
          protected_run = int(os.environ['PROTECTED_PRODUCTION_RUN'])
          cutoff = datetime.fromisoformat(os.environ['OLD_CUTOFF_UTC'].replace('Z', '+00:00'))
          chunk_size = int(os.environ['CHUNK_SIZE'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vid-pipeline-actions-run-history-cleanup',
          }

          def http_error_info(exc):
              h = exc.headers or {}
              return {
                  'http': exc.code,
                  'rate_remaining': h.get('X-RateLimit-Remaining'),
                  'rate_reset': h.get('X-RateLimit-Reset'),
                  'retry_after': h.get('Retry-After'),
              }

          def api_json(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print('API_LIST_ERROR=' + json.dumps(http_error_info(exc), separators=(',', ':')))
                  raise

          def list_runs():
              rows, page = [], 1
              while True:
                  payload = api_json(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}')
                  batch = payload.get('workflow_runs') or []
                  if not batch:
                      break
                  rows.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return rows

          def dt(row):
              return datetime.fromisoformat(str(row.get('created_at') or '1970-01-01T00:00:00Z').replace('Z', '+00:00'))

          before = list_runs()
          all_candidates = [
              row for row in before
              if str(row.get('status') or '') == 'completed'
              and dt(row) < cutoff
              and int(row.get('id') or 0) not in {protected_run, current_cleanup_run}
          ]
          all_candidates.sort(key=dt)
          selected = all_candidates[:chunk_size]
          deleted = 0
          rate_limited = None
          failures = []

          for row in selected:
              run_id = int(row.get('id') or 0)
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers=headers,
                  method='DELETE',
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = int(getattr(response, 'status', 204) or 204)
                  if status == 204:
                      deleted += 1
                  else:
                      failures.append({'id': run_id, 'error': f'http_{status}'})
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      deleted += 1
                  elif exc.code == 403:
                      rate_limited = http_error_info(exc)
                      print('DELETE_RATE_LIMIT=' + json.dumps(rate_limited, separators=(',', ':')))
                      break
                  else:
                      failures.append({'id': run_id, 'error': f'http_{exc.code}'})
              time.sleep(0.65)

          estimated_remaining = max(0, len(all_candidates) - deleted)
          summary = {
              'visible_runs_before': len(before),
              'old_completed_candidates_before': len(all_candidates),
              'chunk_selected': len(selected),
              'deleted_this_run': deleted,
              'estimated_old_completed_remaining': estimated_remaining,
              'protected_production_run': protected_run,
              'rate_limited': rate_limited,
              'failure_count': len(failures),
              'failures': failures,
          }
          print('RUN_CLEANUP_SUMMARY=' + json.dumps(summary, separators=(',', ':'), ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(
                  '# Actions run history cleanup chunk\n\n'
                  f"Old completed before chunk: **{len(all_candidates)}**\n\n"
                  f"Deleted this run: **{deleted}**\n\n"
                  f"Estimated remaining: **{estimated_remaining}**\n\n"
                  f"Failures: **{len(failures)}**\n"
              )
          if failures:
              raise SystemExit(f'non-rate-limit delete failures: {failures[:5]}')
          if rate_limited:
              raise SystemExit('GitHub API rate limited this chunk; retry after reset')
          PY
