name: Validate and package RAG batch 171-670
on:
  push:
    branches: [agent/rag-evidence-shards]
    paths:
      - scripts/package_rag_batch500.py
      - .github/workflows/rag-batch500-package.yml
permissions:
  contents: write
concurrency:
  group: rag-batch500-package
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'Shahbazi-Amir/vid_pipeline' && github.ref == 'refs/heads/agent/rag-evidence-shards'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/rag-evidence-shards
      - run: python3 scripts/package_rag_batch500.py
      - name: Commit verified packages and catalogue
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/rag-evidence-shards"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- experiments/rag20/batches
          if ! git diff --cached --quiet; then
            git commit -m "Store verified 500 additional pilot cases and 670-item catalogue"
            git push origin HEAD:refs/heads/agent/rag-evidence-shards
          fi
