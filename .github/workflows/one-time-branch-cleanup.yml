name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete obsolete agent and backup branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { ...context.repo, per_page: 100 },
            );
            const obsolete = branches
              .map((branch) => branch.name)
              .filter((name) => name.startsWith('agent/') || name.startsWith('backup/'));

            core.info(`Deleting ${obsolete.length} obsolete branch(es): ${obsolete.join(', ')}`);
            for (const name of obsolete) {
              await github.rest.git.deleteRef({
                ...context.repo,
                ref: `heads/${name}`,
              });
              core.info(`Deleted ${name}`);
            }

      - name: Remove one-time cleanup workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-branch-cleanup.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:main
