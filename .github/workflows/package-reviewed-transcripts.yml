name: Package reviewed transcripts

on:
  push:
    branches:
      - fix/release-my-transcription-v2
    paths:
      - .github/workflows/package-reviewed-transcripts.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed transcripts
        run: |
          set -euo pipefail
          for i in 01 02 03; do
            test -s "outputs/release-my/reviewed/txt/${i}.txt"
            test -s "outputs/release-my/reviewed/md/${i}.md"
          done
      - name: Build zip
        run: |
          zip -r reviewed-transcripts.zip outputs/release-my/reviewed
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-transcripts-package
          path: reviewed-transcripts.zip
          if-no-files-found: error
