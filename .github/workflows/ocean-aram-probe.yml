name: Ocean Aram Komeil Roudi media ingest
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocean-aram-probe.yml'
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve Telegram media URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ocean ops/ocean-aram-komeil
          python - <<'PY'
          import html, json, re, urllib.request
          posts=[('1','https://t.me/fintelligence_ir/680?embed=1&mode=tme'),('2','https://t.me/fintelligence_ir/681?embed=1&mode=tme')]
          out=[]
          for part,url in posts:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              text=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
              patterns=[r'<video[^>]+src="([^"]+)"', r'<meta[^>]+property="og:video"[^>]+content="([^"]+)"', r'<meta[^>]+content="([^"]+)"[^>]+property="og:video"']
              media=None
              for pat in patterns:
                  m=re.search(pat,text,re.I)
                  if m:
                      media=html.unescape(m.group(1)); break
              if not media:
                  raise SystemExit(f'No media URL found for part {part}')
              open(f'/tmp/ocean/part{part}.url','w').write(media)
              out.append({'part':int(part),'post':url.split('?')[0],'media_found':True,'media_host':urllib.request.urlparse(media).hostname if hasattr(urllib.request,'urlparse') else media.split('/')[2]})
          open('ops/ocean-aram-komeil/source-manifest.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Download and convert audio
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          for p in 1 2; do
            url=$(cat /tmp/ocean/part${p}.url)
            curl -fL --retry 4 --retry-all-errors "$url" -o /tmp/ocean/part${p}.media
            ffmpeg -y -v error -i /tmp/ocean/part${p}.media -vn -c:a aac -b:a 128k /tmp/ocean/ocean-aram-${p}.m4a
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/ocean/ocean-aram-${p}.m4a > /tmp/ocean/part${p}.duration
          done
          cat /tmp/ocean/part1.duration /tmp/ocean/part2.duration
      - name: Upload to dedicated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='ocean-aram-komeil-roudi'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title 'اقیانوس آرام - دکتر کمیل رودی' --notes 'دو بخش منتشرشده از حضور دکتر کمیل رودی در برنامه اقیانوس آرام شبکه دو؛ منبع: کانال عمومی آکادمی هوش مالی.'
          fi
          gh release upload "$tag" /tmp/ocean/ocean-aram-1.m4a /tmp/ocean/ocean-aram-2.m4a --clobber
      - name: Save manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='ops/ocean-aram-komeil/source-manifest.json'
          data=json.load(open(p,encoding='utf-8'))
          for item in data:
              part=item['part']
              item['asset']=f'ocean-aram-{part}.m4a'
              item['duration_seconds']=float(open(f'/tmp/ocean/part{part}.duration').read().strip())
              item['release_tag']='ocean-aram-komeil-roudi'
          open(p,'w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/ocean-aram-komeil/source-manifest.json
          git commit -m 'Archive Ocean Aram Komeil Roudi audio'
          git pull --rebase origin main
          git push origin HEAD:main
