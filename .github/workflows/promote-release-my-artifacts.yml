name: Promote release my artifacts to branch

on:
  push:
    branches:
      - fix/release-my-transcription-v2
    paths:
      - .github/workflows/promote-release-my-artifacts.yml

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-my-transcription-v2

      - name: Download verified collected transcripts
        uses: actions/download-artifact@v4
        with:
          name: release-my-collected
          path: /tmp/release-my-collected
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32597819262

      - name: Replace repository output with verified bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs/release-my
          mkdir -p outputs/release-my
          cp -a /tmp/release-my-collected/. outputs/release-my/
          test -s outputs/release-my/raw/txt/01.txt
          test -s outputs/release-my/raw/txt/02.txt
          test -s outputs/release-my/raw/txt/03.txt
          test -s outputs/release-my/raw/md/01.md
          test -s outputs/release-my/raw/md/02.md
          test -s outputs/release-my/raw/md/03.md
          test -s outputs/release-my/raw/json/01.json
          test -s outputs/release-my/raw/json/02.json
          test -s outputs/release-my/raw/json/03.json
          ls -lah outputs/release-my/raw/txt

      - name: Commit verified transcripts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/release-my
          if git diff --cached --quiet; then
            echo "Verified bundle already committed"
            exit 0
          fi
          git commit -m "Store verified release my transcripts"
          git push origin HEAD:fix/release-my-transcription-v2
