name: Actions retention cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  actions: write

concurrency:
  group: actions-retention-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prune excess completed workflow runs
        uses: actions/github-script@v7
        env:
          KEEP_RECENT_COMPLETED: '30'
          MIN_AGE_HOURS: '2'
          MAX_DELETES_PER_RUN: '300'
        with:
          retries: 3
          script: |
            const keepRecent = Number(process.env.KEEP_RECENT_COMPLETED || '30');
            const minAgeMs = Number(process.env.MIN_AGE_HOURS || '2') * 60 * 60 * 1000;
            const maxDeletes = Number(process.env.MAX_DELETES_PER_RUN || '300');
            const protectedIds = new Set();
            protectedIds.add(Number(context.runId));

            const runsBefore = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { ...context.repo, per_page: 100 },
            );
            const completed = runsBefore
              .filter((run) => run.status === 'completed')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const active = runsBefore.filter((run) => run.status !== 'completed');
            const recentIds = new Set(completed.slice(0, keepRecent).map((run) => run.id));
            const now = Date.now();
            const candidates = completed.filter((run) => {
              if (protectedIds.has(run.id) || recentIds.has(run.id)) return false;
              const created = new Date(run.created_at).getTime();
              return Number.isFinite(created) && now - created >= minAgeMs;
            });

            let deleted = 0;
            const failures = [];
            for (const run of candidates.slice(0, maxDeletes)) {
              try {
                await github.rest.actions.deleteWorkflowRun({ ...context.repo, run_id: run.id });
                deleted += 1;
              } catch (error) {
                if (error.status === 404) deleted += 1;
                else failures.push({ id: run.id, status: error.status || null, message: String(error.message || error) });
              }
            }

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { ...context.repo, per_page: 100 },
            );
            const liveArtifacts = artifacts.filter((artifact) => !artifact.expired);
            const liveBytes = liveArtifacts.reduce((sum, artifact) => sum + Number(artifact.size_in_bytes || 0), 0);
            const runsAfter = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { ...context.repo, per_page: 100 },
            );

            const status = {
              updated_at_utc: new Date().toISOString(),
              cleanup_run_id: Number(context.runId),
              visible_runs_before: runsBefore.length,
              visible_runs_after: runsAfter.length,
              active_runs_preserved: active.length,
              completed_runs_deleted: deleted,
              failures,
              keep_recent_completed: keepRecent,
              min_age_hours: Number(process.env.MIN_AGE_HOURS || '2'),
              live_artifact_count: liveArtifacts.length,
              live_artifact_bytes: liveBytes,
            };

            core.info(`ACTIONS_RETENTION_STATUS=${JSON.stringify(status)}`);
            await core.summary
              .addHeading('Actions retention cleanup')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Runs before', String(status.visible_runs_before)],
                ['Runs after', String(status.visible_runs_after)],
                ['Runs deleted', String(status.completed_runs_deleted)],
                ['Live artifacts', String(status.live_artifact_count)],
                ['Live artifact bytes', String(status.live_artifact_bytes)],
              ])
              .write();

            if (failures.length) core.setFailed(`Failed to delete ${failures.length} workflow run(s)`);
