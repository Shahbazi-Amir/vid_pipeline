name: Temporary diarization regression fix

on:
  push:
    paths:
      - .github/workflows/fix-diarization-speaker-evidence.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch mixed alignment boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/vid_pipeline/diarization.py')
          text = path.read_text(encoding='utf-8')
          old = '''                if rows and rows[-1]["speaker"] == speaker and row["start"] - rows[-1]["end"] <= merge_gap:\n'''
          new = '''                if (\n                    rows\n                    and "speaker_evidence" in rows[-1]\n                    and rows[-1]["speaker"] == speaker\n                    and row["start"] - rows[-1]["end"] <= merge_gap\n                ):\n'''
          if old not in text:
              raise SystemExit('target diarization merge condition not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_diarization.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '\n\ndef _speaker_switches'  # not present in tests; just guard against duplicate below
          test_name = 'test_align_segments_does_not_merge_word_row_into_stale_text_row'
          if test_name not in tests:
              addition = r'''


def test_align_segments_does_not_merge_word_row_into_stale_text_row():
    turns = [SpeakerTurn(0.0, 2.0, "SPEAKER_00")]
    segments = [
        {
            "start": 0.0,
            "end": 1.0,
            "text": "متن اصلاح‌شده",
            "words": [
                {"start": 0.0, "end": 0.4, "word": " متن"},
                {"start": 0.4, "end": 0.8, "word": " قدیمی"},
            ],
        },
        {
            "start": 1.0,
            "end": 1.4,
            "text": "ادامه",
            "words": [{"start": 1.0, "end": 1.4, "word": " ادامه"}],
        },
    ]

    aligned, ambiguous = align_segments(segments, turns)

    assert ambiguous == 0
    assert len(aligned) == 2
    assert aligned[0]["text"] == "متن اصلاح‌شده"
    assert "speaker_evidence" not in aligned[0]
    assert aligned[1]["text"] == "ادامه"
    assert aligned[1]["speaker"] == "SPEAKER_00"
    assert aligned[1]["speaker_evidence"]["speaker"] == "SPEAKER_00"
'''
              test_path.write_text(tests + addition, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Run regression tests
        run: |
          ruff check src/vid_pipeline/diarization.py tests/test_diarization.py
          pytest -q tests/test_diarization.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vid_pipeline/diarization.py tests/test_diarization.py
          git commit -m "fix: handle mixed diarization alignment rows"
          git push origin HEAD:main
