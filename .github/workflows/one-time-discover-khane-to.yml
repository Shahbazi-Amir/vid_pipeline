name: One-time discover Khane To

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/trigger-khane-to-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover exactly 13 Khane To episodes from Fintelligence tag list
        shell: bash
        env:
          SOURCE_TAG_URL: https://www.fintelligence.ir/BlogTag/Detail/2042/%D8%A8%D8%B1%D9%86%D8%A7%D9%85%D9%87-%D8%AA%D9%84%D9%88%DB%8C%D8%B2%DB%8C%D9%88%D9%86%DB%8C-%D8%AE%D8%A7%D9%86%D9%87-%D8%AA%D9%88
          LIST_URL: https://www.fintelligence.ir/Blog/List?t=2042
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import os
          import re
          import ssl
          import urllib.parse
          import urllib.request
          from collections import deque
          from pathlib import Path

          SOURCE_TAG_URL=os.environ['SOURCE_TAG_URL']
          LIST_URL=os.environ['LIST_URL']
          EXPECTED=13
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36'

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Accept-Language':'fa,en;q=0.8','Referer':'https://www.fintelligence.ir/'})
              with urllib.request.urlopen(req,timeout=25,context=ssl.create_default_context()) as r:
                  raw=r.read(); charset=r.headers.get_content_charset() or 'utf-8'
              return raw.decode(charset,errors='replace')

          def clean_text(raw):
              s=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
              s=re.sub(r'<style\b[^>]*>.*?</style>',' ',s,flags=re.I|re.S)
              s=re.sub(r'<[^>]+>',' ',s)
              return re.sub(r'\s+',' ',html.unescape(s)).strip()

          def page_title(raw):
              for pat in (r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)',r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:title["\']',r'<h1[^>]*>(.*?)</h1>',r'<title[^>]*>(.*?)</title>'):
                  m=re.search(pat,raw,flags=re.I|re.S)
                  if m: return clean_text(m.group(1))
              return ''

          def hrefs(raw,base):
              out=[]
              for m in re.finditer(r'(?:href|src|data-src)\s*=\s*["\']([^"\']+)["\']',raw,flags=re.I):
                  v=html.unescape(m.group(1).strip()).replace('\\/','/')
                  if not v or v.startswith(('#','javascript:','mailto:','tel:')): continue
                  out.append(urllib.parse.urljoin(base,v))
              return out

          def media_urls(raw):
              text=html.unescape(raw).replace('\\/','/')
              found=[]
              patterns=[
                  r'(?:https?:)?//(?:www\.)?aparat\.com/v/([A-Za-z0-9]+)',
                  r'(?:https?:)?//(?:www\.)?aparat\.com/video/video/embed/videohash/([A-Za-z0-9]+)',
                  r'(?:https?:)?//(?:www\.)?aparat\.com/video/video/embed/vt/frame/([A-Za-z0-9]+)',
              ]
              for pat in patterns:
                  for m in re.finditer(pat,text,flags=re.I):
                      uid=m.group(1); found.append((f'https://www.aparat.com/v/{uid}',uid,'Aparat'))
              for m in re.finditer(r'https?://[^\s"\'<>]+\.(?:mp4|m4v|webm|mp3|m4a)(?:\?[^\s"\'<>]*)?',text,flags=re.I):
                  found.append((m.group(0),'','direct'))
              out=[]; seen=set()
              for row in found:
                  if row[0] not in seen: seen.add(row[0]); out.append(row)
              return out

          def episode_number(text):
              trans=str.maketrans('۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩','01234567890123456789')
              t=text.translate(trans)
              m=re.search(r'(?:قسمت|بخش|اپیزود)\s*[-:]*\s*(\d{1,2})',t)
              return int(m.group(1)) if m else None

          host=urllib.parse.urlsplit(LIST_URL).netloc.lower().removeprefix('www.')
          queue=deque([LIST_URL]); seen_lists=set(); articles=[]; seen_articles=set(); list_debug=[]
          while queue and len(seen_lists)<10:
              u=queue.popleft()
              if u in seen_lists: continue
              seen_lists.add(u)
              try: raw=fetch(u)
              except Exception as exc:
                  list_debug.append({'url':u,'error':f'{type(exc).__name__}: {exc}'}); continue
              links=hrefs(raw,u)
              detail_count=0
              for link in links:
                  p=urllib.parse.urlsplit(link); h=p.netloc.lower().removeprefix('www.')
                  if h!=host: continue
                  path=p.path.lower()
                  if '/blog/detail/' in path:
                      norm=urllib.parse.urlunsplit((p.scheme or 'https',p.netloc,p.path,p.query,''))
                      if norm not in seen_articles: seen_articles.add(norm); articles.append(norm); detail_count+=1
                  elif path.rstrip('/').endswith('/blog/list') and ('t=2042' in p.query.lower() or link==LIST_URL):
                      norm=urllib.parse.urlunsplit((p.scheme or 'https',p.netloc,p.path,p.query,''))
                      if norm not in seen_lists: queue.append(norm)
              list_debug.append({'url':u,'html_bytes':len(raw.encode("utf-8")),'detail_links_added':detail_count,'link_count':len(links),'snippets':[clean_text(x)[:300] for x in re.findall(r'.{0,120}2042.{0,180}',raw,flags=re.I|re.S)[:5]]})

          diagnostics={'source_tag_url':SOURCE_TAG_URL,'list_url':LIST_URL,'list_pages':list_debug,'candidate_article_count':len(articles),'articles':[]}
          rows=[]
          for idx,u in enumerate(articles):
              try: raw=fetch(u)
              except Exception as exc:
                  diagnostics['articles'].append({'url':u,'error':f'{type(exc).__name__}: {exc}'}); continue
              title=page_title(raw); text=clean_text(raw); media=media_urls(raw)
              has_rudi=('رودی' in text or 'کمیل' in text)
              diagnostics['articles'].append({'url':u,'title':title,'has_rudi':has_rudi,'media_count':len(media),'text_prefix':text[:240]})
              for url,uid,platform in media:
                  rows.append({'article_url':u,'title':title,'url':url,'uid':uid,'platform':platform,'order':idx,'has_rudi':has_rudi})

          unique=[]; seen_media=set()
          for r in rows:
              if r['url'] not in seen_media: seen_media.add(r['url']); unique.append(r)
          rudi=[r for r in unique if r.get('has_rudi')]
          selected=rudi if len(rudi)==EXPECTED else unique
          diagnostics.update({'unique_media_count':len(unique),'rudi_media_count':len(rudi),'selected_media_count':len(selected)})

          explicit=[episode_number((r.get('title') or '')+' '+(r.get('article_url') or '')) for r in selected]
          if len(selected)==EXPECTED and set(x for x in explicit if x is not None)==set(range(1,EXPECTED+1)):
              numbers=explicit
          else:
              numbers=list(range(1,len(selected)+1))
          videos=[]
          for number,row in sorted(zip(numbers,selected),key=lambda x:x[0]):
              videos.append({'result_number':number,'uid':row.get('uid',''),'url':row['url'],'title':row.get('title') or f'خانه تو | قسمت {number}','article_url':row.get('article_url',''),'platform':row.get('platform','')})
          complete=(len(videos)==EXPECTED and [v['result_number'] for v in videos]==list(range(1,EXPECTED+1)))
          manifest={'program':'خانه تو','guest':'دکتر کمیل رودی','source_tag_url':SOURCE_TAG_URL,'list_url':LIST_URL,'expected':EXPECTED,'discovered':len(videos),'complete':complete,'videos':videos}
          src=Path('sources/khane_to'); src.mkdir(parents=True,exist_ok=True); Path('benchmarks').mkdir(exist_ok=True)
          (src/'fintelligence_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=['# خانه تو','',f'- Source: {SOURCE_TAG_URL}',f'- List: {LIST_URL}',f'- Expected: {EXPECTED}',f'- Discovered: {len(videos)}',f'- Complete: {str(complete).lower()}','']
          lines += [f"{v['result_number']}. [{v['title']}]({v['url']})" for v in videos]
          (src/'links.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          diagnostics['complete']=complete
          Path('benchmarks/private-khane-to-discovery.json').write_text(json.dumps(diagnostics,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False))
          PY
      - name: Publish discovery evidence to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/khane_to benchmarks/private-khane-to-discovery.json
          git commit -m 'data: discover Khane To episodes' || true
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
      - name: Fail closed unless exactly 13 episodes were found
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('sources/khane_to/fintelligence_manifest.json').read_text(encoding='utf-8'))
          if data.get('complete') is not True or data.get('discovered') != 13:
              raise SystemExit(f"Khane To discovery incomplete: {data.get('discovered')} / 13")
          print('Khane To discovery PASS: exactly 13 episodes')
          PY
