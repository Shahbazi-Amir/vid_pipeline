name: Validate Collection Output Only

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/validate-collection-output-only.trigger"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Validate and record
        shell: bash
        run: |
          set +e
          pytest -q
          pytest_rc=$?
          ruff check .
          ruff_rc=$?
          python -m compileall -q src tests
          compile_rc=$?
          git diff --check
          diff_rc=$?
          python - "$pytest_rc" "$ruff_rc" "$compile_rc" "$diff_rc" <<'PY'
          import json
          import sys
          from pathlib import Path

          names = ["pytest", "ruff", "compileall", "diff_check"]
          values = [int(value) for value in sys.argv[1:]]
          report = {name: "pass" if value == 0 else "fail" for name, value in zip(names, values)}
          report["status"] = "success" if all(value == 0 for value in values) else "failure"
          Path("validation").mkdir(exist_ok=True)
          Path("validation/collection-output-validation.json").write_text(
              json.dumps(report, separators=(",", ":")) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/collection-output-validation.json
          git commit -m "test: validate collection output mode" || true
          git push origin HEAD:main
          test "$pytest_rc" -eq 0
          test "$ruff_rc" -eq 0
          test "$compile_rc" -eq 0
          test "$diff_rc" -eq 0
