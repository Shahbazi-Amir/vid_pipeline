name: Actions old run history cleanup
run-name: Actions old run history cleanup

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/actions-storage-cleanup
    paths:
      - ".github/bootstrap/actions-storage-audit.trigger"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete completed workflow runs before cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          CURRENT_CLEANUP_RUN: ${{ github.run_id }}
          PROTECTED_PRODUCTION_RUN: "31348536690"
          OLD_CUTOFF_UTC: "2026-08-10T00:00:00Z"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request
          from datetime import datetime

          repo = os.environ['REPOSITORY']
          ref_name = os.environ['REF_NAME']
          token = os.environ['GH_TOKEN']
          current_cleanup_run = int(os.environ['CURRENT_CLEANUP_RUN'])
          protected_run = int(os.environ['PROTECTED_PRODUCTION_RUN'])
          cutoff = datetime.fromisoformat(os.environ['OLD_CUTOFF_UTC'].replace('Z', '+00:00'))
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'vid-pipeline-actions-run-history-cleanup',
          }

          def api_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def list_runs():
              rows, page = [], 1
              while True:
                  payload = api_json(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}')
                  batch = payload.get('workflow_runs') or []
                  if not batch:
                      break
                  rows.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return rows

          def dt(row):
              return datetime.fromisoformat(str(row.get('created_at') or '1970-01-01T00:00:00Z').replace('Z', '+00:00'))

          before = list_runs()
          candidates = [
              row for row in before
              if str(row.get('status') or '') == 'completed'
              and dt(row) < cutoff
              and int(row.get('id') or 0) not in {protected_run, current_cleanup_run}
          ]
          candidates.sort(key=dt)
          deleted, failures = [], []

          for row in candidates:
              run_id = int(row.get('id') or 0)
              if run_id <= 0:
                  failures.append({'id': run_id, 'error': 'invalid_id'})
                  continue
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers=headers,
                  method='DELETE',
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = int(getattr(response, 'status', 204) or 204)
                  if status == 204:
                      deleted.append({'id': run_id, 'name': row.get('name'), 'created_at': row.get('created_at'), 'conclusion': row.get('conclusion')})
                  else:
                      failures.append({'id': run_id, 'error': f'http_{status}'})
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      deleted.append({'id': run_id, 'name': row.get('name'), 'created_at': row.get('created_at'), 'conclusion': row.get('conclusion'), 'already_gone': True})
                  else:
                      failures.append({'id': run_id, 'error': f'http_{exc.code}'})
              time.sleep(0.03)

          after = list_runs()
          remaining = [
              row for row in after
              if str(row.get('status') or '') == 'completed'
              and dt(row) < cutoff
              and int(row.get('id') or 0) not in {protected_run, current_cleanup_run}
          ]
          report = {
              'schema_version': 1,
              'repository': repo,
              'cutoff_utc': cutoff.isoformat(),
              'protected_production_run': protected_run,
              'cleanup_run': current_cleanup_run,
              'before_run_count': len(before),
              'candidate_count': len(candidates),
              'deleted_count': len(deleted),
              'failure_count': len(failures),
              'failures': failures,
              'after_run_count': len(after),
              'remaining_old_completed_count': len(remaining),
              'deleted': deleted,
          }
          print(json.dumps({k: report[k] for k in report if k != 'deleted'}, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(
                  '# Actions run history cleanup\n\n'
                  f"Before: **{len(before)}**\n\n"
                  f"Candidates: **{len(candidates)}**\n\n"
                  f"Deleted: **{len(deleted)}**\n\n"
                  f"After: **{len(after)}**\n\n"
                  f"Remaining old completed: **{len(remaining)}**\n\n"
                  f"Failures: **{len(failures)}**\n"
              )

          path = 'benchmarks/actions-run-history-cleanup.json'
          url = f'https://api.github.com/repos/{repo}/contents/{path}'
          existing_sha = None
          try:
              req = urllib.request.Request(url + '?ref=' + urllib.parse.quote(ref_name, safe=''), headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  existing_sha = json.load(response).get('sha')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          body = {
              'message': 'chore: record Actions run history cleanup',
              'content': base64.b64encode((json.dumps(report, ensure_ascii=False, indent=2) + '\n').encode()).decode(),
              'branch': ref_name,
          }
          if existing_sha:
              body['sha'] = existing_sha
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(req, timeout=30) as response:
              saved = json.load(response)
          print('CLEANUP_REPORT_COMMIT=' + str((saved.get('commit') or {}).get('sha') or ''))
          if failures or remaining:
              raise SystemExit(f'cleanup incomplete: failures={len(failures)} remaining={len(remaining)}')
          PY
