name: Organize current outputs once
run-name: Organize current outputs ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/organize-current-outputs-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-current-outputs-once
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build canonical output views
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, shutil
          from pathlib import Path

          outputs = Path('outputs')
          finalized_root = outputs / 'finalized'
          ready_root = outputs / 'review-ready'
          managed = {
              'chehelstoun', 'voice-260817-165035', 'ketab-baz',
              'finup', 'bankmellatt', 'mizan'
          }

          for root in (finalized_root, ready_root):
              if root.exists():
                  shutil.rmtree(root)
              root.mkdir(parents=True, exist_ok=True)

          finalized = []
          review_ready = []

          def in_scope(base: Path) -> bool:
              try:
                  rel = base.relative_to(outputs)
              except ValueError:
                  return False
              return bool(rel.parts) and rel.parts[0] in managed

          def copy_if(src: Path, dst: Path):
              if src.is_file():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  return True
              return False

          # Finalized = explicit ChatGPT/human review evidence + promoted final transcript.
          for final_md in sorted(outputs.glob('**/final/transcript.final.md')):
              if 'finalized' in final_md.parts or 'review-ready' in final_md.parts:
                  continue
              base = final_md.parent.parent
              if not in_scope(base):
                  continue
              corrections = base / 'review/chatgpt-corrections.json'
              verification = base / 'human/verification.json'
              final_txt = base / 'final/transcript.final.txt'
              if not final_txt.is_file() or not (corrections.is_file() or verification.is_file()):
                  continue
              rel = base.relative_to(outputs)
              dest = finalized_root / rel
              dest.mkdir(parents=True, exist_ok=True)
              copy_if(final_md, dest / 'transcript.md')
              copy_if(final_txt, dest / 'transcript.txt')
              copy_if(base / 'delivery/transcript.timestamped.md', dest / 'transcript.timestamped.md')
              copy_if(corrections, dest / 'review/chatgpt-corrections.json')
              copy_if(verification, dest / 'review/verification.json')
              copy_if(base / 'source.json', dest / 'source.json')
              copy_if(base / 'metadata.json', dest / 'metadata.json')
              finalized.append(str(rel))

          # Review-ready = ASR + assistant review package exists, but no explicit final review evidence.
          for package in sorted(outputs.glob('**/review/assistant-review-package.json')):
              if 'finalized' in package.parts or 'review-ready' in package.parts:
                  continue
              base = package.parent.parent
              if not in_scope(base):
                  continue
              corrections = base / 'review/chatgpt-corrections.json'
              verification = base / 'human/verification.json'
              if corrections.is_file() or verification.is_file():
                  continue
              if not (base / 'delivery/transcript.txt').is_file():
                  continue
              rel = base.relative_to(outputs)
              dest = ready_root / rel
              dest.mkdir(parents=True, exist_ok=True)
              copy_if(base / 'delivery/transcript.md', dest / 'transcript.md')
              copy_if(base / 'delivery/transcript.txt', dest / 'transcript.txt')
              copy_if(base / 'delivery/transcript.timestamped.md', dest / 'transcript.timestamped.md')
              copy_if(package, dest / 'review/assistant-review-package.json')
              copy_if(base / 'source.json', dest / 'source.json')
              copy_if(base / 'metadata.json', dest / 'metadata.json')
              review_ready.append(str(rel))

          status = {
              'schema_version': 1,
              'canonical_paths': {
                  'finalized': 'outputs/finalized',
                  'review_ready': 'outputs/review-ready'
              },
              'finalized_count': len(finalized),
              'review_ready_count': len(review_ready),
              'finalized': finalized,
              'review_ready': review_ready,
          }
          (outputs / 'canonical-status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          readme = '''# Canonical outputs\n\nبرای استفاده روزمره فقط این دو مسیر را نگاه کنید:\n\n- `outputs/finalized/` — فقط خروجی‌هایی که Review واقعی شده‌اند و Final transcript دارند.\n- `outputs/review-ready/` — پردازش و Review Package کامل است، ولی Review نهایی هنوز انجام نشده.\n\nمسیرهای قدیمی هر Collection برای Audit/Resume نگه داشته شده‌اند و حذف نشده‌اند.\nمرجع وضعیت ماشینی: `outputs/canonical-status.json`.\n'''
          (outputs / 'README.md').write_text(readme, encoding='utf-8')
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Commit organized outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/finalized outputs/review-ready outputs/canonical-status.json outputs/README.md
          if git diff --cached --quiet; then
            echo 'No canonical output changes.'
            exit 0
          fi
          git commit -m 'Organize canonical finalized and review-ready outputs'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
