name: One-time apply audio plumbing

on:
  push:
    paths:
      - '.github/audio-plumbing.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-integration-main
          fetch-depth: 0

      - name: Apply fail-closed audio plumbing patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch context, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched {path}")

          # CLI: expose audio profiles across local, online, and GitHub commands.
          replace(
              "src/vid_pipeline/cli.py",
              "from vid_pipeline.errors import PipelineError\nfrom vid_pipeline.profiles import DEFAULT_PROFILE, resolve_transcription_model\n",
              "from vid_pipeline.errors import PipelineError\nfrom vid_pipeline.media import MEDIA_EXTENSIONS as _MEDIA_EXTENSIONS\nfrom vid_pipeline.profiles import DEFAULT_PROFILE, resolve_transcription_model\n",
          )
          replace(
              "src/vid_pipeline/cli.py",
              '    parser.add_argument("--hotwords", default="")\n',
              '    parser.add_argument("--hotwords", default="")\n    parser.add_argument("--audio-profile", choices=("none", "safe", "noisy"), default="safe")\n',
          )
          replace(
              "src/vid_pipeline/cli.py",
              '    parser.add_argument("--language", default="fa")\n    parser.add_argument("--no-editorial", action="store_true")\n\n\ndef _add_github_options',
              '    parser.add_argument("--language", default="fa")\n    parser.add_argument("--no-editorial", action="store_true")\n    parser.add_argument("--audio-profile", choices=("none", "safe", "noisy"), default="safe")\n\n\ndef _add_github_options',
          )
          replace(
              "src/vid_pipeline/cli.py",
              '    parser.add_argument("--language", default="fa")\n    parser.add_argument("--keep-debug-artifacts", action="store_true")\n',
              '    parser.add_argument("--language", default="fa")\n    parser.add_argument("--audio-profile", choices=("none", "safe", "noisy"), default="safe")\n    parser.add_argument("--keep-debug-artifacts", action="store_true")\n',
          )
          replace(
              "src/vid_pipeline/cli.py",
              '    folder_parser.add_argument("--language", default="fa")\n    folder_parser.add_argument("--editorial-model",',
              '    folder_parser.add_argument("--language", default="fa")\n    folder_parser.add_argument("--audio-profile", choices=("none", "safe", "noisy"), default="safe")\n    folder_parser.add_argument("--editorial-model",',
          )
          replace(
              "src/vid_pipeline/cli.py",
              '    pipeline = VideoPipeline(args.url, args.output_root, args.name)\n',
              '    pipeline = VideoPipeline(args.url, args.output_root, args.name, args.audio_profile)\n',
          )
          replace(
              "src/vid_pipeline/cli.py",
              '    pipeline = LocalMediaPipeline(args.path, args.output_root, args.name)\n',
              '    pipeline = LocalMediaPipeline(args.path, args.output_root, args.name, args.audio_profile)\n',
          )
          replace(
              "src/vid_pipeline/cli.py",
              '_MEDIA_EXTENSIONS = {\n    ".mp4", ".mkv", ".mov", ".webm", ".m4v", ".avi",\n    ".mp3", ".wav", ".m4a", ".flac", ".ogg",\n}\n\n\n',
              '',
          )
          replace(
              "src/vid_pipeline/cli.py",
              '        "force": args.force,\n    }\n\n\ndef _finish_online',
              '        "force": args.force,\n        "audio_profile": args.audio_profile,\n    }\n\n\ndef _finish_online',
          )
          replace(
              "src/vid_pipeline/cli.py",
              '        "no_editorial": args.no_editorial,\n        "keep_debug_artifacts":',
              '        "no_editorial": args.no_editorial,\n        "audio_profile": args.audio_profile,\n        "keep_debug_artifacts":',
          )

          # Standalone: validate arbitrary media, carry profile, and checkpoint quality report.
          replace(
              "src/vid_pipeline/standalone.py",
              '    def audio(self) -> Path:\n        return self.job_root / "audio" / "audio-16k-mono.wav"\n\n    @property\n    def raw_json',
              '    def audio(self) -> Path:\n        return self.job_root / "audio" / "audio-16k-mono.wav"\n\n    @property\n    def audio_quality(self) -> Path:\n        return self.job_root / "audio" / "audio-quality.json"\n\n    @property\n    def raw_json',
          )
          replace(
              "src/vid_pipeline/standalone.py",
              '    def __init__(self, url: str, output_root: str | Path = "outputs", name: str = "") -> None:\n        self.url = url\n        self.job_id = make_job_id(url, name)\n        self.paths = VideoJobPaths(Path(output_root), self.job_id)\n        self.paths.ensure()\n        self.state = PipelineState(self.paths.state)\n        self.metadata: dict[str, Any] = {}\n',
              '    def __init__(\n        self,\n        url: str,\n        output_root: str | Path = "outputs",\n        name: str = "",\n        audio_profile: str = "safe",\n    ) -> None:\n        self.url = url\n        self.job_id = make_job_id(url, name)\n        self.paths = VideoJobPaths(Path(output_root), self.job_id)\n        self.paths.ensure()\n        self.state = PipelineState(self.paths.state)\n        self.audio_profile = audio_profile\n        self.metadata: dict[str, Any] = {}\n',
          )
          replace(
              "src/vid_pipeline/standalone.py",
              '        def action() -> tuple[list[Path], dict[str, Any]]:\n            video, metadata = download_video(self.url, self.paths.video_dir)\n            return [video, self.paths.video_metadata], {\n                "video_path": str(video),\n                "duration": metadata.get("duration"),\n            }\n\n        return self._run_stage("download", action, force=force)\n',
              '        def action() -> tuple[list[Path], dict[str, Any]]:\n            from vid_pipeline.media import require_decodable_audio\n\n            media_path, metadata = download_video(self.url, self.paths.video_dir)\n            media = require_decodable_audio(media_path)\n            if self.paths.source_metadata.exists():\n                source = json.loads(self.paths.source_metadata.read_text(encoding="utf-8"))\n                source["input_type"] = media["input_type"]\n                source["media"] = media\n                self.paths.source_metadata.write_text(\n                    json.dumps(source, ensure_ascii=False, indent=2) + "\\n",\n                    encoding="utf-8",\n                )\n                self.metadata = source\n            return [media_path, self.paths.video_metadata], {\n                "media_path": str(media_path),\n                "video_path": str(media_path),\n                "input_type": media["input_type"],\n                "duration": metadata.get("duration"),\n            }\n\n        return self._run_stage("download", action, force=force)\n',
          )
          replace(
              "src/vid_pipeline/standalone.py",
              '            normalized = normalize_audio(self._downloaded_video(), self.paths.audio, overwrite=force)\n            normalize_seconds = time.monotonic() - normalize_started\n            probe_started = time.monotonic()\n            probe = validate_normalized_audio(normalized)\n            probe_seconds = time.monotonic() - probe_started\n            return [normalized], {\n                "probe": probe,\n                "normalize_seconds": round(normalize_seconds, 6),\n                "ffprobe_seconds": round(probe_seconds, 6),\n            }\n',
              '            normalized = normalize_audio(\n                self._downloaded_video(),\n                self.paths.audio,\n                overwrite=force,\n                profile=self.audio_profile,\n                quality_path=self.paths.audio_quality,\n            )\n            normalize_seconds = time.monotonic() - normalize_started\n            probe_started = time.monotonic()\n            probe = validate_normalized_audio(normalized)\n            probe_seconds = time.monotonic() - probe_started\n            return [normalized, self.paths.audio_quality], {\n                "probe": probe,\n                "audio_profile": self.audio_profile,\n                "normalize_seconds": round(normalize_seconds, 6),\n                "ffprobe_seconds": round(probe_seconds, 6),\n            }\n',
          )
          replace(
              "src/vid_pipeline/standalone.py",
              '    def __init__(\n        self, media_path: str | Path, output_root: str | Path = "outputs", name: str = ""\n    ) -> None:\n',
              '    def __init__(\n        self,\n        media_path: str | Path,\n        output_root: str | Path = "outputs",\n        name: str = "",\n        audio_profile: str = "safe",\n    ) -> None:\n',
          )
          replace(
              "src/vid_pipeline/standalone.py",
              '        self.state = PipelineState(self.paths.state)\n        self.metadata = {}\n        if self.paths.source_metadata.exists():\n',
              '        self.state = PipelineState(self.paths.state)\n        self.audio_profile = audio_profile\n        self.metadata = {}\n        if self.paths.source_metadata.exists():\n',
          )
          replace(
              "src/vid_pipeline/standalone.py",
              '        def action() -> tuple[list[Path], dict[str, Any]]:\n            payload = {\n                "schema_version": 2,\n                "job_id": self.job_id,\n                "input_type": "file",\n                "path": str(self.media_path),\n                "title": self.media_path.stem,\n                "size": self.media_path.stat().st_size,\n                "sha256": _sha256_file(self.media_path),\n            }\n',
              '        def action() -> tuple[list[Path], dict[str, Any]]:\n            from vid_pipeline.media import require_decodable_audio\n\n            media = require_decodable_audio(self.media_path)\n            payload = {\n                "schema_version": 2,\n                "job_id": self.job_id,\n                "input_type": media["input_type"],\n                "path": str(self.media_path),\n                "title": self.media_path.stem,\n                "size": self.media_path.stat().st_size,\n                "sha256": _sha256_file(self.media_path),\n                "media": media,\n            }\n',
          )

          # Online API/client/worker plumbing.
          replace(
              "src/vid_pipeline/online_client.py",
              'MEDIA_EXTENSIONS = {\n    ".avi", ".flac", ".m4a", ".m4v", ".mkv", ".mov", ".mp3",\n    ".mp4", ".ogg", ".wav", ".webm",\n}\n',
              'MEDIA_EXTENSIONS = {\n    ".aac", ".ac3", ".aif", ".aiff", ".alac", ".amr", ".avi", ".caf",\n    ".flac", ".m4a", ".m4v", ".mkv", ".mov", ".mp3", ".mp4", ".ogg",\n    ".opus", ".wav", ".webm", ".wma",\n}\n',
          )
          replace(
              "src/vid_pipeline/online_client.py",
              '        force: bool = False,\n    ) -> ClientRecord:\n',
              '        force: bool = False,\n        audio_profile: str = "safe",\n    ) -> ClientRecord:\n',
          )
          replace(
              "src/vid_pipeline/online_client.py",
              '                "language": language, "editorial": editorial,\n            }).json()\n',
              '                "language": language, "editorial": editorial,\n                "audio_profile": audio_profile,\n            }).json()\n',
          )
          replace(
              "src/vid_pipeline/server/api.py",
              '            "language": payload.get("language", "fa"),\n            "review_settings":',
              '            "language": payload.get("language", "fa"),\n            "audio_profile": payload.get("audio_profile", "safe"),\n            "review_settings":',
          )
          replace(
              "src/vid_pipeline/server/worker.py",
              '        audio = normalize_audio(media, work / "audio.wav", overwrite=True)\n',
              '        audio = normalize_audio(\n            media, work / "audio.wav", overwrite=True,\n            profile=job.get("audio_profile", "safe"),\n        )\n',
          )

          # GitHub upload dispatch: one additional bounded input.
          replace(
              "src/vid_pipeline/github_client.py",
              '            "no_editorial": str(options.get("no_editorial", True)).lower(),\n            "keep_debug_artifacts":',
              '            "no_editorial": str(options.get("no_editorial", True)).lower(),\n            "audio_profile": options.get("audio_profile", "safe"),\n            "keep_debug_artifacts":',
          )

          # Uploaded-file workflow: preserve lean success artifact; only add profile input/plumbing.
          replace(
              ".github/workflows/process-uploaded-video.yml",
              '      no_editorial:\n        required: true\n        default: "true"\n        type: string\n      keep_debug_artifacts:',
              '      no_editorial:\n        required: true\n        default: "true"\n        type: string\n      audio_profile:\n        required: true\n        default: safe\n        type: choice\n        options: [none, safe, noisy]\n      keep_debug_artifacts:',
          )
          replace(
              ".github/workflows/process-uploaded-video.yml",
              '      NO_EDITORIAL: ${{ inputs.no_editorial }}\n      DIARIZATION_ENABLED:',
              '      NO_EDITORIAL: ${{ inputs.no_editorial }}\n      AUDIO_PROFILE: ${{ inputs.audio_profile }}\n      DIARIZATION_ENABLED:',
          )
          replace(
              ".github/workflows/process-uploaded-video.yml",
              '            --profile "$PROFILE" --language "$LANGUAGE" \\\n            --device cpu --compute-type int8)\n',
              '            --profile "$PROFILE" --language "$LANGUAGE" \\\n            --device cpu --compute-type int8 --audio-profile "$AUDIO_PROFILE")\n',
          )

          # URL workflow: add correlation and audio options while preserving lean artifacts.
          replace(
              ".github/workflows/process-video.yml",
              'run-name: Video URL ${{ inputs.request_id || github.run_id }} — ${{ inputs.url || github.event_name }}\n',
              'run-name: Video URL ${{ inputs.request_id || github.run_id }} — attempt ${{ inputs.dispatch_id || github.run_attempt }}\n',
          )
          replace(
              ".github/workflows/process-video.yml",
              '      request_id:\n        description: Optional client request identifier\n        required: false\n        type: string\n      url:',
              '      request_id:\n        description: Optional client request identifier\n        required: false\n        type: string\n      dispatch_id:\n        description: Optional client dispatch correlation identifier\n        required: false\n        type: string\n      url:',
          )
          replace(
              ".github/workflows/process-video.yml",
              '      profile:\n        description: ASR quality profile used when whisper_model is empty\n        required: true\n        default: balanced\n        type: choice\n        options: [fast, balanced, accurate]\n      editorial_model:',
              '      profile:\n        description: ASR quality profile used when whisper_model is empty\n        required: true\n        default: balanced\n        type: choice\n        options: [fast, balanced, accurate]\n      language:\n        description: ASR language\n        required: true\n        default: fa\n        type: string\n      no_editorial:\n        description: Skip the local editorial model\n        required: true\n        default: "false"\n        type: string\n      audio_profile:\n        description: Audio preprocessing profile\n        required: true\n        default: safe\n        type: choice\n        options: [none, safe, noisy]\n      editorial_model:',
          )
          replace(
              ".github/workflows/process-video.yml",
              '    env:\n      VIDEO_URL: ${{ inputs.url }}\n',
              '    env:\n      REQUEST_ID: ${{ inputs.request_id }}\n      DISPATCH_ID: ${{ inputs.dispatch_id }}\n      VIDEO_URL: ${{ inputs.url }}\n',
          )
          replace(
              ".github/workflows/process-video.yml",
              '      PROFILE: ${{ inputs.profile || \'balanced\' }}\n      WHISPER_MODEL: ${{ inputs.whisper_model }}\n',
              '      PROFILE: ${{ inputs.profile || \'balanced\' }}\n      WHISPER_MODEL: ${{ inputs.whisper_model }}\n      LANGUAGE: ${{ inputs.language || \'fa\' }}\n      NO_EDITORIAL: ${{ inputs.no_editorial || \'false\' }}\n      AUDIO_PROFILE: ${{ inputs.audio_profile || \'safe\' }}\n',
          )
          for marker in ('"WHISPER_MODEL": data.get("whisper_model") or "",\n',):
              path = ".github/workflows/process-video.yml"
              text = Path(path).read_text(encoding="utf-8")
              if text.count(marker) != 2:
                  raise SystemExit(f"{path}: expected two request-mapping contexts, found {text.count(marker)}")
              text = text.replace(
                  marker,
                  marker + '              "LANGUAGE": data.get("language") or "fa",\n              "NO_EDITORIAL": data.get("no_editorial") or False,\n              "AUDIO_PROFILE": data.get("audio_profile") or "safe",\n',
              )
              Path(path).write_text(text, encoding="utf-8")
              print(f"patched {path} request mappings")
          replace(
              ".github/workflows/process-video.yml",
              '      - name: Install and start local Ollama\n        shell: bash\n',
              '      - name: Install and start local Ollama\n        if: env.NO_EDITORIAL != \'true\'\n        shell: bash\n',
          )
          replace(
              ".github/workflows/process-video.yml",
              '          args=(run-url "$VIDEO_URL" --output-root outputs --language fa \\\n            --profile "$PROFILE" --device cpu --compute-type int8 \\\n            --editorial-model "$EDITORIAL_MODEL" --editorial-base-url "$OLLAMA_BASE_URL")\n          [[ -n "${WHISPER_MODEL:-}" ]] && args+=(--model "$WHISPER_MODEL")\n          [[ -n "${SOURCE_URL:-}" ]] && args+=(--source-url "$SOURCE_URL")\n          [[ -n "${JOB_NAME:-}" ]] && args+=(--name "$JOB_NAME")\n',
              '          args=(run-url "$VIDEO_URL" --output-root outputs --language "$LANGUAGE" \\\n            --profile "$PROFILE" --device cpu --compute-type int8 --audio-profile "$AUDIO_PROFILE")\n          [[ -n "${WHISPER_MODEL:-}" ]] && args+=(--model "$WHISPER_MODEL")\n          if [[ "${NO_EDITORIAL,,}" == "true" ]]; then\n            args+=(--no-editorial)\n          else\n            args+=(--editorial-model "$EDITORIAL_MODEL" --editorial-base-url "$OLLAMA_BASE_URL")\n          fi\n          [[ -n "${SOURCE_URL:-}" ]] && args+=(--source-url "$SOURCE_URL")\n          if [[ -n "${JOB_NAME:-}" ]]; then\n            args+=(--name "$JOB_NAME")\n          elif [[ -n "${REQUEST_ID:-}" ]]; then\n            args+=(--name "$REQUEST_ID")\n          fi\n',
          )
          PY

      - name: Commit plumbing changes and remove one-time helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-audio-plumbing.yml .github/audio-plumbing.trigger
          git add src .github/workflows/process-uploaded-video.yml .github/workflows/process-video.yml
          git commit -m "audio: reintegrate profile and dispatch plumbing"
          git push origin HEAD:agent/audio-integration-main
