name: One-time snapshot Asre Shirin live run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-snapshot-asre-shirin-live-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Find latest Asre Shirin production run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { ...context.repo, per_page: 100 },
            );
            const matches = runs
              .filter(run => run.name === 'Private Asre Shirin transcription')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            if (!matches.length) {
              core.setFailed('No Asre Shirin production run found');
              return;
            }
            const run = matches[0];
            const fs = require('fs');
            fs.mkdirSync('benchmarks', {recursive:true});
            fs.writeFileSync('benchmarks/private-asre-shirin-live-run.json', JSON.stringify({
              run_id: run.id,
              run_number: run.run_number,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              head_sha: run.head_sha,
              created_at: run.created_at,
              updated_at: run.updated_at,
              html_url: run.html_url,
            }, null, 2) + '\n');
      - name: Publish snapshot to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/private-asre-shirin-live-run.json
          git commit -m 'ops: snapshot Asre Shirin live run' || exit 0
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            sleep $((attempt*3))
          done
          exit 1
