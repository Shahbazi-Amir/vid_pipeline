name: Private Khane To transcription
run-name: Private Khane To transcription #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/private-khane-to-transcription.trigger"

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: private-khane-to-transcription
  cancel-in-progress: false

env:
  AI_REVIEW_ENABLED: "false"
  VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pending.outputs.matrix }}
      remaining_count: ${{ steps.pending.outputs.remaining_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: pending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = Path('sources/khane_to/fintelligence_manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          videos = data.get('videos') or []
          numbers = [int(row['result_number']) for row in videos]
          if data.get('complete') is not True or data.get('discovered') != 13 or numbers != list(range(1, 14)):
              raise SystemExit(f'Khane To manifest is not complete 1..13: {numbers}')
          if data.get('host') != 'فرهاد جم' or data.get('guest') != 'دکتر کمیل رودی':
              raise SystemExit('Khane To identities are not the user-confirmed host/guest')
          root = Path('outputs/khane_to')
          pending = []
          for row in videos:
              n = str(int(row['result_number']))
              complete = all(path.is_file() and path.stat().st_size > 0 for path in (
                  root/'md'/f'{n}.md', root/'timestamped'/f'{n}.md', root/'txt'/f'{n}.txt',
                  root/'roles'/f'{n}.json', root/'sources'/f'{n}.json', root/'timings'/f'{n}.json'))
              if not complete:
                  pending.append({
                      'result_number': int(row['result_number']),
                      'uid': str(row['uid']),
                      'url': str(row['url']),
                      'title': str(row.get('title') or ''),
                  })
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('matrix=' + json.dumps({'include': pending}, separators=(',', ':'), ensure_ascii=False) + '\n')
              handle.write(f'remaining_count={len(pending)}\n')
          print(f'Khane To pending: {len(pending)} of 13')
          PY

  process:
    name: process Khane To ${{ matrix.result_number }}
    needs: discover
    if: needs.discover.outputs.remaining_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      actions: write
      contents: read
      statuses: write
    env:
      VID_PIPELINE_PYANNOTE_TOKEN: ${{ secrets.HF_TOKEN }}
      VIDEO_URL: ${{ matrix.url }}
      VIDEO_UID: ${{ matrix.uid }}
      RESULT_NUMBER: ${{ matrix.result_number }}
      VIDEO_TITLE: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/asre-shirin-cpu.txt
      - name: Cache pyannote Community-1 model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: pyannote-${{ runner.os }}-py311-${{ hashFiles('pyproject.toml', 'constraints/asre-shirin-cpu.txt') }}-community-1-v2
      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'constraints/asre-shirin-cpu.txt') }}-large-v3-turbo-ct2-v2
      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0 torchcodec==0.7.0
          pip install -c constraints/asre-shirin-cpu.txt -e '.[asre-shirin-cpu]'
          echo "ASRE_SHIRIN_SETUP_SECONDS=$((SECONDS-started))" >> "$GITHUB_ENV"
      - name: Resolve, download once, and verify local media
        shell: bash
        run: |
          set -euo pipefail
          echo "ASRE_SHIRIN_WORKER_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          for attempt in 1 2; do
            set +e
            timeout --verbose --signal=TERM --kill-after=2m 20m python scripts/process_khane_to_url.py \
              --url "$VIDEO_URL" --episode "$RESULT_NUMBER" --expected-uid "$VIDEO_UID" --title "$VIDEO_TITLE" \
              --collection-root private-result --work-root worker-output --ingest-only
            status=$?
            set -e
            (( status == 0 )) && exit 0
            (( attempt < 2 )) && sleep $((attempt*15))
          done
          exit 1
      - name: Primary ASR from verified local media
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            set +e
            timeout --verbose --signal=TERM --kill-after=2m 75m python scripts/process_khane_to_url.py \
              --url "$VIDEO_URL" --episode "$RESULT_NUMBER" --expected-uid "$VIDEO_UID" --title "$VIDEO_TITLE" \
              --collection-root private-result --work-root worker-output --asr-only
            status=$?
            set -e
            (( status == 0 )) && exit 0
            (( attempt < 2 )) && sleep $((attempt*15))
          done
          exit 1
      - name: Diarize, map roles, and prepare delivery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            set +e
            timeout --verbose --signal=TERM --kill-after=2m 90m python scripts/process_khane_to_url.py \
              --url "$VIDEO_URL" --episode "$RESULT_NUMBER" --expected-uid "$VIDEO_UID" --title "$VIDEO_TITLE" \
              --collection-root private-result --work-root worker-output
            status=$?
            set -e
            (( status == 0 )) && exit 0
            (( attempt < 2 )) && sleep $((attempt*15))
          done
          exit 1
      - name: Validate checkpoint
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "private-result/md/$RESULT_NUMBER.md" \
            "private-result/timestamped/$RESULT_NUMBER.md" \
            "private-result/txt/$RESULT_NUMBER.txt" \
            "private-result/roles/$RESULT_NUMBER.json" \
            "private-result/sources/$RESULT_NUMBER.json" \
            "private-result/timings/$RESULT_NUMBER.json"; do test -s "$path"; done
          python - <<'PY'
          import json, os
          from pathlib import Path
          n=os.environ['RESULT_NUMBER']
          role=json.loads((Path('private-result/roles')/f'{n}.json').read_text(encoding='utf-8'))
          if role.get('status') not in {'mapped','partially_unresolved'}:
              raise SystemExit(f"invalid role status {role.get('status')}")
          values=set((role.get('mapping') or {}).values())
          if role.get('status') == 'mapped' and not {'فرهاد جم','دکتر کمیل رودی'} <= values:
              raise SystemExit('mapped roles missing confirmed identities')
          PY
      - name: Checkpoint successful episode
        uses: actions/upload-artifact@v4
        with:
          name: khane-to-${{ matrix.result_number }}
          path: private-result/**
          retention-days: 3
          if-no-files-found: error
      - name: Dispatch serialized checkpoint publisher
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'publish-khane-to-checkpoints.yml',
              ref: 'main',
              inputs: { source_run_id: String(context.runId) },
            });
      - name: Checkpoint failed resumable stages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: khane-to-stage-failure-${{ matrix.result_number }}
          path: |
            worker-output/**
            !worker-output/ingest/**/media.mp4
          retention-days: 1
          if-no-files-found: ignore
      - name: Cleanup worker media
        if: always()
        run: rm -rf worker-output private-result

  dispatch-final-publish:
    needs: [discover, process]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.remaining_count != '0'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'publish-khane-to-checkpoints.yml',
              ref: 'main',
              inputs: { source_run_id: String(context.runId) },
            });
