name: Inventory Sherpa removal

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/sherpa-removal-inventory.trigger"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory repository references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          skip = {
              Path('.github/workflows/inventory-sherpa-removal.yml'),
              Path('.github/bootstrap/sherpa-removal-inventory.trigger'),
              Path('validation/sherpa-removal-inventory.txt'),
          }
          rows = []
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts or path in skip:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if 'sherpa' in line.casefold():
                      rows.append(f'{path}:{number}:{line}')
          Path('validation').mkdir(exist_ok=True)
          Path('validation/sherpa-removal-inventory.txt').write_text(
              '\n'.join(rows) + ('\n' if rows else ''), encoding='utf-8'
          )
          print(f'found {len(rows)} Sherpa references')
          PY

      - name: Commit inventory and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/sherpa-removal-inventory.trigger
          rm -f .github/workflows/inventory-sherpa-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A validation/sherpa-removal-inventory.txt \
            .github/bootstrap/sherpa-removal-inventory.trigger \
            .github/workflows/inventory-sherpa-removal.yml
          git commit -m "chore: inventory legacy Sherpa references"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
