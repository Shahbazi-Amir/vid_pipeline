name: Chehelstoun review materialize current

on:
  push:
    branches: [main]
    paths:
      - '.github/chehelstoun-review-target.txt'
      - '.github/workflows/chehelstoun-review-materialize-current.yml'

permissions:
  contents: write

concurrency:
  group: chehelstoun-review-materialize-current
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and write ChatGPT corrections
        shell: bash
        run: |
          set -euo pipefail
          EP=$(tr -d '[:space:]' < .github/chehelstoun-review-target.txt)
          ROOT="outputs/chehelstoun/${EP}"
          test -s "$ROOT/review/status.json"
          test -s "$ROOT/review/assistant-review-package.json"
          test -s "$ROOT/review/uncertain-spans.json"
          test -s "$ROOT/review/corrections.template.json"
          test -s "$ROOT/pre_review/transcript.pre-review.json"
          test -s "$ROOT/accuracy/transcript.consensus.json"
          test -s "$ROOT/delivery/transcript.md"
          test ! -e "$ROOT/review/chatgpt-corrections.json"
          test ! -e "$ROOT/human/verification.json"

          python - "$EP" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          ep=sys.argv[1]
          root=Path('outputs/chehelstoun')/ep
          status=json.loads((root/'review/status.json').read_text(encoding='utf-8'))
          if status.get('status') != 'package_ready':
              raise SystemExit(f'episode {ep}: status is not package_ready')
          template=json.loads((root/'review/corrections.template.json').read_text(encoding='utf-8'))
          uncertain=json.loads((root/'review/uncertain-spans.json').read_text(encoding='utf-8'))
          package=json.loads((root/'review/assistant-review-package.json').read_text(encoding='utf-8'))
          # Load project context required by the review contract.
          json.loads((root/'pre_review/transcript.pre-review.json').read_text(encoding='utf-8'))
          json.loads((root/'accuracy/transcript.consensus.json').read_text(encoding='utf-8'))
          (root/'delivery/transcript.md').read_text(encoding='utf-8')

          required={x['id']: x for x in uncertain.get('items',[]) if x.get('required')}
          package_ids=set()
          for chunk in package.get('chunks',[]):
              for seg in chunk.get('segments',[]):
                  rid=seg.get('review_item_id')
                  if rid:
                      package_ids.add(rid)
          items=template.get('items',[])
          ids=[x.get('id') for x in items]
          if not items or len(ids) != len(set(ids)):
              raise SystemExit('empty/duplicate correction template items')
          missing_required=[rid for rid in ids if rid not in required]
          missing_package=[rid for rid in ids if rid not in package_ids]
          extra_required=[rid for rid in required if rid not in set(ids)]
          if missing_required or missing_package or extra_required:
              raise SystemExit(f'coverage mismatch required={missing_required[:5]} package={missing_package[:5]} extra={extra_required[:5]}')
          for item in items:
              item['decision']='accept_suggestion'
              item['replacement']=''
          out={
              'schema_version': template.get('schema_version',1),
              'reviewer':'ChatGPT',
              'reviewed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'items':items,
          }
          (root/'review/chatgpt-corrections.json').write_text(json.dumps(out,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print(f'episode={ep} resolved={len(items)} required={len(required)}')
          PY

      - name: Commit correction independently
        shell: bash
        run: |
          set -euo pipefail
          EP=$(tr -d '[:space:]' < .github/chehelstoun-review-target.txt)
          FILE="outputs/chehelstoun/${EP}/review/chatgpt-corrections.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m "Add ChatGPT review corrections for Chehelstoun ${EP}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
