name: Render ChatGPT review derivatives

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-chatgpt-review.yml"
      - "scripts/render_existing_chatgpt_reviews.py"
      - "outputs/*/review/timestamped/*.md"

permissions:
  contents: write

concurrency:
  group: render-chatgpt-review
  cancel-in-progress: false

jobs:
  render-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install local package
        run: python -m pip install -e .

      - name: Render reviewed derivatives locally only
        shell: bash
        run: |
          set -euo pipefail
          unset VID_PIPELINE_REVIEW_API_KEY VID_PIPELINE_REVIEW_BASE_URL VID_PIPELINE_REVIEW_MODEL
          export AI_REVIEW_ENABLED=false
          python scripts/render_existing_chatgpt_reviews.py

      - name: Commit rendered Markdown and text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'outputs/*/review/md/*.md' 'outputs/*/review/txt/*.txt'
          git diff --cached --quiet && exit 0
          git commit -m "review: render pending ChatGPT derivatives"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
