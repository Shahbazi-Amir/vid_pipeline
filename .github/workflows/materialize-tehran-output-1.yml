name: Materialize Tehran Video 1 Outputs

on:
  push:
    branches: [main]
    paths:
      - '.github/bootstrap/materialize-tehran-output-1.trigger'

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful Video 1 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8915036061'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/video1-artifact.zip
          rm -rf /tmp/video1-artifact
          mkdir -p /tmp/video1-artifact
          unzip -q /tmp/video1-artifact.zip -d /tmp/video1-artifact

      - name: Materialize numbered corpus outputs
        shell: bash
        run: |
          set -euo pipefail
          delivery_dir=$(find /tmp/video1-artifact/outputs -type d -name delivery -print -quit)
          test -n "$delivery_dir"
          test -s "$delivery_dir/transcript.md"
          test -s "$delivery_dir/transcript.timestamped.md"
          test -s "$delivery_dir/transcript.txt"

          mkdir -p outputs/uni_tehran/md outputs/uni_tehran/timestamped outputs/uni_tehran/txt
          cp "$delivery_dir/transcript.md" outputs/uni_tehran/md/1.md
          cp "$delivery_dir/transcript.timestamped.md" outputs/uni_tehran/timestamped/1.md
          cp "$delivery_dir/transcript.txt" outputs/uni_tehran/txt/1.txt

          cmp -s "$delivery_dir/transcript.md" outputs/uni_tehran/md/1.md
          cmp -s "$delivery_dir/transcript.timestamped.md" outputs/uni_tehran/timestamped/1.md
          cmp -s "$delivery_dir/transcript.txt" outputs/uni_tehran/txt/1.txt

      - name: Commit and push Video 1 corpus outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/materialize-tehran-output-1.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/uni_tehran .github/bootstrap/materialize-tehran-output-1.trigger
          git commit -m "data: add uni_tehran video 1 transcripts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
