name: Archive Komeil Roudi Ketab Baz episode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-ketab-baz-komeil-roudi.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ketab-baz-s05e68-komeil-roudi
      OUTPUT_BASENAME: KetabBaz_S05E68_Komeil_Roudi
      RSS_URL: https://rss.castbox.fm/everest/db2dc0b37407484e86691781e9f82d03.xml
      YOUTUBE_URL: https://youtu.be/yohZIIrjSwE
      APARAT_URL: https://www.aparat.com/v/7oEKI/
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Resolve and download episode from podcast RSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist logs
          curl -fL --retry 5 --retry-all-errors \
            -A 'Mozilla/5.0' "$RSS_URL" -o logs/feed.xml

          python3 - <<'PY'
          import html
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse('logs/feed.xml').getroot()
          target = None
          for item in root.findall('.//item'):
              title = (item.findtext('title') or '').strip()
              if 'کمیل رودی' in title:
                  target = item
                  Path('logs/matched_title.txt').write_text(title + '\n', encoding='utf-8')
                  break
          if target is None:
              raise SystemExit('Komeil Roudi episode not found in RSS')

          candidates = []
          for elem in target.iter():
              for key, value in elem.attrib.items():
                  if key.lower().endswith('url') and isinstance(value, str) and value.startswith('http'):
                      candidates.append(html.unescape(value))
              text = (elem.text or '').strip()
              if text.startswith('http'):
                  candidates.append(html.unescape(text))

          def score(url):
              s = 0
              low = url.lower()
              if '.mp3' in low: s += 100
              if '.m4a' in low or '.aac' in low: s += 80
              if 'castbox' in low: s += 40
              if 'audio' in low: s += 20
              if re.search(r'\.(jpg|jpeg|png|webp)(\?|$)', low): s -= 200
              return s

          candidates = sorted(set(candidates), key=score, reverse=True)
          if not candidates or score(candidates[0]) <= 0:
              Path('logs/candidate_urls.txt').write_text('\n'.join(candidates), encoding='utf-8')
              raise SystemExit('No audio enclosure URL found in matched RSS item')
          Path('logs/candidate_urls.txt').write_text('\n'.join(candidates), encoding='utf-8')
          Path('logs/direct_url.txt').write_text(candidates[0] + '\n', encoding='utf-8')
          print('Matched:', Path('logs/matched_title.txt').read_text(encoding='utf-8').strip())
          print('Audio URL resolved from RSS enclosure')
          PY

          direct=$(cat logs/direct_url.txt)
          curl -fL --retry 5 --retry-all-errors \
            -A 'Mozilla/5.0' "$direct" -o "dist/${OUTPUT_BASENAME}.mp3"

          test $(stat -c%s "dist/${OUTPUT_BASENAME}.mp3") -gt 1000000
          ffprobe -v error "dist/${OUTPUT_BASENAME}.mp3" >/dev/null
          printf '%s\n' "$RSS_URL" > dist/source_url.txt
          ffprobe -v error -show_entries format=duration,size,format_name -of json \
            "dist/${OUTPUT_BASENAME}.mp3" > dist/media_info.json
          (cd dist && sha256sum "${OUTPUT_BASENAME}.mp3" > SHA256SUMS.txt)
          cat > dist/README.txt <<EOF
          Ketab Baz (کتاب‌باز), season 5 episode 68 — guest: Dr. Komeil Roudi
          Full audio episode / گفت‌وگوی کامل صوتی
          Archived from the public podcast RSS feed.
          Public video references: ${YOUTUBE_URL} and ${APARAT_URL}
          Note: the old Aparat video currently returns HTTP 410 and YouTube blocks GitHub-hosted runners with bot verification, so this archive uses the surviving podcast enclosure.
          EOF
          ls -lh dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Ketab Baz — Dr. Komeil Roudi (S05E68)" \
              --notes "Full archived audio of the Ketab Baz conversation with Dr. Komeil Roudi. Source provenance, media info and checksum are attached."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ketab-baz-download-logs
          path: logs/
          retention-days: 7

      - name: Report archive result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          source_used='not available'
          [[ -f dist/source_url.txt ]] && source_used=$(cat dist/source_url.txt)
          body=$(cat <<EOF
          Ketab Baz archive workflow finished.

          - status: ${JOB_STATUS}
          - run_id: ${GITHUB_RUN_ID}
          - commit: ${GITHUB_SHA}
          - source_used: ${source_used}
          - run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Ketab Baz Komeil Roudi archive report — ${GITHUB_RUN_ID}" --body "$body"
