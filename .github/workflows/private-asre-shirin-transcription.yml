name: Private Asre Shirin transcription
run-name: Private Asre Shirin transcription #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/private-asre-shirin-transcription.trigger"

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: private-asre-shirin-transcription
  cancel-in-progress: false

env:
  AI_REVIEW_ENABLED: "false"
  VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pending.outputs.matrix }}
      remaining_count: ${{ steps.pending.outputs.remaining_count }}
      total_count: ${{ steps.pending.outputs.total_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: pending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("sources/asre_shirin/aparat_manifest.json")
          if not manifest_path.is_file():
              raise SystemExit("Verified Asre Shirin Aparat manifest is missing")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          videos = data.get("videos") or []
          numbers = [int(row["result_number"]) for row in videos]
          if numbers != list(range(2, 27)):
              raise SystemExit(f"Asre Shirin manifest does not contain the verified episodes 2..26: {numbers}")

          root = Path("outputs/asre_shirin")
          pending = []
          for row in videos:
              n = str(int(row["result_number"]))
              complete = all(
                  path.is_file() and path.stat().st_size > 0
                  for path in (
                      root / "md" / f"{n}.md",
                      root / "timestamped" / f"{n}.md",
                      root / "txt" / f"{n}.txt",
                      root / "roles" / f"{n}.json",
                      root / "sources" / f"{n}.json",
                      root / "timings" / f"{n}.json",
                  )
              )
              if not complete:
                  pending.append({
                      "result_number": int(row["result_number"]),
                      "uid": str(row["uid"]),
                      "url": str(row["url"]),
                      "title": str(row.get("title") or ""),
                  })

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps({"include": pending}, separators=(",", ":"), ensure_ascii=False) + "\n")
              handle.write(f"remaining_count={len(pending)}\n")
              handle.write(f"total_count={len(videos)}\n")
          print(f"Asre Shirin pending: {len(pending)} of {len(videos)}")
          PY

  process:
    name: process Asre Shirin ${{ matrix.result_number }}
    needs: discover
    if: needs.discover.outputs.remaining_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      actions: write
      contents: read
      statuses: write
    env:
      VID_PIPELINE_PYANNOTE_TOKEN: ${{ secrets.HF_TOKEN }}
      VIDEO_URL: ${{ matrix.url }}
      VIDEO_UID: ${{ matrix.uid }}
      RESULT_NUMBER: ${{ matrix.result_number }}
      VIDEO_TITLE: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record real process run identity
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: "pending",
              context: `asre-shirin/episode-${{ matrix.result_number }}`,
              description: "Episode ${{ matrix.result_number }} worker is running",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/asre-shirin-cpu.txt

      - name: Cache pyannote Community-1 model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: pyannote-${{ runner.os }}-py311-${{ hashFiles('pyproject.toml', 'constraints/asre-shirin-cpu.txt') }}-community-1-v2

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'constraints/asre-shirin-cpu.txt') }}-large-v3-turbo-ct2-v2

      - name: Install worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchaudio==2.8.0 torchcodec==0.7.0
          pip install -c constraints/asre-shirin-cpu.txt -e '.[asre-shirin-cpu]'
          python - <<'PY'
          from importlib.metadata import version
          import torch
          assert torch.__version__ == "2.8.0+cpu", torch.__version__
          assert version("torchcodec").split("+", 1)[0] == "0.7.0", version("torchcodec")
          assert not torch.cuda.is_available()
          print(f"CPU_DEPENDENCIES torch={torch.__version__} torchcodec={version('torchcodec')}")
          PY
          elapsed=$((SECONDS - started))
          echo "ASRE_SHIRIN_SETUP_SECONDS=$elapsed" >> "$GITHUB_ENV"
          python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version
          for name in ("faster-whisper", "pyannote.audio", "torch", "torchaudio", "soundfile"):
              try:
                  print(f"DEPENDENCY {name}={version(name)}")
              except PackageNotFoundError:
                  raise SystemExit(f"missing required dependency: {name}")
          for unused in ("whisperx", "yt-dlp"):
              try:
                  value = version(unused)
              except PackageNotFoundError:
                  print(f"DEPENDENCY_UNUSED {unused}=not-installed")
              else:
                  raise SystemExit(f"unused dependency unexpectedly installed: {unused}={value}")
          PY

      - name: Resolve, download once, and verify local media
        shell: bash
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          echo "ASRE_SHIRIN_WORKER_STARTED_EPOCH=$started_epoch" >> "$GITHUB_ENV"
          export ASRE_SHIRIN_WORKER_STARTED_EPOCH=$started_epoch
          for attempt in 1 2; do
            echo "Starting Asre Shirin $RESULT_NUMBER ingest attempt $attempt"
            set +e
            timeout --verbose --signal=TERM --kill-after=2m 20m \
              python scripts/process_asre_shirin_url.py \
                --url "$VIDEO_URL" \
                --episode "$RESULT_NUMBER" \
                --expected-uid "$VIDEO_UID" \
                --title "$VIDEO_TITLE" \
                --collection-root private-result \
                --work-root worker-output \
                --ingest-only
            status=$?
            set -e
            if (( status == 0 )); then
              exit 0
            fi
            echo "ASRE_SHIRIN_STAGE_FAILED episode=$RESULT_NUMBER stage=ingest attempt=$attempt status=$status" >&2
            if (( attempt < 2 )); then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Primary ASR from verified local media
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Starting Asre Shirin $RESULT_NUMBER primary ASR attempt $attempt"
            set +e
            timeout --verbose --signal=TERM --kill-after=2m 75m \
              python scripts/process_asre_shirin_url.py \
                --url "$VIDEO_URL" \
                --episode "$RESULT_NUMBER" \
                --expected-uid "$VIDEO_UID" \
                --title "$VIDEO_TITLE" \
                --collection-root private-result \
                --work-root worker-output \
                --asr-only
            status=$?
            set -e
            if (( status == 0 )); then
              exit 0
            fi
            echo "ASRE_SHIRIN_STAGE_FAILED episode=$RESULT_NUMBER stage=asr attempt=$attempt status=$status" >&2
            if (( attempt < 2 )); then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Diarize, align, map roles, and prepare delivery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Starting Asre Shirin $RESULT_NUMBER diarization attempt $attempt"
            set +e
            timeout --verbose --signal=TERM --kill-after=2m 90m \
              python scripts/process_asre_shirin_url.py \
                --url "$VIDEO_URL" \
                --episode "$RESULT_NUMBER" \
                --expected-uid "$VIDEO_UID" \
                --title "$VIDEO_TITLE" \
                --collection-root private-result \
                --work-root worker-output
            status=$?
            set -e
            if (( status == 0 )); then
              exit 0
            fi
            echo "ASRE_SHIRIN_STAGE_FAILED episode=$RESULT_NUMBER stage=diarization_delivery attempt=$attempt status=$status" >&2
            if (( attempt < 2 )); then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Validate checkpoint and role diagnostics
        shell: bash
        env:
          RESULT_NUMBER: ${{ matrix.result_number }}
        run: |
          set -euo pipefail
          test -s "private-result/md/$RESULT_NUMBER.md"
          test -s "private-result/timestamped/$RESULT_NUMBER.md"
          test -s "private-result/txt/$RESULT_NUMBER.txt"
          test -s "private-result/roles/$RESULT_NUMBER.json"
          test -s "private-result/sources/$RESULT_NUMBER.json"
          test -s "private-result/timings/$RESULT_NUMBER.json"
          python - "$RESULT_NUMBER" <<'PY'
          import json
          import sys
          from pathlib import Path

          n = sys.argv[1]
          root = Path("private-result")
          role = json.loads((root / "roles" / f"{n}.json").read_text(encoding="utf-8"))
          status = role.get("status")
          if status not in {"mapped", "partially_unresolved"}:
              raise SystemExit(f"Unexpected role status: {status!r}")
          mapping = role.get("mapping") or {}
          values = set(mapping.values())
          timestamped = (root / "timestamped" / f"{n}.md").read_text(encoding="utf-8")
          if status == "mapped":
              if "خانم متولیان" not in values or "دکتر کمیل رودی" not in values:
                  raise SystemExit("Mapped role diagnostics do not contain both known identities")
              if "خانم متولیان" not in timestamped or "دکتر کمیل رودی" not in timestamped:
                  raise SystemExit("Mapped transcript is missing known role labels")
          else:
              if not role.get("unresolved_raw_labels"):
                  raise SystemExit("partially_unresolved status must identify unresolved raw labels")
              if "گوینده نامشخص" not in timestamped:
                  raise SystemExit("Unresolved role must remain visibly unresolved in transcript")
          print(json.dumps({"episode": n, "role_status": status, "mapping": mapping}, ensure_ascii=False))
          PY

      - name: Checkpoint successful episode
        uses: actions/upload-artifact@v4
        with:
          name: asre-shirin-${{ matrix.result_number }}
          path: private-result/**
          retention-days: 7
          if-no-files-found: error

      - name: Dispatch serialized checkpoint publisher
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "publish-asre-shirin-checkpoints.yml",
              ref: "main",
              inputs: { source_run_id: String(context.runId) },
            });

      - name: Checkpoint failed resumable stages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asre-worker-stage-failure-${{ matrix.result_number }}
          path: |
            worker-output/**
            !worker-output/ingest/**/media.mp4
          retention-days: 2
          if-no-files-found: ignore

      - name: Cleanup worker media
        if: always()
        run: rm -rf worker-output private-result

      - name: Record final process result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PROCESS_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const passed = process.env.PROCESS_JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: `asre-shirin/episode-${{ matrix.result_number }}`,
              description: passed
                ? "Episode ${{ matrix.result_number }} worker passed"
                : "Episode ${{ matrix.result_number }} worker failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  dispatch-final-publish:
    name: dispatch final Asre Shirin checkpoint publish
    needs: [discover, process]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.remaining_count != '0'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch serialized publisher fallback
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "publish-asre-shirin-checkpoints.yml",
              ref: "main",
              inputs: { source_run_id: String(context.runId) },
            });
