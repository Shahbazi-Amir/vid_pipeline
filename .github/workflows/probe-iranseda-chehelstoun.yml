name: Probe IranSeda Chehelstoun archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-iranseda-chehelstoun.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_HOST: radio.iranseda.ir
      TARGET_PATH: /Program/?VALID=TRUE&ch=57&m=090513
    steps:
      - name: Probe DNS and archive
        shell: bash
        run: |
          set -u
          mkdir -p probe
          python3 - <<'PY'
          import json, os, re, socket, ssl, subprocess, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['TARGET_HOST']
          path=os.environ['TARGET_PATH']
          headers={'User-Agent':'Mozilla/5.0 ChehelstounArchiveProbe/1.0'}
          results=[]
          ips=[]

          # System DNS
          try:
              ips += [x[4][0] for x in socket.getaddrinfo(host, None, type=socket.SOCK_STREAM)]
          except Exception as e:
              results.append('system_dns_error='+repr(e))

          # Google and Cloudflare DoH
          for label,url in [
              ('google',f'https://dns.google/resolve?name={host}&type=A'),
              ('cloudflare',f'https://cloudflare-dns.com/dns-query?name={host}&type=A')]:
              try:
                  req=urllib.request.Request(url, headers={**headers,'Accept':'application/dns-json'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data=json.load(r)
                  Path(f'probe/dns_{label}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
                  for ans in data.get('Answer',[]) or []:
                      d=str(ans.get('data',''))
                      if re.fullmatch(r'\d+\.\d+\.\d+\.\d+',d): ips.append(d)
              except Exception as e:
                  results.append(f'{label}_doh_error={e!r}')

          # unique IPs
          uniq=[]
          for ip in ips:
              if ip not in uniq: uniq.append(ip)
          Path('probe/ips.txt').write_text('\n'.join(uniq)+'\n',encoding='utf-8')
          results.append('ips='+','.join(uniq))

          fetched=[]
          urls=[]
          # Normal DNS attempts too
          urls += [('normal_http',f'http://{host}{path}',None),('normal_https',f'https://{host}{path}',None)]
          # --resolve bypass per IP
          for ip in uniq:
              urls += [('resolve_http',f'http://{host}{path}',ip),('resolve_https',f'https://{host}{path}',ip)]

          for idx,(kind,url,ip) in enumerate(urls):
              out=Path(f'probe/page_{idx}_{kind}.html')
              cmd=['curl','-k','-L','--connect-timeout','12','--max-time','35','-A',headers['User-Agent'],'-sS','-D',f'probe/headers_{idx}.txt','-o',str(out),'-w','%{http_code} %{url_effective} %{size_download}']
              if ip:
                  scheme=urllib.parse.urlsplit(url).scheme
                  port='443' if scheme=='https' else '80'
                  cmd += ['--resolve',f'{host}:{port}:{ip}']
              cmd += [url]
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=45)
                  results.append(f'{idx} {kind} ip={ip} rc={p.returncode} result={p.stdout.strip()} err={p.stderr.strip()[:300]}')
                  if p.returncode==0 and out.exists() and out.stat().st_size>100:
                      fetched.append(out)
              except Exception as e:
                  results.append(f'{idx} {kind} ip={ip} error={e!r}')

          # Extract interesting links, URLs, JS endpoints and audio references
          found=[]
          patterns=[
              r'''(?:href|src)\s*=\s*["']([^"']+)["']''',
              r'''https?://[^\s"'<>]+''',
              r'''[^\s"'<>]+\.(?:mp3|m4a|wav|aac)(?:\?[^\s"'<>]*)?''',
          ]
          for p in fetched:
              raw=p.read_bytes()
              text=raw.decode('utf-8','ignore')
              for pat in patterns:
                  for x in re.findall(pat,text,re.I):
                      if isinstance(x,tuple): x=x[0]
                      x=x.strip()
                      if x and x not in found: found.append(x)
          Path('probe/extracted_links.txt').write_text('\n'.join(found)+'\n',encoding='utf-8')
          interesting=[x for x in found if re.search(r'(mp3|audio|sound|media|download|program|archive|api|play)',x,re.I)]
          Path('probe/interesting_links.txt').write_text('\n'.join(interesting)+'\n',encoding='utf-8')
          results.append(f'fetched_pages={len(fetched)} extracted={len(found)} interesting={len(interesting)}')
          Path('probe/summary.txt').write_text('\n'.join(results)+'\n',encoding='utf-8')
          print('\n'.join(results))
          print('--- interesting ---')
          for x in interesting[:200]: print(x)
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iranseda-chehelstoun-probe
          path: probe/
          retention-days: 7

      - name: Report probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          title="IranSeda Chehelstoun probe report"
          summary=$(cat probe/summary.txt 2>/dev/null || true)
          body=$(cat <<EOF
          IranSeda Chehelstoun probe completed.

          - run_id: ${GITHUB_RUN_ID}
          - commit: ${GITHUB_SHA}
          - run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Summary:
          \`\`\`
          ${summary}
          \`\`\`
          EOF
          )
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "IranSeda Chehelstoun probe report") | .number' | head -n1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
