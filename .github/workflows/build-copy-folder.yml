name: Build clean Markdown copy folder
run-name: Build clean Markdown copy folder ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-copy-folder.yml'
      - 'scripts/build_copy_folder.py'
      - 'outputs/chehelstoun/**'
      - 'outputs/finalized/**'
      - 'outputs/ketab-baz/**'
      - 'outputs/mizan/**'
      - 'outputs/finup/**'
      - 'outputs/voice-260817-165035/**'
      - 'outputs/bankmellatt/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-markdown-copy-folder
  cancel-in-progress: false

jobs:
  build-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build Markdown-only copy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_copy_folder.py | tee /tmp/copy-summary.json

      - name: Validate copy contract
        shell: bash
        run: |
          set -euo pipefail
          test -d copy
          if find copy -type f ! -name '*.md' -print -quit | grep -q .; then
            echo 'copy/ must contain Markdown files only.' >&2
            exit 1
          fi
          cheh_count=$(find copy -maxdepth 1 -type f -name 'چهلستون *.md' | wc -l)
          test "$cheh_count" -eq 38
          test -s 'copy/کتاب باز.md'
          test -s 'copy/میزان.md'
          test -s 'copy/فناپ.md'
          test -s 'copy/شراکت.md'
          for f in copy/*.md; do
            grep -q '^\- \*\*مدت‌زمان کل:\*\*' "$f"
            grep -q '^\- \*\*توضیحات:\*\*' "$f"
            if grep -q 'github.com/Shahbazi-Amir/vid_pipeline' "$f"; then
              echo "Internal GitHub link leaked into $f" >&2
              exit 1
            fi
            if grep -q '^\- \*\*منبع اصلی:\*\*' "$f" && ! grep -Eq '^\- \*\*منبع اصلی:\*\* https?://' "$f"; then
              echo "Source must be a raw external URL in $f" >&2
              exit 1
            fi
          done
          for f in copy/چهلستون\ *.md 'copy/کتاب باز.md' 'copy/فناپ.md'; do
            grep -Eq '^\- \*\*منبع اصلی:\*\* https?://' "$f"
          done
          echo "Validated $(find copy -maxdepth 1 -type f -name '*.md' | wc -l) Markdown files."

      - name: Commit generated copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f copy
          if git diff --cached --quiet; then
            echo 'copy/ is already current.'
            exit 0
          fi
          git commit -m "Build clean Markdown transcript copy"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

