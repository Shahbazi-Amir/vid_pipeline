name: Chehelstoun review package parallel
run-name: Chehelstoun review package parallel ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chehelstoun-review-package-parallel.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

env:
  RELEASE_TAG: chehelstoun-archive-v1
  COLLECTION_ROOT: outputs/chehelstoun
  PROFILE: balanced
  LANGUAGE: fa
  AUDIO_PROFILE: safe
  VID_PIPELINE_ACCURACY_MODE: balanced
  VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub

concurrency:
  group: chehelstoun-review-package-serial
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Select up to six episodes without packages
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > /tmp/release.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          rel=json.loads(Path('/tmp/release.json').read_text())
          assets={a.get('name','')[:2]:a for a in rel.get('assets',[]) if len(a.get('name',''))>=2 and a.get('name','')[:2].isdigit() and a.get('name','').lower().endswith('.mp3')}
          selected=[]
          for n in range(1,39):
              ep=f'{n:02d}'; root=Path(os.environ['COLLECTION_ROOT'])/ep
              if not (root/'delivery/transcript.txt').is_file(): continue
              if (root/'review/assistant-review-package.json').is_file(): continue
              a=assets.get(ep)
              if not a: continue
              selected.append({'episode':ep,'asset_name':a['name'],'asset_url':a['browser_download_url'],'asset_size':a['size']})
              if len(selected)==6: break
          compact=json.dumps({'include':selected},ensure_ascii=False,separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('matrix<<EOF\n'+compact+'\nEOF\n')
              f.write('count='+str(len(selected))+'\n')
          print('Selected:',[x['episode'] for x in selected])
          PY

  materialize:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EPISODE: ${{ matrix.episode }}
      ASSET_NAME: ${{ matrix.asset_name }}
      ASSET_URL: ${{ matrix.asset_url }}
      ASSET_SIZE: ${{ matrix.asset_size }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Recheck package
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          if [[ -s "${COLLECTION_ROOT}/${EPISODE}/review/assistant-review-package.json" ]]; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache ASR model
        if: steps.existing.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1
      - name: Install worker
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -e '.[worker]'
      - name: Download source
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/review-${EPISODE}-input" "/tmp/review-${EPISODE}-runtime"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 "$ASSET_URL" -o "/tmp/review-${EPISODE}-input/input.mp3"
          test "$(stat -c %s "/tmp/review-${EPISODE}-input/input.mp3")" -eq "$ASSET_SIZE"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "/tmp/review-${EPISODE}-input/input.mp3" | grep -q .
      - name: Generate review package
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          title="${ASSET_NAME%.mp3}"; title="${title#?? - }"
          vid-pipeline run-file "/tmp/review-${EPISODE}-input/input.mp3" \
            --name "chehelstoun-${EPISODE}" --output-root "/tmp/review-${EPISODE}-runtime" \
            --profile "$PROFILE" --language "$LANGUAGE" --device cpu --compute-type int8 --audio-profile "$AUDIO_PROFILE" \
            --hotwords "چهلستون، کمیل رودی، دکتر کمیل رودی، سواد مالی، رادیو گفت‌وگو" \
            --title "$title" --program "چهلستون" --network "رادیو گفت‌وگو" --speaker "دکتر کمیل رودی" \
            --source-url "$ASSET_URL" --no-editorial
      - name: Persist review package
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          job_dir=$(find "/tmp/review-${EPISODE}-runtime" -mindepth 1 -maxdepth 1 -type d -name "chehelstoun-${EPISODE}-*" -print -quit)
          test -n "$job_dir"
          test -s "$job_dir/raw/transcript.raw.json"
          test -s "$job_dir/review/assistant-review-package.json"
          test -s "$job_dir/pre_review/transcript.pre-review.json"
          test -s "$job_dir/accuracy/transcript.consensus.json"
          dest="${COLLECTION_ROOT}/${EPISODE}"
          mkdir -p "$dest/raw" "$dest/machine" "$dest/final" "$dest/pre_review" "$dest/accuracy" "$dest/review"
          for dir in raw machine pre_review accuracy review; do
            if [[ -d "$job_dir/$dir" ]]; then find "$job_dir/$dir" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do cp "$f" "$dest/$dir/"; done; fi
          done
          for f in transcript.final.txt transcript.final.md editorial-report.json; do [[ -f "$job_dir/final/$f" ]] && cp "$job_dir/final/$f" "$dest/final/$f"; done
          python - <<'PY'
          import json, os
          from pathlib import Path
          dest=Path(os.environ['COLLECTION_ROOT'])/os.environ['EPISODE']
          mp=dest/'metadata.json'; payload=json.loads(mp.read_text(encoding='utf-8')) if mp.exists() else {}
          payload.update({'collection':'چهلستون','episode':os.environ['EPISODE'],'asset_name':os.environ['ASSET_NAME'],'chatgpt_review_ready':True,'review_package_mode':'parallel_per_episode','review_clips_committed':False,'review_package_run_id':os.environ['GITHUB_RUN_ID']})
          mp.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (dest/'review/status.json').write_text(json.dumps({'schema_version':1,'episode':os.environ['EPISODE'],'status':'package_ready','package_run_id':os.environ['GITHUB_RUN_ID'],'assistant_review_committed':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit package independently
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          dest="${COLLECTION_ROOT}/${EPISODE}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest/raw" "$dest/machine" "$dest/final" "$dest/pre_review" "$dest/accuracy" "$dest/review" "$dest/metadata.json"
          git diff --cached --quiet && exit 0
          git commit -m "Add Chehelstoun review package ${EPISODE}"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "/tmp/review-${EPISODE}-input" "/tmp/review-${EPISODE}-runtime"
