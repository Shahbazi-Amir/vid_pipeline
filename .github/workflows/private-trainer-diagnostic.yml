name: Private trainer diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/private-trainer-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PRIVATE_MEDIA_REPO: ${{ secrets.PRIVATE_MEDIA_REPO }}
      PRIVATE_MEDIA_TOKEN: ${{ secrets.PRIVATE_MEDIA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Diagnose trainer prerequisites safely
        shell: bash
        run: |
          set -euo pipefail
          repo_present=false
          token_present=false
          repo_access=false
          release_manifest_ok=false
          manifest_error_code="not_run"
          if [[ -n "${PRIVATE_MEDIA_REPO:-}" ]]; then repo_present=true; fi
          if [[ -n "${PRIVATE_MEDIA_TOKEN:-}" ]]; then token_present=true; fi
          if [[ "$repo_present" == true && "$token_present" == true ]]; then
            code=$(curl -sS -o /tmp/repo.json -w '%{http_code}' \
              -H "Authorization: Bearer $PRIVATE_MEDIA_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$PRIVATE_MEDIA_REPO" || true)
            if [[ "$code" == "200" ]]; then repo_access=true; fi
            if RELEASE_SELECTOR="تربیت مربی" NUMBERING_MODE=auto EXPECTED_NUMBERS="" \
              python scripts/private_release_manifest.py >/tmp/manifest.out 2>/tmp/manifest.err; then
              release_manifest_ok=true
              manifest_error_code="none"
            else
              err=$(cat /tmp/manifest.err)
              case "$err" in
                *"Requested published private release was not found"*) manifest_error_code="release_not_found" ;;
                *"Private release selector is ambiguous"*) manifest_error_code="release_selector_ambiguous" ;;
                *"Selected private release has no supported uploaded media assets"*) manifest_error_code="no_supported_media_assets" ;;
                *"A release asset is missing the required leading result number"*) manifest_error_code="missing_leading_number" ;;
                *"Duplicate result numbers were inferred from private release assets"*) manifest_error_code="duplicate_result_numbers" ;;
                *"Selected private release does not contain the expected result-number set"*) manifest_error_code="unexpected_result_number_set" ;;
                *"HTTP Error 401"*) manifest_error_code="http_401" ;;
                *"HTTP Error 403"*) manifest_error_code="http_403" ;;
                *"HTTP Error 404"*) manifest_error_code="http_404" ;;
                *) manifest_error_code="other_manifest_error" ;;
              esac
            fi
          fi
          REPO_PRESENT="$repo_present" TOKEN_PRESENT="$token_present" REPO_ACCESS="$repo_access" RELEASE_OK="$release_manifest_ok" MANIFEST_ERROR_CODE="$manifest_error_code" python - <<'PY'
          import json, os
          from pathlib import Path
          as_bool = lambda name: os.environ[name].lower() == "true"
          payload = {
            "private_media_repo_present": as_bool("REPO_PRESENT"),
            "private_media_token_present": as_bool("TOKEN_PRESENT"),
            "private_repo_access_ok": as_bool("REPO_ACCESS"),
            "trainer_release_manifest_ok": as_bool("RELEASE_OK"),
            "manifest_error_code": os.environ["MANIFEST_ERROR_CODE"],
          }
          p = Path("benchmarks/private-trainer-diagnostic.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit safe diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/private-trainer-diagnostic.json
          git commit -m "ci: record trainer diagnostic" || exit 0
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
