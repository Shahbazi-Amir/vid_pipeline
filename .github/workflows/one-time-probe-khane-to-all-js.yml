name: One-time probe Khane To all JS

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  probe-all-js:
    if: github.event.pull_request.head.ref == 'agent/trigger-khane-to-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Locate blogSearchURL in page scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,ssl,urllib.parse,urllib.request
          from pathlib import Path
          page='https://www.fintelligence.ir/Blog/List?t=2042'; base='https://www.fintelligence.ir/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':base})
              with urllib.request.urlopen(req,timeout=25,context=ssl.create_default_context()) as r:
                  return r.read().decode(r.headers.get_content_charset() or 'utf-8',errors='replace')
          raw=get(page)
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',raw,flags=re.I)
          results=[]
          for src in srcs:
              url=urllib.parse.urljoin(base,html.unescape(src))
              try: text=get(url)
              except Exception as exc:
                  results.append({'url':url,'error':f'{type(exc).__name__}: {exc}'}); continue
              matches=[]
              for pat in (r'.{0,300}blogSearchURL.{0,500}',r'.{0,300}BlogSearch.{0,500}',r'["\'](/[^"\']*Blog[^"\']*)["\']'):
                  for m in re.finditer(pat,text,flags=re.I|re.S):
                      s=m.group(0) if m.lastindex is None else m.group(m.lastindex or 0)
                      s=re.sub(r'\s+',' ',s).strip()
                      if s not in matches: matches.append(s[:1200])
              if matches: results.append({'url':url,'bytes':len(text.encode("utf-8")),'matches':matches[:30]})
          page_matches=[]
          for m in re.finditer(r'.{0,500}blogSearchURL.{0,800}',raw,flags=re.I|re.S):
              page_matches.append(re.sub(r'\s+',' ',m.group(0)).strip()[:1500])
          payload={'page':page,'page_matches':page_matches,'script_matches':results}
          Path('benchmarks').mkdir(exist_ok=True)
          Path('benchmarks/private-khane-to-all-js-probe.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'page_matches':len(page_matches),'script_files_with_matches':len(results)}))
          PY
      - name: Publish all-JS probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/private-khane-to-all-js-probe.json
          git commit -m 'data: locate Khane To blog search endpoint' || exit 0
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
