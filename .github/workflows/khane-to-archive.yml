name: Archive Khane To interview series

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/khane-to-archive.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khane-to-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: khane-to-rudi-farhadjam-2026-09-08
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Discover official Telegram posts and direct media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp release_assets
          mkdir -p tmp/embed-html tmp/raw release_assets
          python - <<'PY'
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          channel = 'fintelligence_ir'
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'fa,en;q=0.8',
          })

          aliases = {
              1: ['قسمت اول', 'قسمت 1', 'قسمت ۱'],
              2: ['قسمت دوم', 'قسمت 2', 'قسمت ۲'],
              3: ['قسمت سوم', 'قسمت 3', 'قسمت ۳'],
              4: ['قسمت چهارم', 'قسمت 4', 'قسمت ۴'],
              5: ['قسمت پنجم', 'قسمت 5', 'قسمت ۵'],
              6: ['قسمت ششم', 'قسمت 6', 'قسمت ۶'],
              7: ['قسمت هفتم', 'قسمت 7', 'قسمت ۷'],
              8: ['قسمت هشتم', 'قسمت 8', 'قسمت ۸'],
              9: ['قسمت نهم', 'قسمت 9', 'قسمت ۹'],
              10: ['قسمت دهم', 'قسمت 10', 'قسمت ۱۰'],
              11: ['قسمت یازدهم', 'قسمت 11', 'قسمت ۱۱'],
              12: ['قسمت دوازدهم', 'قسمت 12', 'قسمت ۱۲'],
              13: ['قسمت سیزدهم', 'قسمت 13', 'قسمت ۱۳'],
          }

          def find_episode(text):
              for ep, words in aliases.items():
                  if any(w in text for w in words):
                      return ep
              return None

          def extract_media_urls(raw, base_url):
              soup = BeautifulSoup(raw, 'lxml')
              urls = []
              for tag in soup.find_all(True):
                  for attr in ('src', 'data-src', 'data-video', 'data-file', 'href'):
                      value = tag.get(attr)
                      if not value or not isinstance(value, str):
                          continue
                      value = html.unescape(value).replace('\\u0026', '&')
                      if value.startswith('//'):
                          value = 'https:' + value
                      elif value.startswith('/'):
                          value = urljoin(base_url, value)
                      low = value.lower()
                      if (
                          tag.name in ('video', 'source')
                          or '.mp4' in low
                          or 'cdn-telegram' in low
                          or 'telegram-cdn' in low
                          or '/file/' in low
                      ):
                          if value.startswith('http'):
                              urls.append(value)
              # Catch escaped CDN URLs embedded in scripts/styles.
              normalized = html.unescape(raw).replace('\\/', '/').replace('\\u0026', '&')
              patterns = [
                  r'https?://[^\"\'<>\\s]+?\.mp4(?:\?[^\"\'<>\\s]*)?',
                  r'https?://[^\"\'<>\\s]*(?:cdn-telegram|telegram-cdn)[^\"\'<>\\s]*',
              ]
              for pattern in patterns:
                  for value in re.findall(pattern, normalized, flags=re.I):
                      urls.append(value.rstrip('),;'))
              out = []
              for value in urls:
                  if value not in out:
                      out.append(value)
              return out

          matches = []
          errors = []
          # Episode 4 is message 309; scanning 250..380 comfortably covers the whole 13-part run.
          for msg_id in range(250, 381):
              embed = f'https://t.me/{channel}/{msg_id}?embed=1&mode=tme'
              try:
                  r = session.get(embed, timeout=25)
                  if r.status_code != 200:
                      errors.append({'message_id': msg_id, 'status': r.status_code})
                      continue
              except Exception as exc:
                  errors.append({'message_id': msg_id, 'error': repr(exc)})
                  continue

              soup = BeautifulSoup(r.text, 'lxml')
              text = ' '.join(soup.stripped_strings)
              if not (('کمیل رودی' in text) and ('فرهاد جم' in text) and ('خانه تو' in text)):
                  continue

              ep = find_episode(text)
              if not ep:
                  continue

              media = extract_media_urls(r.text, embed)
              match = {
                  'episode': ep,
                  'message_id': msg_id,
                  'post_url': f'https://t.me/{channel}/{msg_id}',
                  'embed_url': embed,
                  'caption': text[:1500],
                  'media_urls': media,
              }
              matches.append(match)
              Path(f'tmp/embed-html/{msg_id}.html').write_text(r.text, encoding='utf-8')
              print(json.dumps(match, ensure_ascii=False))
              time.sleep(0.05)

          by_episode = {ep: [] for ep in range(1, 14)}
          for item in matches:
              by_episode[item['episode']].append(item)
          for items in by_episode.values():
              items.sort(key=lambda x: x['message_id'])

          summary = {
              'channel': channel,
              'scan_range': [250, 380],
              'matches': matches,
              'by_episode': by_episode,
              'errors': errors,
          }
          Path('tmp/discovery.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          missing_posts = [ep for ep, items in by_episode.items() if not items]
          missing_media = [ep for ep, items in by_episode.items() if items and not any(x['media_urls'] for x in items)]
          print('missing_posts=', missing_posts)
          print('missing_media=', missing_media)
          if missing_posts or missing_media:
              raise SystemExit(30)
          PY

      - name: Download Telegram media and assemble 13 episodes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          import requests

          data = json.loads(Path('tmp/discovery.json').read_text(encoding='utf-8'))
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept': '*/*',
          })
          download_log = []

          def download_one(url, target, referer):
              headers = {'Referer': referer}
              with session.get(url, headers=headers, stream=True, timeout=(20, 180), allow_redirects=True) as r:
                  r.raise_for_status()
                  ctype = r.headers.get('content-type', '')
                  total = 0
                  digest = hashlib.sha256()
                  with target.open('wb') as f:
                      for chunk in r.iter_content(chunk_size=1024 * 1024):
                          if not chunk:
                              continue
                          f.write(chunk)
                          digest.update(chunk)
                          total += len(chunk)
              return total, ctype, digest.hexdigest()

          for ep in range(1, 14):
              parts = []
              for part_no, item in enumerate(data['by_episode'][str(ep)], 1):
                  succeeded = None
                  last_error = None
                  for candidate_no, media_url in enumerate(item['media_urls'], 1):
                      target = Path(f'tmp/raw/ep{ep:02d}_part{part_no:02d}_candidate{candidate_no:02d}.mp4')
                      try:
                          size, ctype, sha = download_one(media_url, target, item['embed_url'])
                          # Verify ffmpeg can recognize it as media.
                          probe = subprocess.run(
                              ['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'default=nw=1:nk=1', str(target)],
                              capture_output=True, text=True
                          )
                          if probe.returncode != 0 or not probe.stdout.strip():
                              raise RuntimeError('ffprobe rejected downloaded object')
                          succeeded = target
                          download_log.append({
                              'episode': ep,
                              'part': part_no,
                              'message_id': item['message_id'],
                              'candidate': candidate_no,
                              'size': size,
                              'content_type': ctype,
                              'sha256': sha,
                              'duration': probe.stdout.strip(),
                              'status': 'ok',
                          })
                          break
                      except Exception as exc:
                          last_error = repr(exc)
                          target.unlink(missing_ok=True)
                          download_log.append({
                              'episode': ep,
                              'part': part_no,
                              'message_id': item['message_id'],
                              'candidate': candidate_no,
                              'status': 'failed',
                              'error': last_error,
                          })
                  if not succeeded:
                      print(f'episode {ep} part {part_no} failed: {last_error}')
                      Path('tmp/download-log.json').write_text(json.dumps(download_log, ensure_ascii=False, indent=2), encoding='utf-8')
                      raise SystemExit(40)
                  parts.append(succeeded)

              output = Path(f'release_assets/{ep:02d}.mp4')
              if len(parts) == 1:
                  subprocess.check_call(['ffmpeg', '-y', '-i', str(parts[0]), '-map', '0', '-c', 'copy', str(output)])
              else:
                  concat_file = Path(f'tmp/ep{ep:02d}-concat.txt')
                  concat_file.write_text(
                      ''.join("file '%s'\n" % str(p.resolve()).replace("'", "'\\''") for p in parts),
                      encoding='utf-8',
                  )
                  copy_concat = subprocess.run([
                      'ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', str(concat_file), '-c', 'copy', str(output)
                  ])
                  if copy_concat.returncode != 0:
                      # Fallback for mismatched part parameters.
                      inputs = []
                      for p in parts:
                          inputs += ['-i', str(p)]
                      filters = ''.join(f'[{i}:v:0][{i}:a:0]' for i in range(len(parts))) + f'concat=n={len(parts)}:v=1:a=1[v][a]'
                      subprocess.check_call([
                          'ffmpeg', '-y', *inputs,
                          '-filter_complex', filters,
                          '-map', '[v]', '-map', '[a]',
                          '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '20',
                          '-c:a', 'aac', '-b:a', '160k', str(output)
                      ])

              probe = subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_entries', 'format=duration,size', '-of', 'json', str(output)
              ], text=True)
              print(f'episode {ep:02d}: {probe.strip()}')

          Path('tmp/download-log.json').write_text(
              json.dumps(download_log, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          missing = [ep for ep in range(1, 14) if not Path(f'release_assets/{ep:02d}.mp4').exists()]
          if missing:
              print('missing=', missing)
              raise SystemExit(50)
          PY

      - name: Create GitHub release with all 13 episodes
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find release_assets -maxdepth 1 -name '*.mp4' | wc -l)" -eq 13
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y --cleanup-tag
          fi
          gh release create "$TAG" release_assets/*.mp4 \
            --title "گفتگوی دکتر کمیل رودی و فرهاد جم — ۱۳ قسمت" \
            --notes "آرشیو ۱۳ قسمتی گفتگوی دکتر کمیل رودی و فرهاد جم در برنامه خانه تو، شبکه چهار سیما. قسمت‌های چندبخشی در یک فایل واحد ادغام شده‌اند. فایل‌ها 01.mp4 تا 13.mp4 هستند. منبع: کانال رسمی آکادمی هوش مالی."

      - name: Save diagnostics to repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/khane-to-archive
          cp tmp/discovery.json outputs/khane-to-archive/discovery.json || true
          cp tmp/download-log.json outputs/khane-to-archive/download-log.json || true
          find release_assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > outputs/khane-to-archive/assets.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/khane-to-archive
          if ! git diff --cached --quiet; then
            git commit -m "Record Khane To archive run diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
