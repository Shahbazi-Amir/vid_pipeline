name: Archive Finup Komeil Roudi presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-finup-komeil.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  VIDEO_ID: bpelPbGcBMc
  VIDEO_URL: https://www.youtube.com/watch?v=bpelPbGcBMc
  RELEASE_TAG: finup21-komeil-roudi-financial-literacy
  OUTPUT_BASENAME: Finup21_Komeil_Roudi_Financial_Literacy

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python3 -m pip install --upgrade 'yt-dlp[default,curl-cffi]'
          yt-dlp --version

      - name: Download official Finup video or audio fallback
        id: download
        shell: bash
        run: |
          set -u
          mkdir -p dist logs work
          success=0
          method=''

          attempt_video() {
            label="$1"; shift
            echo "=== VIDEO ATTEMPT: $label ===" | tee -a logs/download.log
            rm -f work/video.*
            if yt-dlp "$@" \
              --no-playlist \
              --retries 3 --fragment-retries 3 \
              --merge-output-format mp4 \
              -f 'bv*+ba/b' \
              -o 'work/video.%(ext)s' \
              "$VIDEO_URL" 2>&1 | tee -a logs/download.log; then
              file=$(find work -maxdepth 1 -type f -name 'video.*' ! -name '*.part' -print -quit)
              if [[ -n "$file" ]] && ffprobe -v error "$file" >/dev/null 2>&1 && [[ $(stat -c%s "$file") -gt 1000000 ]]; then
                mv "$file" "dist/${OUTPUT_BASENAME}.mp4"
                success=1
                method="$label-video"
                return 0
              fi
            fi
            return 1
          }

          attempt_audio() {
            label="$1"; shift
            echo "=== AUDIO ATTEMPT: $label ===" | tee -a logs/download.log
            rm -f work/audio.*
            if yt-dlp "$@" \
              --no-playlist \
              --retries 3 --fragment-retries 3 \
              -f 'ba/b' -x --audio-format mp3 --audio-quality 0 \
              -o 'work/audio.%(ext)s' \
              "$VIDEO_URL" 2>&1 | tee -a logs/download.log; then
              file=$(find work -maxdepth 1 -type f -name 'audio.*' ! -name '*.part' -print -quit)
              if [[ -n "$file" ]] && ffprobe -v error "$file" >/dev/null 2>&1 && [[ $(stat -c%s "$file") -gt 500000 ]]; then
                mv "$file" "dist/${OUTPUT_BASENAME}.mp3"
                success=1
                method="$label-audio"
                return 0
              fi
            fi
            return 1
          }

          attempt_video default || \
          attempt_video web-embedded --extractor-args 'youtube:player_client=web_embedded' || \
          attempt_video android-vr --extractor-args 'youtube:player_client=android_vr' || \
          attempt_video safari --extractor-args 'youtube:player_client=web_safari' --impersonate safari || \
          attempt_video chrome --impersonate chrome || true

          if [[ "$success" -ne 1 ]]; then
            attempt_audio default || \
            attempt_audio web-embedded --extractor-args 'youtube:player_client=web_embedded' || \
            attempt_audio android-vr --extractor-args 'youtube:player_client=android_vr' || \
            attempt_audio chrome --impersonate chrome || true
          fi

          # Current public Invidious instances use rotating/proxied playback to avoid
          # the datacenter-IP bot wall that GitHub-hosted runners hit on YouTube.
          if [[ "$success" -ne 1 ]]; then
            for host in \
              'https://inv.nadeko.net' \
              'https://invidious.nerdvpn.de' \
              'https://yt.chocolatemoo53.com' \
              'https://invidious.tiekoetter.com'; do
              for itag in 18 22; do
                echo "=== INVIDIOUS VIDEO: ${host} itag=${itag} ===" | tee -a logs/download.log
                rm -f work/invidious-video.bin
                if curl -fL --retry 2 --retry-all-errors --connect-timeout 15 --max-time 240 \
                  -A 'Mozilla/5.0' \
                  "${host}/latest_version?id=${VIDEO_ID}&itag=${itag}&local=true" \
                  -o work/invidious-video.bin 2>>logs/download.log; then
                  if [[ -s work/invidious-video.bin ]] && [[ $(stat -c%s work/invidious-video.bin) -gt 1000000 ]] \
                    && ffprobe -v error work/invidious-video.bin >/dev/null 2>&1; then
                    ffmpeg -y -v error -i work/invidious-video.bin -c copy "dist/${OUTPUT_BASENAME}.mp4" \
                      || ffmpeg -y -v error -i work/invidious-video.bin -c:v libx264 -c:a aac "dist/${OUTPUT_BASENAME}.mp4"
                    success=1
                    method="invidious-${host#https://}-itag${itag}-video"
                    break 2
                  fi
                fi
              done
            done
          fi

          if [[ "$success" -ne 1 ]]; then
            for host in \
              'https://inv.nadeko.net' \
              'https://invidious.nerdvpn.de' \
              'https://yt.chocolatemoo53.com' \
              'https://invidious.tiekoetter.com'; do
              for itag in 140 251; do
                echo "=== INVIDIOUS AUDIO: ${host} itag=${itag} ===" | tee -a logs/download.log
                rm -f work/invidious-audio.bin
                if curl -fL --retry 2 --retry-all-errors --connect-timeout 15 --max-time 240 \
                  -A 'Mozilla/5.0' \
                  "${host}/latest_version?id=${VIDEO_ID}&itag=${itag}&local=true" \
                  -o work/invidious-audio.bin 2>>logs/download.log; then
                  if [[ -s work/invidious-audio.bin ]] && [[ $(stat -c%s work/invidious-audio.bin) -gt 500000 ]] \
                    && ffprobe -v error work/invidious-audio.bin >/dev/null 2>&1; then
                    ffmpeg -y -v error -i work/invidious-audio.bin -vn -codec:a libmp3lame -q:a 0 "dist/${OUTPUT_BASENAME}.mp3"
                    success=1
                    method="invidious-${host#https://}-itag${itag}-audio"
                    break 2
                  fi
                fi
              done
            done
          fi

          if [[ "$success" -ne 1 ]]; then
            echo 'All direct and Invidious download strategies failed.' | tee -a logs/download.log
            exit 1
          fi

          media=$(find dist -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mp3' \) -print -quit)
          ffprobe -v error -show_entries format=duration,size,format_name -of json "$media" > dist/media_info.json
          sha256sum "$media" > dist/SHA256SUMS.txt
          printf '%s\n' "$VIDEO_URL" > dist/source_url.txt
          printf '%s\n' "$method" > dist/download_method.txt
          {
            echo 'Finup Event 21 — Money Matters'
            echo 'Speaker: Dr. Komeil Roudi / دکتر کمیل رودی'
            echo "Presentation: What Financial Literacy Is and What It Isn't / سواد مالی چه هست و چه نیست"
            echo 'Official source: Finup Event YouTube channel'
            echo "Video ID: ${VIDEO_ID}"
            echo "Archive method: ${method}"
            echo 'This workflow only archives the media; it does not start transcription.'
          } > dist/README.txt
          ls -lh dist/

      - name: Create or update GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Finup 21 — Komeil Roudi — Financial Literacy" \
              --notes "Official Finup Event presentation by Dr. Komeil Roudi: What Financial Literacy Is and What It Isn't. Media plus provenance, metadata and checksum attached. No transcription is started by this workflow."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finup-komeil-download-logs
          path: logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Report archive result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          method='not available'
          media='not available'
          info='not available'
          [[ -f dist/download_method.txt ]] && method=$(cat dist/download_method.txt)
          found=$(find dist -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mp3' \) -printf '%f\n' 2>/dev/null | head -1 || true)
          [[ -n "$found" ]] && media="$found"
          [[ -f dist/media_info.json ]] && info=$(tr -d '\n' < dist/media_info.json)
          body=$(printf '%s\n' \
            'Finup Komeil archive workflow finished.' \
            '' \
            "- status: ${JOB_STATUS}" \
            "- source: ${VIDEO_URL}" \
            "- video_id: ${VIDEO_ID}" \
            "- media: ${media}" \
            "- method: ${method}" \
            "- media_info: ${info}" \
            "- run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Finup Komeil archive report — ${GITHUB_RUN_ID}" \
            --body "$body"
