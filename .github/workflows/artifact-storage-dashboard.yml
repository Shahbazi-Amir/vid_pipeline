name: Artifact storage dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/artifact-storage-dashboard.yml'
  workflow_run:
    workflows:
      - 'Private Khane To transcription'
      - 'Publish Khane To checkpoints'
      - 'Private Asre Shirin transcription'
      - 'Publish Asre Shirin checkpoints'
      - 'Actions retention cleanup'
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: artifact-storage-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh Artifact Storage Dashboard issue
        uses: actions/github-script@v7
        env:
          DASHBOARD_ISSUE: '44'
          REFERENCE_CAP_MIB: '500'
        with:
          retries: 3
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { ...context.repo, per_page: 100 },
            );
            const live = artifacts.filter(a => !a.expired);
            const bytes = live.reduce((sum, a) => sum + Number(a.size_in_bytes || 0), 0);
            const mib = bytes / (1024 * 1024);
            const capMiB = Number(process.env.REFERENCE_CAP_MIB || '500');
            const capBytes = capMiB * 1024 * 1024;
            const pct = capBytes > 0 ? (bytes / capBytes) * 100 : 0;
            const freeMiB = Math.max(0, capMiB - mib);
            const updated = new Date().toISOString();

            const body = [
              '# Artifact Storage Dashboard',
              '',
              '| مورد | وضعیت |',
              '|---|---:|',
              `| Artifact زنده | **${live.length}** |`,
              `| حجم استفاده‌شده | **${mib.toFixed(2)} MiB** |`,
              `| مرجع ظرفیت | **${capMiB.toFixed(0)} MiB** |`,
              `| درصد استفاده | **${pct.toFixed(2)}%** |`,
              `| فضای باقی‌مانده نسبت به مرجع | **${freeMiB.toFixed(2)} MiB** |`,
              `| حجم دقیق | **${bytes.toLocaleString('en-US')} bytes** |`,
              `| آخرین بروزرسانی UTC | \`${updated}\` |`,
              '',
              '> این صفحه خودکار بعد از workflowهای اصلی تولید/Publisher/Cleanup و همچنین هر ساعت refresh می‌شود.',
              '> برای refresh فوری: Actions → Artifact storage dashboard → Run workflow.',
              '',
              '### Artifactهای فعلی',
              '',
              ...live
                .sort((a, b) => Number(b.size_in_bytes || 0) - Number(a.size_in_bytes || 0))
                .slice(0, 50)
                .map(a => `- **${a.name}** — ${(Number(a.size_in_bytes || 0)/(1024*1024)).toFixed(2)} MiB — run ${a.workflow_run?.id || 'n/a'}`),
              live.length > 50 ? `\n_و ${live.length - 50} Artifact دیگر…_` : '',
            ].join('\n');

            await github.rest.issues.update({
              ...context.repo,
              issue_number: Number(process.env.DASHBOARD_ISSUE),
              title: `Artifact Storage Dashboard — ${mib.toFixed(2)} MiB / ${capMiB.toFixed(0)} MiB`,
              body,
            });

            core.info(`ARTIFACT_STORAGE count=${live.length} bytes=${bytes} mib=${mib.toFixed(4)} pct=${pct.toFixed(4)}`);
