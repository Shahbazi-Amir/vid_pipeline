name: Cleanup legacy diarizer v4

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/cleanup-legacy-diarizer-v4.trigger"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply robust pyannote-only transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import subprocess

          historical = subprocess.check_output([
              'git', 'show',
              '32c31350ec5025a9605f422f07f1f5cab1bdee4a:.github/workflows/cleanup-legacy-diarizer-v2.yml'
          ], text=True)
          begin = historical.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          finish = historical.index("\n          PY\n\n      - name: Compile transformed sources", begin)
          raw = historical[begin:finish]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw.splitlines()
          ) + '\n'

          start = script.index("old_default = dedent('''")
          marker = 'text = text.replace(old_default, new_default, 1)'
          end = script.index(marker, start) + len(marker)
          patch_default = '''start = text.index("    backend = backend or SherpaOnnxDiarizationBackend(")
end = text.index("    attempts = [", start)
new_default = "    if backend is None:\\n        from vid_pipeline.pyannote_diarization import PyannoteDiarizationBackend\\n\\n        backend = PyannoteDiarizationBackend()\\n"
text = text[:start] + new_default + text[end:]'''
          script = script[:start] + patch_default + script[end:]

          start = script.index("old_models = dedent('''")
          marker = 'text = text.replace(old_models, new_models, 1)'
          end = script.index(marker, start) + len(marker)
          patch_models = '''report_start = text.index("    report = {")
models_start = text.index('        "models": {', report_start)
requested_start = text.index('        }, "requested_speaker_count": config.num_speakers,', models_start)
requested_end = requested_start + len('        }, "requested_speaker_count": config.num_speakers,')
new_models = "        \\\"models\\\": (\\n            {\\\"pipeline\\\": str(getattr(backend, \\\"model_id\\\"))}\\n            if getattr(backend, \\\"model_id\\\", \\\"\\\")\\n            else {}\\n        ),\\n        \\\"requested_speaker_count\\\": config.num_speakers,"
text = text[:models_start] + new_models + text[requested_end:]'''
          script = script[:start] + patch_models + script[end:]

          exec(compile(script, 'cleanup-transform-v4', 'exec'), {'__name__': '__main__'})
          PY

      - name: Compile transformed sources
        run: python -m compileall -q src tests scripts

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,worker,diarization-pyannote]'

      - name: Validate pyannote-only repository
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check .
          python -m compileall -q src tests scripts
          git diff --check

      - name: Commit cleanup and self-clean
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/cleanup-legacy-diarizer-v4.trigger
          rm -f .github/workflows/cleanup-legacy-diarizer-v4.yml
          rm -f validation/sherpa-removal-inventory.txt
          rm -f validation/cleanup-run-probe.json
          rm -f validation/cleanup-v2-run-probe.json
          rm -f validation/cleanup-v3-run-probe.json
          python - <<'PY'
          from pathlib import Path
          retired = 'sher' + 'pa'
          matches = []
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if retired in str(path).casefold():
                  matches.append(f'path:{path}')
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if retired in text.casefold():
                  matches.append(f'content:{path}')
          if matches:
              raise SystemExit('retired backend references remain: ' + ', '.join(matches))
          PY
          printf '%s\n' '{"status":"success","backend":"pyannote-community-1","legacy_backend_removed":true,"pytest":"pass","ruff":"pass","compileall":"pass","diff_check":"pass","repository_scan":"pass"}' > validation/diarization-backend-cleanup.json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove legacy diarization backend"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Record failure and self-clean
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          rm -f .github/bootstrap/cleanup-legacy-diarizer-v4.trigger .github/workflows/cleanup-legacy-diarizer-v4.yml
          printf '%s\n' '{"status":"failure","backend":"pyannote-community-1","legacy_backend_removed":false,"attempt":4}' > validation/diarization-backend-cleanup.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: record diarization backend cleanup failure v4" || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
