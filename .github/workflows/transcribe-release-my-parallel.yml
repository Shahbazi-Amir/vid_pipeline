name: Transcribe release my one by one
run-name: Release my — sequential transcription on one runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/transcribe-release-my-parallel.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-my-parallel-transcription
  cancel-in-progress: true

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure repository writer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Inventory media assets from release tag my
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/my",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "vid-pipeline-release-my-inventory",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)

          media_extensions = {
              ".mp3", ".m4a", ".wav", ".flac", ".aac", ".ogg", ".opus",
              ".mp4", ".mkv", ".mov", ".webm", ".mpeg", ".mpg", ".m4v",
          }
          assets = []
          for asset in release.get("assets", []):
              suffix = pathlib.Path(asset["name"]).suffix.lower()
              if suffix in media_extensions:
                  assets.append({
                      "id": asset["id"],
                      "name": asset["name"],
                      "size": asset["size"],
                      "digest": asset.get("digest") or "",
                      "suffix": suffix,
                      "browser_download_url": asset["browser_download_url"],
                  })
          assets.sort(key=lambda item: item["name"].casefold())
          if not assets:
              raise SystemExit("Release tag 'my' contains no supported media assets")
          for index, item in enumerate(assets, start=1):
              item["index"] = f"{index:02d}"

          manifest = {
              "repository": repo,
              "release_tag": "my",
              "release_name": release.get("name"),
              "release_id": release.get("id"),
              "media_asset_count": len(assets),
              "processing_mode": "sequential_one_runner",
              "transcription_profile": "balanced",
              "asr_artifact": "large-v3-turbo-ct2-v1",
              "assets": assets,
          }
          root = pathlib.Path("outputs/release-my")
          root.mkdir(parents=True, exist_ok=True)
          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "status.json").write_text(
              json.dumps({"state": "inventory_complete", "current": None}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Found {len(assets)} media assets")
          for item in assets:
              print(item["index"], item["name"], item["size"])
          PY
          git add -f outputs/release-my/manifest.json outputs/release-my/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh release my transcription inventory"
            git push origin HEAD:main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install transcription worker once
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Transcribe and commit each asset sequentially
        shell: bash
        env:
          PRIVATE_MEDIA_REPO: ${{ github.repository }}
          PRIVATE_MEDIA_TOKEN: ${{ github.token }}
          COLLECTION_ROOT: staging/release-my
          DIARIZATION_ENABLED: "false"
          TRANSCRIPTION_PROFILE: balanced
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/release-my-assets.tsv
          import json
          from pathlib import Path
          manifest = json.loads(Path("outputs/release-my/manifest.json").read_text(encoding="utf-8"))
          for item in manifest["assets"]:
              fields = [
                  item["index"], str(item["id"]), item["name"], str(item["size"]),
                  item.get("digest", ""), item["suffix"], item["browser_download_url"],
              ]
              print("\t".join(value.replace("\t", " ").replace("\n", " ") for value in fields))
          PY

          write_status() {
            local state="$1"
            local error_text="${2:-}"
            STATE="$state" ERROR_TEXT="$error_text" python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("outputs/release-my/status.json")
          payload = {
              "state": os.environ["STATE"],
              "current": {
                  "index": os.environ.get("RESULT_NUMBER", ""),
                  "asset_name": os.environ.get("ASSET_NAME", ""),
              },
          }
          error = os.environ.get("ERROR_TEXT", "")
          if error:
              payload["error"] = error
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          }

          commit_paths() {
            local message="$1"
            shift
            git add -f "$@"
            if ! git diff --cached --quiet; then
              git commit -m "$message"
              git push origin HEAD:main
            fi
          }

          while IFS=$'\t' read -r RESULT_NUMBER ASSET_ID ASSET_NAME EXPECTED_SIZE EXPECTED_DIGEST MEDIA_SUFFIX ASSET_URL; do
            export RESULT_NUMBER ASSET_ID ASSET_NAME EXPECTED_SIZE EXPECTED_DIGEST MEDIA_SUFFIX ASSET_URL

            if [[ -s "outputs/release-my/raw/md/$RESULT_NUMBER.md" ]]; then
              echo "Transcript $RESULT_NUMBER already exists; skipping."
              continue
            fi

            write_status "processing"
            commit_paths "Start release my transcript $RESULT_NUMBER: $ASSET_NAME" outputs/release-my/status.json

            rm -rf "$COLLECTION_ROOT"
            if ! bash scripts/process_private_release_asset.sh; then
              git restore outputs 2>/dev/null || true
              write_status "failed" "transcription worker failed"
              commit_paths "Record failure for release my transcript $RESULT_NUMBER" outputs/release-my/status.json
              exit 1
            fi

            git restore outputs 2>/dev/null || true

            python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["COLLECTION_ROOT"])
          number = os.environ["RESULT_NUMBER"]
          name = os.environ["ASSET_NAME"]
          url = os.environ["ASSET_URL"]
          header_md = (
              "## منبع فایل\n"
              "- Release: `my`\n"
              f"- Asset: `{name}`\n"
              f"- URL: {url}\n\n"
          )
          header_txt = (
              "منبع فایل:\n"
              "Release: my\n"
              f"Asset: {name}\n"
              f"URL: {url}\n\n"
          )
          for path in (root / "md" / f"{number}.md", root / "timestamped" / f"{number}.md"):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("## منبع فایل"):
                  path.write_text(header_md + text, encoding="utf-8")
          txt_path = root / "txt" / f"{number}.txt"
          text = txt_path.read_text(encoding="utf-8")
          if not text.startswith("منبع فایل:"):
              txt_path.write_text(header_txt + text, encoding="utf-8")

          meta_dir = root / "assets"
          meta_dir.mkdir(parents=True, exist_ok=True)
          (meta_dir / f"{number}.json").write_text(
              json.dumps({
                  "release_tag": "my",
                  "asset_id": int(os.environ["ASSET_ID"]),
                  "asset_name": name,
                  "size": int(os.environ["EXPECTED_SIZE"]),
                  "digest": os.environ.get("EXPECTED_DIGEST", ""),
                  "browser_download_url": url,
                  "transcription_profile": "balanced",
                  "asr_artifact": "large-v3-turbo-ct2-v1",
                  "review_status": "pending_chatgpt_review",
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

            mkdir -p outputs/release-my/raw/md outputs/release-my/raw/timestamped outputs/release-my/raw/txt outputs/release-my/assets
            cp "$COLLECTION_ROOT/md/$RESULT_NUMBER.md" "outputs/release-my/raw/md/$RESULT_NUMBER.md"
            cp "$COLLECTION_ROOT/timestamped/$RESULT_NUMBER.md" "outputs/release-my/raw/timestamped/$RESULT_NUMBER.md"
            cp "$COLLECTION_ROOT/txt/$RESULT_NUMBER.txt" "outputs/release-my/raw/txt/$RESULT_NUMBER.txt"
            cp "$COLLECTION_ROOT/assets/$RESULT_NUMBER.json" "outputs/release-my/assets/$RESULT_NUMBER.json"
            write_status "raw_transcript_committed"

            commit_paths "Add raw release my transcript $RESULT_NUMBER: $ASSET_NAME" \
              "outputs/release-my/raw/md/$RESULT_NUMBER.md" \
              "outputs/release-my/raw/timestamped/$RESULT_NUMBER.md" \
              "outputs/release-my/raw/txt/$RESULT_NUMBER.txt" \
              "outputs/release-my/assets/$RESULT_NUMBER.json" \
              outputs/release-my/status.json
          done < /tmp/release-my-assets.tsv

          RESULT_NUMBER="" ASSET_NAME="" write_status "all_raw_transcripts_complete"
          commit_paths "Complete raw transcription for release my" outputs/release-my/status.json
