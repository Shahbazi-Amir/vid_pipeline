name: Collection Output Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/collection-output-validation.trigger"

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Implement collection output mode
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cli_path = Path('src/vid_pipeline/cli.py')
          text = cli_path.read_text(encoding='utf-8')

          parser_anchor = '''    _add_github_options(github_file)\n    github_file.add_argument("--yes", action="store_true")\n'''
          parser_replacement = '''    _add_github_options(github_file)\n    github_file.add_argument(\n        "--collection-output-root",\n        type=Path,\n        default=None,\n        help="Store the three final transcript files in numbered collection folders.",\n    )\n    github_file.add_argument("--result-number", type=int, default=None)\n    github_file.add_argument("--yes", action="store_true")\n'''
          if parser_anchor not in text:
              raise SystemExit('github-submit-file parser anchor not found')
          text = text.replace(parser_anchor, parser_replacement, 1)

          artifact_flag = '''    github_file.add_argument("--delete-result-artifact-after-download", action="store_true")\n'''
          artifact_replacement = '''    github_file.add_argument(\n        "--delete-result-artifact-after-download",\n        "--delete-result-artifact-after-save",\n        dest="delete_result_artifact_after_download",\n        action="store_true",\n    )\n'''
          if artifact_flag not in text:
              raise SystemExit('artifact cleanup flag anchor not found')
          text = text.replace(artifact_flag, artifact_replacement, 1)

          client_anchor = '''def _github_client(args: argparse.Namespace):\n    from vid_pipeline.github_compat import client_from_args\n\n    return client_from_args(args)\n'''
          client_replacement = '''def _github_client(args: argparse.Namespace):\n    from vid_pipeline.github_compat import client_from_args\n\n    client = client_from_args(args)\n    if getattr(args, "collection_output_root", None) is not None:\n        client.output_root = Path(".vid_pipeline/github-results")\n    return client\n'''
          if client_anchor not in text:
              raise SystemExit('_github_client anchor not found')
          text = text.replace(client_anchor, client_replacement, 1)

          submit_anchor = '''    client = _github_client(args)\n    request = client.process_file(args.path, **_github_options(args))\n'''
          submit_replacement = '''    client = _github_client(args)\n    options = _github_options(args)\n    if args.collection_output_root is not None:\n        options["wait"] = True\n        options["download"] = True\n    request = client.process_file(args.path, **options)\n    if (\n        args.collection_output_root is not None\n        and request.status in {"validated", "completed"}\n        and request.output_path\n    ):\n        from vid_pipeline.collection_output import materialize_collection_output\n\n        target = materialize_collection_output(\n            Path(request.output_path),\n            args.collection_output_root,\n            args.path,\n            result_number=args.result_number,\n        )\n        request.output_path = str(target)\n        client.state.save(request)\n'''
          if submit_anchor not in text:
              raise SystemExit('command_github_submit_file anchor not found')
          text = text.replace(submit_anchor, submit_replacement, 1)
          cli_path.write_text(text, encoding='utf-8')

          Path('src/vid_pipeline/collection_output.py').write_text('''"""Materialize validated GitHub transcript artifacts into a numbered collection."""\n\nfrom __future__ import annotations\n\nimport re\nimport shutil\nimport uuid\nfrom pathlib import Path\n\n\n_FINAL_FILES = {\n    "transcript.md": ("md", ".md"),\n    "transcript.timestamped.md": ("timestamped", ".md"),\n    "transcript.txt": ("txt", ".txt"),\n}\n\n\ndef infer_result_number(source: Path, explicit: int | None = None) -> int:\n    if explicit is not None:\n        if explicit < 1:\n            raise ValueError("result number must be positive")\n        return explicit\n    match = re.match(r"^(\\d+)(?:[. _-]|$)", source.name)\n    if not match:\n        raise ValueError(\n            "Could not infer result number from filename; use --result-number."\n        )\n    return int(match.group(1))\n\n\ndef materialize_collection_output(\n    downloaded: Path,\n    collection_root: Path,\n    source: Path,\n    *,\n    result_number: int | None = None,\n) -> Path:\n    downloaded = downloaded.resolve()\n    if not downloaded.is_dir():\n        raise ValueError(f"downloaded result directory does not exist: {downloaded}")\n    number = infer_result_number(source, result_number)\n    files = {item.name: item for item in downloaded.iterdir() if item.is_file()}\n    if set(files) != set(_FINAL_FILES):\n        raise ValueError("validated result must contain exactly the three final transcript files")\n\n    root = collection_root.resolve()\n    targets: dict[Path, Path] = {}\n    for filename, (folder, suffix) in _FINAL_FILES.items():\n        target = root / folder / f"{number}{suffix}"\n        source_file = files[filename]\n        if target.exists() and target.read_bytes() != source_file.read_bytes():\n            raise ValueError(f"collection output already exists with different content: {target}")\n        targets[source_file] = target\n\n    for source_file, target in targets.items():\n        target.parent.mkdir(parents=True, exist_ok=True)\n        if target.exists():\n            continue\n        temporary = target.with_name(f".{target.name}.{uuid.uuid4().hex}.tmp")\n        shutil.copy2(source_file, temporary)\n        temporary.replace(target)\n\n    shutil.rmtree(downloaded)\n    parent = downloaded.parent\n    if parent.name == "github-results" and parent.exists() and not any(parent.iterdir()):\n        parent.rmdir()\n    return root\n''', encoding='utf-8')

          Path('tests/test_collection_output.py').write_text('''from pathlib import Path\n\nimport pytest\n\nfrom vid_pipeline import cli\nfrom vid_pipeline.cli import build_parser\nfrom vid_pipeline.collection_output import (\n    infer_result_number,\n    materialize_collection_output,\n)\nfrom vid_pipeline.github_client import GitHubRequest\n\n\ndef _three_files(root: Path) -> None:\n    root.mkdir(parents=True)\n    (root / "transcript.md").write_text("markdown\\n", encoding="utf-8")\n    (root / "transcript.timestamped.md").write_text("timed\\n", encoding="utf-8")\n    (root / "transcript.txt").write_text("text\\n", encoding="utf-8")\n\n\ndef test_infer_result_number_from_tehran_filename():\n    assert infer_result_number(Path("2.پلکان توانمندی مالی.m4v")) == 2\n    assert infer_result_number(Path("anything.m4v"), 38) == 38\n\n\ndef test_materialize_collection_output_moves_three_files(tmp_path: Path):\n    downloaded = tmp_path / ".vid_pipeline/github-results/request-2"\n    _three_files(downloaded)\n    collection = tmp_path / "outputs/uni_tehran"\n\n    result = materialize_collection_output(\n        downloaded, collection, Path("2.پلکان توانمندی مالی.m4v")\n    )\n\n    assert result == collection.resolve()\n    assert (collection / "md/2.md").read_text(encoding="utf-8") == "markdown\\n"\n    assert (collection / "timestamped/2.md").read_text(encoding="utf-8") == "timed\\n"\n    assert (collection / "txt/2.txt").read_text(encoding="utf-8") == "text\\n"\n    assert not downloaded.exists()\n\n\ndef test_materialize_refuses_different_existing_output(tmp_path: Path):\n    downloaded = tmp_path / "downloads/request-2"\n    _three_files(downloaded)\n    collection = tmp_path / "outputs/uni_tehran"\n    (collection / "md").mkdir(parents=True)\n    (collection / "md/2.md").write_text("different\\n", encoding="utf-8")\n\n    with pytest.raises(ValueError, match="different content"):\n        materialize_collection_output(downloaded, collection, Path("2.test.m4v"))\n    assert downloaded.exists()\n\n\ndef test_collection_cli_forces_wait_download_and_materializes(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n):\n    source = tmp_path / "2.test.m4v"\n    source.write_bytes(b"media")\n    downloaded = tmp_path / "internal/request-2"\n    _three_files(downloaded)\n    captured = {}\n\n    class State:\n        def save(self, request):\n            captured["saved_output"] = request.output_path\n\n    class Client:\n        state = State()\n\n        def process_file(self, path, **options):\n            captured.update(options)\n            return GitHubRequest(\n                request_id="request-2",\n                local_path=str(path),\n                status="completed",\n                output_path=str(downloaded),\n            )\n\n    monkeypatch.setattr(cli, "_github_client", lambda args: Client())\n    collection = tmp_path / "outputs/uni_tehran"\n    args = build_parser().parse_args(\n        [\n            "github-submit-file",\n            str(source),\n            "--collection-output-root",\n            str(collection),\n            "--yes",\n        ]\n    )\n\n    assert cli.command_github_submit_file(args) == 0\n    assert captured["wait"] is True\n    assert captured["download"] is True\n    assert captured["saved_output"] == str(collection.resolve())\n    assert (collection / "md/2.md").exists()\n    assert not downloaded.exists()\n''', encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          ruff check .
          python -m compileall -q src tests
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vid_pipeline/cli.py src/vid_pipeline/collection_output.py tests/test_collection_output.py
          git commit -m "feat: save GitHub results into numbered collections"
          git push origin HEAD:main
