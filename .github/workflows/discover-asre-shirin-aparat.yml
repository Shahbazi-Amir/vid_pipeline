name: Discover Asre Shirin Aparat links
run-name: Discover Asre Shirin Aparat links #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/asre-shirin-aparat-discovery.trigger"

permissions:
  contents: write

concurrency:
  group: discover-asre-shirin-aparat
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe current Aparat channel HTML
        id: probe
        shell: bash
        run: |
          set +e
          python scripts/probe_aparat_channel_html.py > /tmp/probe.stdout 2> /tmp/probe.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/probe.stdout || true
          cat /tmp/probe.stderr >&2 || true

      - name: Try legacy Aparat discovery API
        id: discover
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p sources/asre_shirin
          set +e
          python scripts/discover_asre_shirin_aparat.py > sources/asre_shirin/discovery.stdout.txt 2> sources/asre_shirin/discovery.stderr.txt
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf 'exit_status=%s\n' "$status" > sources/asre_shirin/discovery.status.txt
          cat sources/asre_shirin/discovery.stdout.txt || true
          cat sources/asre_shirin/discovery.stderr.txt >&2 || true

      - name: Publish probe, discovery manifest, and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/asre_shirin
          if git diff --cached --quiet; then
            echo "Discovery output unchanged"
            exit 0
          fi
          git commit -m "data: record Asre Shirin Aparat discovery"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Require complete 1..26 manifest
        shell: bash
        env:
          DISCOVERY_STATUS: ${{ steps.discover.outputs.status }}
        run: |
          set -euo pipefail
          [[ "$DISCOVERY_STATUS" == "0" ]] || exit "$DISCOVERY_STATUS"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("sources/asre_shirin/aparat_manifest.json").read_text(encoding="utf-8"))
          numbers = [int(row["result_number"]) for row in data["videos"]]
          assert numbers == list(range(1, 27)), numbers
          assert data["complete"] is True
          assert data["discovered_count"] == 26
          print("Validated Asre Shirin Aparat manifest: 26/26")
          PY
