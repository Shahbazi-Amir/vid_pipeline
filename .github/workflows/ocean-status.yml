name: Ocean Aram status probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocean-status.yml'
permissions:
  contents: write
  actions: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture Ocean Aram status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ops/ocean-aram-komeil
          gh run list --workflow ocean-aram-probe.yml --limit 10 --json databaseId,status,conclusion,createdAt,updatedAt,url > /tmp/ingest.json
          gh run list --workflow ocean-aram-asr.yml --limit 10 --json databaseId,status,conclusion,createdAt,updatedAt,url > /tmp/asr.json
          python - <<'PY'
          import json, datetime
          out={'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'ingest_runs':json.load(open('/tmp/ingest.json')),'asr_runs':json.load(open('/tmp/asr.json'))}
          open('ops/ocean-aram-komeil/status.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Save status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/ocean-aram-komeil/status.json
          git commit -m 'Record Ocean Aram status'
          git pull --rebase origin main
          git push origin HEAD:main
