name: Publish local Asre review v2

on:
  push:
    paths:
      - ".review_payload/asre_v2.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: publish-local-asre-review-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"pending\",\"context\":\"asre-shirin/local-review-v2-publish\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode exact locally reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .review_payload/asre_v2.part* | base64 -d > /tmp/asre_review_v2_78.tar.gz
          echo '76b2e84a3f6f097b0e322b87dbb10a8cb720dbcef4dfe9888ad43c71a1c21fd6  /tmp/asre_review_v2_78.tar.gz' | sha256sum -c -
          rm -rf /tmp/asre-review
          mkdir -p /tmp/asre-review
          tar -xzf /tmp/asre_review_v2_78.tar.gz -C /tmp/asre-review
      - name: Validate 26 x 3 reviewed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/asre-review')
          for kind, ext in [('timestamped','md'),('md','md'),('txt','txt')]:
              got={p.stem for p in (root/kind).glob(f'*.{ext}') if p.is_file() and p.stat().st_size>0}
              exp={str(i) for i in range(1,27)}
              assert got==exp, (kind, sorted(exp-got), sorted(got-exp))
          for p in (root/'timestamped').glob('*.md'):
              s=p.read_text(encoding='utf-8')
              assert 'نامشخص' not in s and 'گویمده' not in s and 'گوینداره' not in s
          print('validated 78 exact local review files')
          PY
      - name: Replace legacy review and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf outputs/asre_shirin/review
          mkdir -p outputs/asre_shirin/review
          cp -a /tmp/asre-review/timestamped outputs/asre_shirin/review/
          cp -a /tmp/asre-review/md outputs/asre_shirin/review/
          cp -a /tmp/asre-review/txt outputs/asre_shirin/review/
          rm -rf .review_payload
          git rm -f .github/workflows/publish-local-asre-review-v2.yml
          git add outputs/asre_shirin/review
          git commit -m 'review: publish 26 locally reviewed Asre Shirin transcripts v2'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
