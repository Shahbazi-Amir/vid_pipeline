name: Release input smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/release-input-test.trigger'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Benchmark latest non-temporary draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmarks
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import traceback
          import urllib.error
          import urllib.request

          report_path = "benchmarks/release-input-latest.json"

          def write_report(report):
              with open(report_path, "w", encoding="utf-8") as output:
                  json.dump(report, output, ensure_ascii=False, indent=2)
                  output.write("\n")
              print(json.dumps(report, ensure_ascii=False, indent=2))

          try:
              api = "https://api.github.com"
              repo = os.environ["GITHUB_REPOSITORY"]
              token = os.environ["GH_TOKEN"]
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "vid-pipeline-release-smoke-test",
              }

              def request_json(url):
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=120) as response:
                      return json.load(response)

              releases = request_json(f"{api}/repos/{repo}/releases?per_page=100")
              candidates = [
                  release
                  for release in releases
                  if release.get("draft")
                  and release.get("tag_name") != "vid-pipeline-temporary-inputs"
                  and release.get("name") != "vid-pipeline-temporary-inputs"
              ]
              selected = None
              selected_assets = []
              for release in candidates:
                  assets = request_json(
                      f"{api}/repos/{repo}/releases/{int(release['id'])}/assets?per_page=100"
                  )
                  if assets:
                      selected = release
                      selected_assets = assets
                      break
              if selected is None:
                  write_report(
                      {
                          "status": "error",
                          "repository": repo,
                          "error": "No non-temporary draft release with assets was found in this repository.",
                          "draft_release_count_seen": len(candidates),
                      }
                  )
                  raise SystemExit(0)

              results = []
              for index, asset in enumerate(selected_assets[:2], start=1):
                  browser_url = str(asset.get("browser_download_url") or "")
                  public_status = None
                  if browser_url:
                      try:
                          req = urllib.request.Request(
                              browser_url,
                              headers={"User-Agent": "vid-pipeline-public-check"},
                          )
                          with urllib.request.urlopen(req, timeout=30) as response:
                              public_status = int(response.status)
                      except urllib.error.HTTPError as exc:
                          public_status = int(exc.code)
                      except Exception:
                          public_status = -1

                  asset_id = int(asset["id"])
                  req = urllib.request.Request(
                      f"{api}/repos/{repo}/releases/assets/{asset_id}",
                      headers={**headers, "Accept": "application/octet-stream"},
                  )
                  target = f"/tmp/release-asset-{index}"
                  digest = hashlib.sha256()
                  started = time.monotonic()
                  with urllib.request.urlopen(req, timeout=120) as response, open(target, "wb") as output:
                      while chunk := response.read(1024 * 1024):
                          digest.update(chunk)
                          output.write(chunk)
                  elapsed = max(time.monotonic() - started, 0.001)
                  size = os.path.getsize(target)
                  expected_size = int(asset.get("size", -1))
                  if expected_size >= 0 and size != expected_size:
                      raise RuntimeError(f"Asset {index} size mismatch")
                  actual_digest = digest.hexdigest()
                  expected_digest = str(asset.get("digest") or "")
                  if expected_digest.startswith("sha256:") and expected_digest != f"sha256:{actual_digest}":
                      raise RuntimeError(f"Asset {index} digest mismatch")
                  os.remove(target)
                  results.append(
                      {
                          "asset_index": index,
                          "size_bytes": size,
                          "download_seconds": round(elapsed, 3),
                          "download_mib_per_second": round(size / 1024 / 1024 / elapsed, 3),
                          "unauthenticated_http_status": public_status,
                          "sha256_verified_from_release_metadata": expected_digest.startswith("sha256:"),
                      }
                  )

              privacy_pass = all(
                  item["unauthenticated_http_status"] not in {200, 206}
                  for item in results
              )
              write_report(
                  {
                      "status": "ok" if privacy_pass else "privacy_failed",
                      "repository": repo,
                      "release_is_draft": bool(selected.get("draft")),
                      "release_asset_count": len(selected_assets),
                      "assets_tested": len(results),
                      "assets": results,
                      "privacy_pass": privacy_pass,
                  }
              )
          except SystemExit:
              raise
          except Exception as exc:
              write_report(
                  {
                      "status": "error",
                      "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                      "error_type": type(exc).__name__,
                      "error": str(exc),
                  }
              )
              traceback.print_exc()
          PY

      - name: Persist benchmark result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/release-input-latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record release input benchmark"
          git pull --rebase origin main
          git push origin HEAD:main
