name: Post-Chehelstoun media queue v2
run-name: Post-Chehelstoun media queue v2 ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-chehelstoun-media-queue-v2.yml'
  workflow_run:
    workflows: ["Chehelstoun parallel transcription"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

env:
  PROFILE: balanced
  LANGUAGE: fa
  AUDIO_PROFILE: safe
  VID_PIPELINE_ACCURACY_MODE: balanced
  CHEHELSTOUN_RELEASE_TAG: chehelstoun-archive-v1
  VOICE_ASSET_NAME: Voice.260817_165035.m4a

concurrency:
  group: post-chehelstoun-heavy-asr-v2
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify all 38 Chehelstoun transcripts exist
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          missing=0
          for n in $(seq 1 38); do
            ep=$(printf '%02d' "$n")
            [[ -s "outputs/chehelstoun/${ep}/delivery/transcript.txt" ]] || missing=$((missing + 1))
          done
          test "$missing" -eq 0

      - name: Record live run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/media-queue
          cat > ops/media-queue/latest-run.json <<EOF
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "workflow": "Post-Chehelstoun media queue v2",
            "parallel_workers": 3,
            "items": ["mizan", "voice-260817-165035", "ketab-baz"]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ops/media-queue/latest-run.json
          if ! git diff --cached --quiet; then
            git commit -m "Record post-Chehelstoun parallel run ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Discover Mizan Voice and Ketab Baz assets
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          releases = json.loads(Path('/tmp/releases.json').read_text(encoding='utf-8'))
          media_exts = {'.mp3', '.m4a', '.wav', '.flac', '.aac', '.ogg', '.opus', '.mp4', '.mkv', '.mov', '.webm'}
          def media_assets(r): return [a for a in r.get('assets', []) if Path(a.get('name','')).suffix.lower() in media_exts]
          cheh_tag = os.environ['CHEHELSTOUN_RELEASE_TAG']; voice_name = os.environ['VOICE_ASSET_NAME']
          cheh = next((r for r in releases if r.get('tag_name') == cheh_tag), None)
          if not cheh: raise SystemExit('Chehelstoun release not found')
          extras = [a for a in media_assets(cheh) if not re.match(r'^\d{2}(?:\D|$)', a.get('name',''))]
          voice = next((a for a in extras if a.get('name') == voice_name), None)
          if not voice: raise SystemExit(f'Voice asset not found: {voice_name}')
          mizan_pool = [a for a in extras if a.get('name') != voice_name]
          named = [a for a in mizan_pool if 'mizan' in a.get('name','').lower() or 'میزان' in a.get('name','')]
          if named: mizan = sorted(named, key=lambda a:a.get('created_at',''))[-1]
          elif len(mizan_pool)==1: mizan=mizan_pool[0]
          else: raise SystemExit(f'Ambiguous Mizan candidates: {[a.get("name") for a in mizan_pool]}')
          def score(r):
              text=' '.join([r.get('tag_name',''),r.get('name','')]+[a.get('name','') for a in r.get('assets',[])])
              low=text.lower(); s=0
              if 'کتاب' in text:s+=5
              if any(x in low for x in ('bookbaz','book-baz','book_baz','ketabbaz','ketab-baz','ketab_baz')):s+=5
              if 'ketab' in low:s+=2
              if 'book' in low:s+=1
              return s
          candidates=[r for r in releases if r.get('tag_name')!=cheh_tag and media_assets(r) and score(r)>0]
          if not candidates: raise SystemExit('No Ketab Baz release with media found')
          br=sorted(candidates,key=lambda r:(score(r),r.get('published_at') or ''),reverse=True)[0]
          book=sorted(media_assets(br),key=lambda a:a.get('created_at',''))[-1]
          matrix={'include':[
            {'slug':'mizan','display':'میزان','output_root':'outputs/mizan/01','asset_name':mizan['name'],'asset_url':mizan['browser_download_url'],'asset_size':mizan['size'],'release_tag':cheh_tag,'hotwords':'میزان، کمیل رودی، دکتر کمیل رودی، سواد مالی'},
            {'slug':'voice-260817-165035','display':'Voice 260817 165035','output_root':'outputs/voice-260817-165035/01','asset_name':voice['name'],'asset_url':voice['browser_download_url'],'asset_size':voice['size'],'release_tag':cheh_tag,'hotwords':'کمیل رودی، دکتر کمیل رودی، سواد مالی'},
            {'slug':'ketab-baz','display':'کتاب‌باز','output_root':'outputs/ketab-baz/01','asset_name':book['name'],'asset_url':book['browser_download_url'],'asset_size':book['size'],'release_tag':br.get('tag_name',''),'hotwords':'کتاب باز، کتاب‌باز، کمیل رودی، دکتر کمیل رودی، سروش صحت'}
          ]}
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as f:
              f.write('matrix='+json.dumps(matrix,ensure_ascii=False,separators=(',',':'))+'\n')
          PY

  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SLUG: ${{ matrix.slug }}
      DISPLAY: ${{ matrix.display }}
      DEST: ${{ matrix.output_root }}
      ASSET_NAME: ${{ matrix.asset_name }}
      ASSET_URL: ${{ matrix.asset_url }}
      ASSET_SIZE: ${{ matrix.asset_size }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      HOTWORDS: ${{ matrix.hotwords }}
      VID_PIPELINE_ASR_CACHE: ${{ github.workspace }}/.cache/vid-pipeline/asr
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect existing complete output
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          if [[ -s "$DEST/review/assistant-review-package.json" && -s "$DEST/pre_review/transcript.pre-review.json" && -s "$DEST/accuracy/transcript.consensus.json" && -s "$DEST/delivery/transcript.txt" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache ASR model
        if: steps.existing.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.VID_PIPELINE_ASR_CACHE }}
          key: asr-${{ runner.os }}-py311-faster-whisper-1.2.1-large-v3-turbo-v1

      - name: Install worker dependencies
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl rsync
          python -m pip install --upgrade pip
          pip install -e '.[worker]'

      - name: Download and validate media
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/${SLUG}-input"
          input="/tmp/${SLUG}-input/${ASSET_NAME}"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 "$ASSET_URL" -o "$input"
          test "$(stat -c %s "$input")" -eq "$ASSET_SIZE"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$input" | grep -q .

      - name: Run Persian ASR pipeline
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          input="/tmp/${SLUG}-input/${ASSET_NAME}"
          rm -rf "/tmp/${SLUG}-runtime"; mkdir -p "/tmp/${SLUG}-runtime"
          title="${ASSET_NAME%.*}"
          vid-pipeline run-file "$input" --name "$SLUG" --output-root "/tmp/${SLUG}-runtime" --profile "$PROFILE" --language "$LANGUAGE" --device cpu --compute-type int8 --audio-profile "$AUDIO_PROFILE" --hotwords "$HOTWORDS" --title "$title" --program "$DISPLAY" --speaker "دکتر کمیل رودی" --source-url "$ASSET_URL" --no-editorial

      - name: Build review-ready output
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          job_dir=$(find "/tmp/${SLUG}-runtime" -mindepth 1 -maxdepth 1 -type d -name "${SLUG}-*" -print -quit)
          test -s "$job_dir/delivery/transcript.txt"
          test -s "$job_dir/pre_review/transcript.pre-review.json"
          test -s "$job_dir/accuracy/transcript.consensus.json"
          test -s "$job_dir/review/assistant-review-package.json"
          rm -rf "$DEST"; mkdir -p "$DEST"
          for d in delivery pre_review accuracy review raw machine final; do
            if [[ -d "$job_dir/$d" ]]; then
              mkdir -p "$DEST/$d"
              rsync -a --exclude 'clips/' --exclude '*.mp3' --exclude '*.m4a' --exclude '*.wav' --exclude '*.flac' --exclude '*.aac' --exclude '*.ogg' --exclude '*.opus' --exclude '*.mp4' --exclude '*.mkv' --exclude '*.mov' --exclude '*.webm' "$job_dir/$d/" "$DEST/$d/"
            fi
          done
          [[ -f "$job_dir/result.json" ]] && cp "$job_dir/result.json" "$DEST/result.json"
          [[ -f "$job_dir/source.json" ]] && cp "$job_dir/source.json" "$DEST/source.json"
          python - "$DEST/metadata.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          p={'collection':os.environ['DISPLAY'],'asset_name':os.environ['ASSET_NAME'],'source_release_tag':os.environ['RELEASE_TAG'],'source_url':os.environ['ASSET_URL'],'profile':os.environ['PROFILE'],'asr_model':'large-v3-turbo','language':os.environ['LANGUAGE'],'audio_profile':os.environ['AUDIO_PROFILE'],'accuracy_mode':os.environ['VID_PIPELINE_ACCURACY_MODE'],'editorial':False,'chatgpt_review_ready':True,'review_clips_committed':False,'pipeline_run_id':os.environ['GITHUB_RUN_ID'],'parallel_workers':3}
          Path(sys.argv[1]).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit this item independently
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"; git commit -m "Add ${DISPLAY} transcript and review package"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Cleanup temporary media
        if: always()
        shell: bash
        run: |
          rm -rf "/tmp/${SLUG}-input" "/tmp/${SLUG}-runtime"
