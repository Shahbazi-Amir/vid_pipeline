name: Recover orphaned Asre review payload
on:
  push:
    branches: [main]
    paths:
      - '.github/recover-orphaned-asre.trigger'
permissions:
  contents: read
  statuses: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"recovery/asre-orphaned-review\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - uses: actions/checkout@v4
        with:
          ref: recovery/asre-review-20260811
      - name: Decode and inspect orphaned payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovered
          base64 -d .recovery/asre_payload.xz > /tmp/payload.xz
          xz -t /tmp/payload.xz
          xz -dc /tmp/payload.xz > /tmp/recovered/payload.bin
          file /tmp/recovered/payload.bin | tee /tmp/recovered/file.txt
          sha256sum /tmp/recovered/payload.bin | tee /tmp/recovered/sha256.txt
          wc -c /tmp/recovered/payload.bin | tee /tmp/recovered/size.txt
          if tar -tf /tmp/recovered/payload.bin > /tmp/recovered/tar-list.txt 2>/dev/null; then
            mkdir -p /tmp/recovered/extracted
            tar -xf /tmp/recovered/payload.bin -C /tmp/recovered/extracted
          elif base64 -d /tmp/recovered/payload.bin > /tmp/recovered/second.bin 2>/dev/null; then
            file /tmp/recovered/second.bin | tee /tmp/recovered/second-file.txt
            if tar -tf /tmp/recovered/second.bin > /tmp/recovered/second-tar-list.txt 2>/dev/null; then
              mkdir -p /tmp/recovered/extracted
              tar -xf /tmp/recovered/second.bin -C /tmp/recovered/extracted
            fi
          fi
          find /tmp/recovered -maxdepth 4 -type f -printf '%P\t%s bytes\n' | sort > /tmp/recovered/inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-asre-review-payload
          path: /tmp/recovered/**
          retention-days: 3
          if-no-files-found: error
      - name: Mark success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"recovery/asre-orphaned-review\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
