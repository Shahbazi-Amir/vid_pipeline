name: One-time audio and Release E2E

on:
  push:
    branches: [feature/audio-input-support]
    paths: [.github/bootstrap/audio-release-e2e.trigger]

permissions:
  contents: write

concurrency:
  group: audio-release-e2e-once
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_TAG: audio-e2e-${{ github.run_id }}
      ASSET_NAME: speech-e2e.wav
      VID_PIPELINE_RELEASE_TOKEN: ${{ github.token }}
      VID_PIPELINE_ACCURACY_MODE: "off"
      AI_REVIEW_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded E2E dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install -e '.[worker]'

      - name: Generate and probe real speech audio
        run: |
          set -euo pipefail
          mkdir -p /tmp/audio-e2e
          espeak-ng -v en-us -s 135 -w "/tmp/audio-e2e/$ASSET_NAME" \
            "This is a short audio pipeline end to end validation. The transcript must preserve this sentence."
          ffprobe -v error -show_entries format=duration -of default=nw=1 "/tmp/audio-e2e/$ASSET_NAME"

      - name: Run real local audio ASR
        run: |
          set -euo pipefail
          vid-pipeline run-file "/tmp/audio-e2e/$ASSET_NAME" \
            --output-root e2e/local --model tiny --device cpu --compute-type int8 \
            --language en --audio-profile safe --no-editorial
          test "$(find e2e/local -path '*/delivery/*' -type f | wc -l)" -eq 3

      - name: Create private-by-token Release fixture and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          python - <<'PY' >/tmp/release.json
          import json, os
          print(json.dumps({
              "tag_name": os.environ["RELEASE_TAG"],
              "name": "Temporary audio E2E fixture",
              "draft": False,
              "prerelease": True,
              "target_commitish": os.environ["GITHUB_SHA"],
          }))
          PY
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" \
            --data-binary @/tmp/release.json "$api/releases" >/tmp/created-release.json
          release_id=$(python -c 'import json; print(json.load(open("/tmp/created-release.json"))["id"])')
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: audio/wav" \
            --upload-file "/tmp/audio-e2e/$ASSET_NAME" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$ASSET_NAME" \
            >/tmp/uploaded-asset.json

      - name: Run real GitHub Release audio ASR
        run: |
          set -euo pipefail
          vid-pipeline run-github-release "$GITHUB_REPOSITORY" "$RELEASE_TAG" \
            --asset-name "$ASSET_NAME" --download-root /tmp/release-download \
            --output-root e2e/release --model tiny --device cpu --compute-type int8 \
            --language en --audio-profile safe --no-editorial
          test "$(find e2e/release -path '*/delivery/*' -type f | wc -l)" -eq 3
          source=$(find e2e/release -name source.json -type f -print -quit)
          python - "$source" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          provenance = data["provenance"]
          assert provenance["source"] == "github_release"
          assert provenance["repository"]
          assert provenance["tag"]
          assert provenance["asset_id"] > 0
          assert provenance["size"] > 0
          assert "token" not in json.dumps(provenance).lower()
          PY

      - name: Record E2E evidence
        if: success()
        run: |
          python - <<'PY' >audio-release-e2e.json
          import json, os
          from pathlib import Path
          print(json.dumps({
              "status": "PASS",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "git_sha": os.environ["GITHUB_SHA"],
              "local_delivery_files": len(list(Path("e2e/local").glob("*/delivery/*"))),
              "release_delivery_files": len(list(Path("e2e/release").glob("*/delivery/*"))),
              "semantic_review_invoked": False,
          }, indent=2))
          PY

      - name: Upload E2E evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audio-release-e2e-${{ github.run_id }}
          path: audio-release-e2e.json
          retention-days: 3

      - name: Delete temporary Release and tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          if [[ -n "${RELEASE_ID:-}" ]]; then
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$api/releases/$RELEASE_ID"
          fi
          encoded=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_TAG"], safe=""))')
          status=$(curl -sS -o /tmp/tag-delete -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/git/refs/tags/$encoded")
          test "$status" = 204 || test "$status" = 404
